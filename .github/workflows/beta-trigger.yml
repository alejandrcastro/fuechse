# Runs on every push to dev: runs the rule tests, and when they pass, "Pages (main + beta)"
# (which runs on main, the branch allowed to deploy) publishes the new beta.
# If a test fails, this run is red and the beta is NOT updated.
name: Beta trigger

on:
  push:
    branches: [dev]

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test TVBB rules (tests/rules.test.js)
        run: node tests/rules.test.js
      - run: echo "dev updated → Pages (main + beta) will republish /beta/"
