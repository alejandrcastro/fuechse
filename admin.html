<style>
:root{
  --green:#2d6a4f;--green-light:#40916c;--court:#74c69d;
  --white:#f0f2f1;--dark:#161616;--card:#1e1e1e;--muted:#a8b8b0;
  --warn:#f4a261;--danger:#ff6b5b;--info:#4ea8de;--red:#c0392b;
  --border:#252525;--border2:#333
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'DM Sans',sans-serif;background:var(--dark);color:var(--white);min-height:100vh}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:var(--dark)}
::-webkit-scrollbar-thumb{background:#333;border-radius:3px}
::-webkit-scrollbar-thumb:hover{background:var(--green)}

header{background:#111;padding:14px 28px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border2);position:sticky;top:0;z-index:100;flex-wrap:wrap;gap:8px}
.logo{display:flex;align-items:center;gap:10px}
.logo-img{width:36px;height:36px;object-fit:contain;flex-shrink:0}
.logo h1{font-family:'Bebas Neue',sans-serif;font-size:22px;letter-spacing:2px}
.logo span{font-size:11px;color:var(--muted);letter-spacing:1px;text-transform:uppercase;display:block}
.header-right{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.tvbb-badge{background:#1a2e26;border:1px solid var(--court)44;color:var(--court);font-size:11px;font-weight:600;padding:3px 9px;border-radius:20px;letter-spacing:1px}
.sync-badge{font-size:11px;font-weight:600;padding:3px 9px;border-radius:20px;transition:all .3s;white-space:nowrap}
.sync-ok{background:#1a2a1a;border:1px solid var(--court)55;color:var(--court)}
.sync-err{background:#3d1a1a;border:1px solid var(--danger)55;color:var(--danger)}
.sync-ing{background:#2e2a1a;border:1px solid var(--warn)55;color:var(--warn)}
.lang-bar{display:flex;gap:4px}
.lang-btn{padding:3px 8px;font-size:11px;font-weight:600;border:1px solid var(--border2);border-radius:6px;cursor:pointer;background:transparent;color:var(--muted);font-family:'DM Sans',sans-serif;transition:all .15s}
.lang-btn:hover{color:var(--white)}
.lang-btn.active{background:var(--green);color:#fff;border-color:var(--green-light)}
.tabs{display:flex;padding:0 28px;background:#111;border-bottom:1px solid var(--border2);overflow-x:auto}
.tab{padding:11px 18px;font-size:13px;font-weight:500;color:var(--muted);cursor:pointer;border-bottom:3px solid transparent;transition:all .2s;white-space:nowrap;background:none;border-top:none;border-left:none;border-right:none;font-family:'DM Sans',sans-serif}
.tab:hover{color:var(--white)}
.tab.active{color:var(--court);border-bottom-color:var(--court)}
main{padding:22px 28px;max-width:1080px;margin:0 auto}
.section{display:none}.section.active{display:block}
.section-title{font-family:'Bebas Neue',sans-serif;font-size:28px;letter-spacing:2px;color:var(--court);margin-bottom:3px}
.section-sub{color:var(--muted);font-size:12px;margin-bottom:18px}
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:15px 19px;margin-bottom:11px}
.card-title{font-weight:600;font-size:13px;color:var(--white);margin-bottom:9px}
.form-row{display:flex;gap:9px;margin-bottom:9px;flex-wrap:wrap}
.form-group{display:flex;flex-direction:column;gap:5px;flex:1;min-width:120px}
label{font-size:11px;color:var(--muted);font-weight:500;letter-spacing:.5px;text-transform:uppercase}
input,select{background:#111;border:1px solid var(--border2);border-radius:8px;color:var(--white);padding:7px 10px;font-family:'DM Sans',sans-serif;font-size:13px;transition:border-color .2s;outline:none;width:100%}
input:focus,select:focus{border-color:var(--court)}
select option{background:#1b2926}
.btn{padding:7px 15px;border-radius:8px;border:none;font-family:'DM Sans',sans-serif;font-size:13px;font-weight:600;cursor:pointer;transition:all .2s}
.btn-primary{background:var(--red);color:#fff}
.btn-primary:hover{background:var(--court);color:#fff}
.btn-danger{background:transparent;border:1px solid var(--danger);color:var(--danger);font-size:11px;padding:3px 7px}
.btn-danger:hover{background:#c0392b;color:#fff}
.btn-sm{padding:4px 10px;font-size:11px}
.btn-outline{background:transparent;border:1px solid var(--green-light);color:var(--court)}
.btn-outline:hover{background:var(--green-light);color:#fff}
.btn-warn{background:var(--warn);color:var(--dark);border:none}
.player-row{display:flex;align-items:center;gap:9px;background:#181818;border:1px solid var(--border);border-radius:10px;padding:8px 12px;margin-bottom:6px;transition:border-color .2s;flex-wrap:wrap}
.player-row:hover{border-color:var(--court)55}
.player-avatar{width:30px;height:30px;background:var(--green);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#d8f3dc;flex-shrink:0}
.player-name{font-weight:600;font-size:13px;flex:1;min-width:120px}
.player-meta{font-size:11px;color:var(--muted)}
.lk-badge{background:#1a2e26;color:var(--court);border:1px solid var(--court)33;font-size:11px;font-weight:700;padding:2px 6px;border-radius:6px;min-width:46px;text-align:center;white-space:nowrap}
.year-badge{background:#181818;border:1px solid var(--border);color:var(--muted);font-size:11px;padding:2px 6px;border-radius:6px;white-space:nowrap}
.team-chip{font-size:11px;font-weight:600;padding:2px 7px;border-radius:12px;background:#2e4a42;color:var(--muted);white-space:nowrap}
.team-chip.m{background:#1a2d3d;color:var(--info)}
.team-chip.f{background:#2d1a2d;color:#c77dff}
.warn-badge{font-size:11px;font-weight:700;padding:2px 7px;border-radius:12px;background:#2d2215;color:var(--warn);border:1px solid var(--warn)44;white-space:nowrap}
.match-teams{font-family:'Bebas Neue',sans-serif;font-size:18px;letter-spacing:1px}
.match-vs{color:var(--court);margin:0 5px}
.match-info{font-size:11px;color:var(--muted);margin-top:2px}
.avail-table{width:100%;border-collapse:collapse}
.um-lbl{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:3px}
.avail-table th{font-size:11px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.5px;padding:6px 10px;text-align:left;border-bottom:1px solid #2e4a42}
.avail-table td{padding:7px 10px;border-bottom:1px solid #1b292611;font-size:12px;vertical-align:middle}
.avail-table tr:last-child td{border-bottom:none}
.avail-table tr:hover td{background:#22222255}
.avail-btn{padding:3px 9px;border-radius:6px;border:1px solid transparent;font-size:11px;font-weight:600;cursor:pointer;transition:all .15s;font-family:'DM Sans',sans-serif}
.avail-btn.yes{background:var(--green)55;color:var(--court);border-color:var(--court)44}
.avail-btn.yes.active{background:var(--green);color:#fff;border-color:var(--court)}
.avail-btn.no{background:#3d1a1a55;color:#ff6b5b;border-color:#ff6b5b44}
.avail-btn.no.active{background:#c0392b;color:#fff;border-color:#ff6b5b}
.avail-btn.maybe{background:#2e2a1a55;color:var(--warn);border-color:var(--warn)44}
.avail-btn.maybe.active{background:var(--warn);color:var(--dark);border-color:var(--warn)}
.stats-row{display:flex;gap:9px;margin-bottom:18px;flex-wrap:wrap}
.stat-card{background:#1c1c1c;border:1px solid var(--border);border-radius:10px;padding:11px 15px;flex:1;min-width:80px;text-align:center}
.stat-num{font-family:'Bebas Neue',sans-serif;font-size:28px;color:var(--court);line-height:1}
.stat-label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-top:2px}
.upload-area{border:1.5px dashed var(--border2);border-radius:10px;padding:1.6rem;text-align:center;cursor:pointer;transition:border-color .2s}
.upload-area:hover,.upload-area.drag-over{border-color:var(--court);background:rgba(116,198,157,.04)}
.upload-area strong{font-size:14px;color:var(--white)}
.upload-area p{font-size:12px;color:var(--muted);margin-top:5px}
.team-section-header{font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;padding:6px 12px;background:#141414;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px}
.autocomplete-wrap{position:relative}
.ac-list{position:absolute;top:100%;left:0;right:0;background:#1e1e1e;border:1px solid var(--border2);border-radius:8px;z-index:50;max-height:220px;overflow-y:auto;box-shadow:0 8px 24px rgba(0,0,0,.4);margin-top:3px}
.ac-item{padding:8px 12px;font-size:13px;cursor:pointer;color:var(--white);display:flex;align-items:center;gap:8px}
.ac-item:hover{background:#2a2a2a}
.ac-item .ac-meta{font-size:11px;color:var(--muted);margin-left:auto}
.ac-item.blocked{opacity:.6}
.rule-box{background:#181818;border-left:3px solid var(--court);border-radius:0 8px 8px 0;padding:8px 12px;margin:9px 0;font-size:12px;color:var(--muted);line-height:1.6}
.rule-box.warn{border-left-color:var(--warn)}
.rule-box.danger{border-left-color:var(--danger)}
.rule-box strong{color:var(--white)}
.empty{text-align:center;padding:2.5rem 20px;color:var(--muted);font-size:13px}
.modal-overlay{position:fixed;inset:0;background:#000000bb;z-index:200;display:none;align-items:center;justify-content:center;padding:20px}
.modal-overlay.open{display:flex}
.modal{background:#1e1e1e;border:1px solid var(--border2);border-radius:16px;padding:20px;width:100%;max-width:560px;max-height:88vh;overflow-y:auto}
.modal-title{font-family:'Bebas Neue',sans-serif;font-size:20px;letter-spacing:1px;color:var(--court);margin-bottom:12px}
.modal-close{float:right;cursor:pointer;color:var(--muted);font-size:18px;background:none;border:none}
.spinner{display:inline-block;width:12px;height:12px;border:2px solid var(--muted);border-top-color:var(--court);border-radius:50%;animation:spin .7s linear infinite;vertical-align:middle;margin-right:5px}
@keyframes spin{to{transform:rotate(360deg)}}
.g-m{background:#1a1a2e;color:#7eb8e0;border:1px solid #4ea8de44;font-size:11px;font-weight:700;padding:1px 6px;border-radius:10px}
.g-f{background:#2d1a2d;color:#c77dff;border:1px solid #c77dff44;font-size:11px;font-weight:700;padding:1px 6px;border-radius:10px}
.g-x{font-size:11px;font-weight:700;padding:1px 6px;border-radius:10px;border:1px solid transparent;background:linear-gradient(90deg,#1a1a2e 50%,#2d1a2d 50%) padding-box,linear-gradient(90deg,#4ea8de44 50%,#c77dff44 50%) border-box}
.g-x>span{background:linear-gradient(90deg,#7eb8e0 50%,#c77dff 50%);-webkit-background-clip:text;background-clip:text;color:transparent}
.block-panel{background:#1e1212;border:1px solid var(--danger)44;border-radius:10px;padding:12px 15px;margin-bottom:10px}
.block-panel-title{font-size:12px;font-weight:600;color:var(--danger);margin-bottom:8px;text-transform:uppercase;letter-spacing:.5px}
.warn-panel{background:#1e1a0e;border:1px solid var(--warn)44;border-radius:10px;padding:12px 15px;margin-bottom:10px}
.warn-panel-title{font-size:12px;font-weight:600;color:var(--warn);margin-bottom:8px;text-transform:uppercase;letter-spacing:.5px}
@media(max-width:640px){
  main{padding:12px}
  header{padding:10px 12px}
  .tabs{padding:0 12px}
  .lineup-grid{grid-template-columns:1fr}
  .sa-grid{grid-template-columns:1fr!important;min-height:auto!important}
  .sa-sidebar{border-right:none!important;border-bottom:1px solid var(--border2);padding:12px!important;max-height:none}
  #sa-content-wrap{padding:12px!important}
  #sa-team-sidebar{display:flex;flex-wrap:wrap;gap:6px}
  #sa-team-sidebar .team-btn,#sa-team-sidebar button{flex:0 0 auto}
  /* Make tables scrollable on mobile */
  table{font-size:11px}
  /* Reduce padding in match cards */
  .lineup-slot{padding:8px!important}
  /* Stack header buttons */
  .section-header{flex-wrap:wrap;gap:6px}
  /* Smaller fonts for mobile */
  h1,h2{font-size:18px}
}
#sec-spieleadmin{padding:0!important}
</style>

<div id="login-overlay" style="position:fixed;inset:0;background:#0d1a10;display:flex;align-items:center;justify-content:center;z-index:9999;font-family:'DM Sans',sans-serif;">
  <div style="background:#1e1e1e;border:1px solid #333;border-radius:14px;padding:36px 32px;width:100%;max-width:340px;box-shadow:0 20px 60px rgba(0,0,0,.6);">
    <div style="text-align:center;margin-bottom:28px">
      <img src="logo.svg" alt="Füchse Berlin" style="width:56px;height:56px;object-fit:contain;display:block;margin:0 auto 10px">
      <div style="font-family:'Bebas Neue',sans-serif;font-size:1.6rem;letter-spacing:.1em;color:#74c69d">FÜCHSE BERLIN</div>
      <div style="font-size:.7rem;color:#a8b8b0;letter-spacing:.1em;text-transform:uppercase;margin-top:2px">Sportwart</div>
    </div>
    <div style="margin-bottom:12px">
      <label style="font-size:.7rem;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:#a8b8b0;display:block;margin-bottom:5px" data-ct="username">Benutzername</label>
      <input id="login-user" type="text" autocomplete="username" autocapitalize="none" spellcheck="false"
        style="width:100%;background:#111;border:1px solid #333;border-radius:8px;color:#f0f0f0;padding:9px 12px;font-family:'DM Sans',sans-serif;font-size:.9rem;outline:none"
        placeholder="Benutzername" data-ct-ph="username"
        onkeydown="if(event.key==='Enter')document.getElementById('login-pass').focus()">
    </div>
    <div style="margin-bottom:20px">
      <label style="font-size:.7rem;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:#a8b8b0;display:block;margin-bottom:5px" data-ct="password">Passwort</label>
      <input id="login-pass" type="password" autocomplete="off"
        style="width:100%;background:#111;border:1px solid #333;border-radius:8px;color:#f0f0f0;padding:9px 12px;font-family:'DM Sans',sans-serif;font-size:.9rem;outline:none"
        onkeydown="if(event.key==='Enter')doLogin()">
    </div>
    <button id="login-btn" onclick="doLogin()" style="width:100%;padding:11px;border-radius:8px;border:none;background:#2d6a4f;color:#fff;font-family:'DM Sans',sans-serif;font-size:.9rem;font-weight:600;cursor:pointer" data-ct="loginBtn">Einloggen</button>
    <div id="login-error" style="margin-top:12px;font-size:.8rem;color:#ff6b5b;text-align:center;min-height:18px;font-weight:500"></div>
  </div>
</div>
<script>
// Supabase Auth
(function(){
  // Load Supabase JS SDK
  const s=document.createElement('script');
  // supabase-js 2.118.0 is in the repo (vendor/), so no new version can slip in by itself; integrity = SHA-384 of that file
  s.src='vendor/supabase-2.118.0.js';s.integrity='sha384-TcHRA3zBbn+Lexh5n+Oil4guNPOS3rjNDpGRAN46u/s/mB2IZ50ceC6TYDU2yvgK';
  s.onload=function(){
    const _sb=window.supabase.createClient(
      'https://kepbpcttbvkbcckqoecv.supabase.co',
      'sb_publishable_wDzLASMHgyEcQh8RPmfPRA_HfJotf-n'
    );
    window._sbAuth=_sb;

    // Check existing session
    _sb.auth.getSession().then(({data:{session}})=>{
      if(session&&isAdminUser(session)){
        window._sbAuth._session=session;
        document.getElementById('login-overlay').style.display='none';
        if(typeof loadAll==='function')loadAll();
      }
    });

    
// ── LOGIN RATE LIMITING ──
const _rl={attempts:0,lockedUntil:0};
function _rlCheck(errEl){
  const now=Date.now();
  if(_rl.lockedUntil>now){
    const secs=Math.ceil((_rl.lockedUntil-now)/1000);
    errEl.textContent=ct('tooManyWait')(secs);
    return false;
  }
  return true;
}
function _rlFail(errEl){
  _rl.attempts++;
  const timeout=_rl.attempts>=5?5*60*1000*(_rl.attempts-4):0;
  if(timeout>0){
    _rl.lockedUntil=Date.now()+timeout;
    const mins=Math.ceil(timeout/60000);
    errEl.textContent=ct('tooManyLocked')(mins);
  } else {
    errEl.textContent=ct('wrongLogin');
  }
  setTimeout(()=>{if(Date.now()>=_rl.lockedUntil)errEl.textContent='';},3000);
}
function _rlSuccess(){_rl.attempts=0;_rl.lockedUntil=0;}
// ── USERNAMES ── Supabase Auth needs an email, so a username "herren" logs in as "herren@login.fuechse-berlin-reinickendorf.de".
// Create users in Supabase → Authentication → Add user, with that address and "Auto Confirm User". No mail is ever sent.
const LOGIN_DOMAIN='login.fuechse-berlin-reinickendorf.de';
function usernameToEmail(u){u=(u||'').trim().toLowerCase();if(!u.includes('@'))u=u.replace(/\s+/g,''); // "Herren 30 II" → herren30ii
  return u.includes('@')?u:`${u}@${LOGIN_DOMAIN}`;}
function emailToUsername(e){e=(e||'').toLowerCase();return e.endsWith('@'+LOGIN_DOMAIN)?e.slice(0,-(LOGIN_DOMAIN.length+1)):e;}
// ── ADMIN ACCESS ── only these usernames may open admin.html (visual check, like the Kapitän blocks)
const ADMIN_USERS=['admin','christian','svenja'];
function isAdminUser(session){return ADMIN_USERS.includes(emailToUsername(session?.user?.email));}
window.doLogin=async function(){
      const email=usernameToEmail(document.getElementById('login-user').value);
      const pass=document.getElementById('login-pass').value;
      const err=document.getElementById('login-error');
      const btn=document.getElementById('login-btn');
      if(!_rlCheck(err))return;
      err.textContent='';btn.textContent='...';btn.disabled=true;
      const {data,error}=await _sb.auth.signInWithPassword({email,password:pass});
      if(data?.session)window._sbAuth._session=data.session;
      btn.textContent='Einloggen';btn.disabled=false;
      if(error){
        _rlFail(err);
        document.getElementById('login-pass').value='';
      } else if(!isAdminUser(data.session)){
        // Valid captain login, but no admin access (session is kept so kapitaen.html still works)
        window._sbAuth._session=null;
        document.getElementById('login-pass').value='';
        err.textContent='Kein Zugang zum Admin-Bereich';
      } else {
        const o=document.getElementById('login-overlay');
        o.style.opacity='0';o.style.transition='opacity .3s';
        setTimeout(()=>{o.style.display='none';if(typeof loadAll==='function')loadAll();},300);
      }
    };

    _sb.auth.onAuthStateChange((event,session)=>{
      window._sbAuth._session=session||null;
      if(event==='SIGNED_OUT')location.reload();
    });
  };
  document.head.appendChild(s);
})();
</script>

<script>
pdfjsLib.GlobalWorkerOptions.workerSrc='vendor/pdf.worker-3.11.174.min.js';

// ── ACTIVE SEASON ── switched in admin.html (header). Stored in Supabase → app_settings.
// Format: 'S2026' = Sommer 2026, 'W2026' = Winter 2026/27. The value below is only a fallback.
let ACTIVE_SEASON='W2026';
let ACTIVE_SEASON_KIND='Winter';
// PUBLISHED_SEASON = what kapitaen / index / umfrage use (app_settings).
// ACTIVE_SEASON in admin = the season the Sportwart is looking at / preparing (this browser only).
let PUBLISHED_SEASON='W2026';
const ADMIN_SEASON_KEY='fcb_admin_season';
const _seasonReady=(async()=>{
  const v=await _readSetting('active_season');
  if(typeof v==='string'&&/^[SW]\d{4}$/.test(v))PUBLISHED_SEASON=v;
  let view=null;try{view=localStorage.getItem(ADMIN_SEASON_KEY);}catch(e){}
  ACTIVE_SEASON=(view&&/^[SW]\d{4}$/.test(view))?view:PUBLISHED_SEASON;
  ACTIVE_SEASON_KIND=ACTIVE_SEASON.startsWith('W')?'Winter':'Sommer';
})();
const HDR={'apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY,'Content-Type':'application/json'};
function getHDR(){
  // Use session JWT if available, otherwise fall back to publishable key
  const session=window._sbAuth?._session||null;
  const token=session?.access_token||SB_KEY;
  return{'apikey':SB_KEY,'Authorization':'Bearer '+token,'Content-Type':'application/json'};
}

async function sbGet(t,p=''){const r=await fetch(`${SB_URL}/rest/v1/${t}?${p}`,{headers:{...getHDR(),'Prefer':''}});if(!r.ok)throw new Error(await r.text());return r.json();}
async function sbUpsert(t,d){const r=await fetch(`${SB_URL}/rest/v1/${t}`,{method:'POST',headers:{...getHDR(),'Prefer':'resolution=merge-duplicates'},body:JSON.stringify(Array.isArray(d)?d:[d])});if(!r.ok)throw new Error(await r.text());}
async function sbDelete(t,f){const r=await fetch(`${SB_URL}/rest/v1/${t}?${f}`,{method:'DELETE',headers:getHDR()});if(!r.ok)throw new Error(await r.text());}

function setSync(s,m){const b=document.getElementById('sync-badge');b.className='sync-badge sync-'+s;b.textContent=m;}

// Gender badge: M (blue), F (purple), X = MIXED (half blue / half purple)
function genderBadge(g){if(g==='X')return'<span class="g-x"><span>MIXED</span></span>';return g==='F'?'<span class="g-f">F</span>':'<span class="g-m">M</span>';}
// ── IMPORT CUT (local club rule): players with LK worse than this are NOT assigned to Herren I on import,
// unless Herren I is their own Stammkader team. Only affects which lists a player lands in.
const H1_MAX_LK=18;
function skipForImport(teamCategory,teamNumber,isStammTeam,lk){return !isStammTeam&&teamCategory==='Herren'&&teamNumber===1&&lk!=null&&lk>H1_MAX_LK;}

function blockReasonForTeam(playerId,teamId){
  const team=teamById(teamId);if(!team)return'';
  const status=getPlayerBlockStatus(playerId,team.category);
  const reasons=[];
  if(status.stammkaderBlocked.some(t=>t.id===teamId))reasons.push(`Stammkader ${status.stammkaderTeam?.name||''}`);
  if(status.stammmannschaftBlocked.some(t=>t.id===teamId))reasons.push(`Stammmannschaft (2× ${status.stammmannschaftSource})`);
  return reasons.join(' · ');
}

// ── LOAD ──
let _loadAllRunning=false;
async function loadAll(){
  if(_loadAllRunning)return;
  _loadAllRunning=true;
  await _seasonReady;
  if(typeof renderSeasonSwitch==='function')renderSeasonSwitch();
  {const ts=document.getElementById('t-season');if(ts)ts.value=ACTIVE_SEASON_KIND;} // E4: new teams default to the season being viewed
  setSync('ing',tr('syncIng'));
  try{
    // Active season only (R1) and only the columns that are used (R2): teams + players first, then what belongs to them
    const[teams,players]=await Promise.all([
      sbGet('teams',`season_id=eq.${ACTIVE_SEASON}&order=category,team_number`),
      sbGetAll('players',`season_id=eq.${ACTIVE_SEASON}&order=lk,id`)
    ]);
    const _tids=teams.map(t=>t.id);
    const[matches,countRows,ptAll]=await Promise.all([
      sbGetIn('matches','team_id',_tids,'order=date,id'),
      sbGetIn('player_match_counts','team_id',_tids,'select=player_id,team_id,matches_played&order=player_id,team_id'),
      sbGetIn('player_teams','team_id',_tids,'select=player_id,team_id,rank,is_mainteam&order=player_id,team_id')
    ]);
    const _mids=matches.map(m=>m.id);
    const[avRows,lineupRows]=await Promise.all([
      sbGetIn('availability','match_id',_mids,'select=match_id,player_id,status&order=match_id,player_id'),
      sbGetIn('lineups','match_id',_mids,'select=match_id,slots&order=match_id')
    ]);
    state.teams=teams.map(t=>({id:t.id,name:t.name,liga:t.liga,season:t.season,is_4er:t.is_4er||false,category:t.category||'Herren',teamNumber:t.team_number||1,gender:t.gender||catGender(t.category)}));
    const _activeTeamIds=new Set(state.teams.map(t=>t.id));
    state.players=players.map(p=>({id:p.id,name:p.name,rawName:p.raw_name,idnr:p.idnr,lk:p.lk,lkStr:p.lk_str,year:p.year,teamIds:[],gender:p.gender||'M',rank:p.rank}));
    const _seasonMatches=matches.filter(m=>_activeTeamIds.has(m.team_id)).map(m=>({id:m.id,teamId:m.team_id,opponent:m.opponent,date:m.date,time:m.time,home:m.home,venue:m.venue,counted:m.counted||false,ersatzCounted:m.ersatz_counted||false,status:m.status||null,movedTo:m.moved_to||null,movedFrom:m.moved_from||null,spieltag:m.spieltag||null,countedPlayers:Array.isArray(m.counted_players)?m.counted_players:null}));
    // Verlegt (rescheduled in kapitaen.html): the original is archived and ignored everywhere in admin
    state.matches=_seasonMatches.filter(m=>m.status!=='verlegt');
    state.movedMatches=_seasonMatches.filter(m=>m.status==='verlegt');
    state.availability={};
    for(const r of avRows){if(!state.availability[r.match_id])state.availability[r.match_id]={};state.availability[r.match_id][r.player_id]=r.status;}
    state.lineups={};
    for(const r of lineupRows)state.lineups[r.match_id]=r.slots;
    state.matchCounts={};
    for(const r of countRows){if(!state.matchCounts[r.player_id])state.matchCounts[r.player_id]={};state.matchCounts[r.player_id][r.team_id]=r.matches_played;}
    const ptRows=ptAll;
    state.rankByTeam={};
    state.mainTeam={};
    for(const r of ptRows){
      if(!_activeTeamIds.has(r.team_id))continue; // other seasons stay archived
      const p=state.players.find(x=>x.id===r.player_id);
      if(p&&!p.teamIds.includes(r.team_id))p.teamIds.push(r.team_id);
      if(r.rank!=null){if(!state.rankByTeam[r.player_id])state.rankByTeam[r.player_id]={};state.rankByTeam[r.player_id][r.team_id]=r.rank;}
      if(r.is_mainteam){if(!state.mainTeam[r.player_id])state.mainTeam[r.player_id]={};state.mainTeam[r.player_id][r.team_id]=true;}
    }
    setSync('ok',tr('syncOk'));
    renderAll();
  }catch(e){setSync('err',tr('syncErr'));console.error(e);}
  finally{_loadAllRunning=false;}
}

}

// ── DRAG & DROP SETUP ──
function setupDrop(zoneId,inputId,handler){
  const zone=document.getElementById(zoneId);if(!zone)return;
  zone.addEventListener('dragover',e=>{e.preventDefault();zone.classList.add('drag-over');});
  zone.addEventListener('dragleave',()=>zone.classList.remove('drag-over'));
  zone.addEventListener('drop',e=>{e.preventDefault();zone.classList.remove('drag-over');const f=e.dataTransfer.files[0];if(f)handler(f);});
}

// ── PLAYERS PDF PARSER ──
document.getElementById('pdf-input').addEventListener('change',async e=>{
  const files=Array.from(e.target.files);if(!files.length)return;
  document.getElementById('parse-status').textContent='...';
  let allP=[],allT=[];
  for(const file of files){try{const res=await parsePDF(file);allP=allP.concat(res.players);for(const t of res.teams)if(!allT.find(x=>x.name===t.name))allT.push(t);}catch(err){console.error(err);}}
  state._pending={players:allP,teams:allT};
  showPreview(state._pending);
  document.getElementById('parse-status').textContent=T[lang].parsedMsg(allP.length,files.length);
  e.target.value='';
});

async function parsePDF(file){
  const ab=await file.arrayBuffer();
  const pdf=await pdfjsLib.getDocument({data:ab}).promise;
  let txt='';
  for(let i=1;i<=pdf.numPages;i++){const pg=await pdf.getPage(i);const tc=await pg.getTextContent();txt+=tc.items.map(x=>x.str).join(' ')+'\n';}
  return extractPlayers(txt);
}

function extractPlayers(text){
  const teams={};
  // Team headers come one after another on the same line ("Herren (4er) | Verbandsliga I  MF: …  Herren II (4er) | …"),
  // so the liga capture must stop at "MF:", the next header or the player table ("Ra.")
  // Jugend headers: "U18m", "U18 w II", "U12 III", "Midcourt U10 m w"
  const tPat=/(Herren\s*(?:\d+\s*)?(?:II|III|IV|V|VI|VII)?|Damen\s*(?:\d+\s*)?(?:II|III|IV|V)?|(?:Midcourt\s+)?U\s?\d+\s*(?:m\s*w|m|w)?\s*(?:II|III|IV|V)?)\s*(?:\(4er\))?\s*\|\s*([^|\n\r]+?)(?=\s+MF:|\s+(?:Herren|Damen|Midcourt|U\s?\d+)\b|\s+Ra\.|[\n\r]|$)/gi;
  let tm;
  while((tm=tPat.exec(text))!==null){
    let raw=tm[1].trim().replace(/\s+/g,' ');
    const roman={I:1,II:2,III:3,IV:4,V:5,VI:6,VII:7,VIII:8};
    const romanMatch=raw.match(/\s(VIII|VII|VI|IV|V|III|II|I)$/);
    const tnum=romanMatch?roman[romanMatch[1]]:1;
    let category;
    const jm=raw.match(/^(?:Midcourt\s+)?U\s?(\d+)\s*(m\s*w|m|w)?/i);
    if(jm){
      // Same names as the ResultReport import: U18m, U18w, U12, U10 (+ II, III…)
      const g=(jm[2]||'').replace(/\s/g,'').toLowerCase();
      category=`U${jm[1]}${g==='m'?'m':g==='w'?'w':''}`;
      raw=category+(romanMatch?' '+romanMatch[1]:'');
    }else{
      const catMatch=raw.match(/^(Herren|Damen)(?:\s+(\d+))?/i);
      const baseCat=catMatch?catMatch[1].charAt(0).toUpperCase()+catMatch[1].slice(1).toLowerCase():'Herren';
      const ageGroup=catMatch&&catMatch[2]?catMatch[2]:null;
      category=ageGroup?`${baseCat} ${ageGroup}`:baseCat;
    }
    const liga=tm[2].trim().replace(/MF:.*/,'').trim();
    if(!teams[raw])teams[raw]={liga,id:uid(),is4:tm[0].includes('(4er)'),category,tnum,gender:catGender(category)};
  }
  const teamArr=Object.entries(teams).map(([name,v])=>({id:v.id,name,liga:v.liga,season:ACTIVE_SEASON_KIND,is_4er:v.is4||false,category:v.category,team_number:v.tnum,gender:v.gender}));
  const players=[];
  // Names may contain any Latin accent (Nicolás, Sören, Hoßfeld…)
  const pPat=/(\d{1,3})\s+([A-Za-zÀ-ÖØ-öø-ÿĀ-ž][A-Za-zÀ-ÖØ-öø-ÿĀ-ž\s,.\-\']+?)\s+\((\d{4})\)\s+(?:[A-Z]{2,3}\*?\s+)?(\d{7,9})\s+(LK[\d,]+|-)/g; // "-" = no LK yet (common in Jugend)
  let m;
  while((m=pPat.exec(text))!==null){
    const rank=parseInt(m[1]),name=m[2].trim(),year=m[3],idnr=m[4];
    const lkStr=m[5]==='-'?'–':m[5];
    const lk=m[5]==='-'?null:parseFloat(m[5].replace('LK','').replace(',','.'));
    // Walk teams in order to find which team this rank belongs to
    let _rem=rank,_t=null;
    for(const _team of teamArr){const _gs=(_team.is_4er||_team.season==='Winter')?4:6;if(_rem<=_gs){_t=_team;break;}_rem-=_gs;}
    const t=_t||teamArr[teamArr.length-1]||null;
    const gender=t?catGender(t.category):'M';
    players.push({rank,name,year,idnr,lkStr,lk,teamId:t?.id||null,teamName:t?.name||'?',teamCategory:t?.category||'Herren',gender});
  }
  return{players,teams:teamArr};
}

function showPreview(data){
  if(!data||!data.players.length){document.getElementById('preview-section').style.display='none';return;}
  // Show what confirmImport will store: each team gets its Stammkader players AND everyone ranked below
  // (Herren = all, Herren II = all minus first block, Herren III = all minus first two blocks, …)
  const tIdx={};
  for(const cat of [...new Set(data.teams.map(t=>t.category))]){
    data.teams.filter(t=>t.category===cat).sort((a,b)=>a.team_number-b.team_number).forEach((t,i)=>{tIdx[t.name]=i;});
  }
  const byTeam={};
  for(const t of [...data.teams].sort((a,b)=>catCmp(a.category,b.category)||a.team_number-b.team_number)){
    byTeam[t.name]=data.players.filter(p=>p.teamCategory===t.category&&(tIdx[p.teamName]??-1)>=tIdx[t.name]
      &&!skipForImport(t.category,t.team_number,p.teamName===t.name,p.lk)).sort((a,b)=>a.rank-b.rank);
  }
  const _known=new Set(Object.keys(byTeam));
  for(const p of data.players){const k=p.teamName||'?';if(!_known.has(k))(byTeam[k]=byTeam[k]||[]).push(p);}
  let html='';
  for(const[team,ps]of Object.entries(byTeam)){
    const g=ps[0]?.gender||'M';
    html+=`<div class="card" style="padding:0;overflow:hidden;margin-bottom:8px">
      <div class="team-section-header">${team} ${genderBadge(g)} · ${ps.length} ${tr('players')}</div>
      ${ps.slice(0,5).map(p=>`<div class="player-row" style="border-radius:0;border:none;border-bottom:1px solid #2e4a4233;margin:0">
        <span style="color:var(--muted);min-width:18px;font-size:11px">${p.rank}</span>
        <div class="player-avatar">${initials(p.name.includes(',')?p.name.split(',')[1].trim()+' '+p.name.split(',')[0]:p.name)}</div>
        <span class="player-name">${p.name}</span>
        <span class="year-badge">${p.year}</span>
        <span class="lk-badge">${p.lkStr}</span>
      </div>`).join('')}
      ${ps.length>5?`<div style="padding:6px 12px;font-size:11px;color:var(--muted)">${T[lang].addedPlayers(ps.length-5)}</div>`:''}
    </div>`;
  }
  document.getElementById('preview-list').innerHTML=html;
  document.getElementById('preview-section').style.display='block';
}

async function confirmImport(){
  const data=state._pending;if(!data)return;
  const btn=document.querySelector('#preview-section .btn-primary');btn.textContent='...';btn.disabled=true;
  setSync('ing',tr('syncIng'));
  try{
    // Insert NEW teams; update season for existing ones if PDF says (4er)
    const teamsToInsert=data.teams.filter(t=>!state.teams.find(x=>x.name===t.name));
    if(teamsToInsert.length)await sbUpsert('teams',teamsToInsert.map(t=>({id:t.id,name:t.name,liga:t.liga,season:t.season,is_4er:t.is_4er||false,category:t.category,team_number:t.team_number,gender:t.gender,season_id:ACTIVE_SEASON})));
    // Update is_4er for existing teams detected as (4er) in PDF
    for(const t of data.teams.filter(x=>x.is_4er)){const ex=state.teams.find(x=>x.name===t.name);if(ex&&!ex.is_4er)await fetch(`${SB_URL}/rest/v1/teams?id=eq.${ex.id}`,{method:'PATCH',headers:getHDR(),body:JSON.stringify({is_4er:true})});}

    const freshTeams=await sbGet('teams',`season_id=eq.${ACTIVE_SEASON}`);
    state.teams=freshTeams.map(t=>({id:t.id,name:t.name,liga:t.liga,season:t.season,is_4er:t.is_4er||false,category:t.category||'Herren',teamNumber:t.team_number||1,gender:t.gender||catGender(t.category)}));
    const playersToInsert=[];
    const playersToUpdate=[];  // existing players whose LK may have changed
    const ptInsert=[];
    for(const p of data.players){
      const dn=p.name.includes(',')?p.name.split(',')[1].trim()+' '+p.name.split(',')[0].trim():p.name;
      const teamId=state.teams.find(x=>x.name===p.teamName)?.id||null;
      // state.players only holds ACTIVE_SEASON players → a new season creates fresh player rows
      const existing=state.players.find(x=>x.idnr===p.idnr);
      const pending=playersToInsert.find(x=>x.idnr===p.idnr); // same player in several lists of this import
      if(!existing&&!pending){
        // New player
        playersToInsert.push({id:uid(),name:dn,raw_name:p.name,idnr:p.idnr,lk:p.lk,lk_str:p.lkStr,year:p.year,gender:p.gender||'M',rank:p.rank,season_id:ACTIVE_SEASON});
      } else if(existing&&existing.lk!==p.lk){
        // Existing player with updated LK — update it
        playersToUpdate.push({id:existing.id,lk:p.lk,lk_str:p.lkStr});
      }
      // Assign to Stammkader team AND all higher (lower-numbered) teams in category.
      // A player at pos 21 (Herren IV) can play in I, II, III and IV.
      const pid2=existing?.id||playersToInsert.find(x=>x.idnr===p.idnr)?.id;
      if(pid2&&teamId){
        const catTeams=state.teams.filter(t=>t.category===p.teamCategory)
          .sort((a,b)=>teamNumber(a)-teamNumber(b));
        const stammIdx=catTeams.findIndex(t=>t.id===teamId);
        // Calculate GLOBAL rank within the category (sum of all team sizes before this team + local rank)
        // e.g. if Herren I=6, Herren II=6, and player is rank 3 in Herren III -> global rank = 6+6+3 = 15
        // "Ra." in the Namentliche Mannschaftsmeldung is already the rank within the whole category (1…N)
        const globalRank=p.rank||null;
        let assignTo=stammIdx>=0?catTeams.slice(0,stammIdx+1):[{id:teamId}];
        assignTo=assignTo.filter(at=>!skipForImport(at.category,teamNumber(at),at.id===teamId,p.lk));

        for(const at of assignTo){
          ptInsert.push({player_id:pid2,team_id:at.id,rank:globalRank});
        }
      }
    }
    if(playersToInsert.length){for(let i=0;i<playersToInsert.length;i+=100)await sbUpsert('players',playersToInsert.slice(i,i+100));}
    // Update LK for existing players individually
    for(const upd of playersToUpdate){
      await fetch(`${SB_URL}/rest/v1/players?id=eq.${upd.id}`,{method:'PATCH',headers:getHDR(),body:JSON.stringify({lk:upd.lk,lk_str:upd.lk_str})});
    }
    // Add new team assignments without removing existing ones
    if(ptInsert.length){for(let i=0;i<ptInsert.length;i+=100)await sbUpsert('player_teams',ptInsert.slice(i,i+100));}
    await loadAll();
    document.getElementById('preview-section').style.display='none';
    document.getElementById('parse-status').textContent=T[lang].importedMsg(playersToInsert.length,state.players.length);
  }catch(e){setSync('err',tr('syncErr'));console.error(e);}
  finally{btn.disabled=false;applyT();}
}

    return`<div class="player-row">

// squads in the Mannschaften tab start folded; the ones opened stay open when the list is redrawn
const _openSquads=new Set();
function _squadToggle(el){if(el.open)_openSquads.add(el.dataset.tid);else _openSquads.delete(el.dataset.tid);}
// ── Teams list: small pieces ──
// Herren → Damen → Jugend, then age group, then team number
function _teamsByCatNum(a,b){
  const cc=catCmp(a.category,b.category);if(cc)return cc;
  return teamNumber(a)-teamNumber(b);
}
function _fillTeamsFilter(sel){
  const cur=sel.value;
  sel.innerHTML=`<option value="">${tr('allTeams')}</option>`+
    [...state.teams].sort(_teamsByCatNum).map(t=>`<option value="${t.id}"${cur===t.id?' selected':''}>${t.name}</option>`).join('');
  sel.value=cur;
}
// the team's players from its first rank on (players ranked for a higher team of the category are left out)
function _squadPlayers(t){
  const catTeams=state.teams.filter(x=>x.category===t.category).sort((a,b)=>teamNumber(a)-teamNumber(b));
  const idx=catTeams.findIndex(x=>x.id===t.id);
  let rankStart=1;
  for(let i=0;i<idx;i++)rankStart+=teamSize(catTeams[i]);
  return state.players.filter(p=>{
    if(!p.teamIds.includes(t.id))return false;
    const r=playerRankInTeam(p.id,t.id);
    return r===999||r>=rankStart;
  }).sort((a,b)=>playerRankInTeam(a.id,t.id)-playerRankInTeam(b.id,t.id)||(a.lk??99)-(b.lk??99));
}
// ★ SM / ☆ button: marks the player's Stammmannschaft
function _smButton(p,t){
  const on=state.mainTeam[p.id]?.[t.id];
  return `<button id="mt-btn-${p.id}-${t.id}" onclick="toggleMainTeam('${p.id}','${t.id}')"
            title="${on?'Stammmannschaft — click to remove':'Set as Stammmannschaft'}"
            style="background:${on?'rgba(212,160,23,.12)':'transparent'};border:${on?'1.5px solid #d4a017':'1px solid #333'};color:${on?'#d4a017':'#8a9a94'};border-radius:6px;padding:2px 0;min-width:42px;text-align:center;font-size:11px;font-weight:700;cursor:pointer;transition:all .15s">
            ${on?'★ SM':'☆'}
          </button>`;
}
function _squadRow(p,i,t){
  const rank=playerRankInTeam(p.id,t.id);
  return `<div class="player-row" style="padding:6px 10px;margin-bottom:4px">
          <span style="font-family:'Bebas Neue',sans-serif;font-size:14px;color:var(--court);min-width:18px">${rank<999?rank:i+1}</span>
          <div class="player-avatar" style="width:24px;height:24px;font-size:11px">${initials(p.name)}</div>
          <span class="player-name" style="font-size:12px">${p.name}</span>
          <span class="year-badge">${p.year||'—'}</span>
          <span class="lk-badge">${p.lkStr}</span>
          ${isPlayerBlockedForTeam(p.id,t.id)?`<span class="blocked-badge">⛔</span>`:''}
          ${_smButton(p,t)}
        </div>`;
}
// the squad folds open and closed; it stays open while a single team is filtered or after the admin opened it
function _squadHtml(t,players,open){
  if(!players.length)return `<div style="color:var(--muted);font-size:12px">${tr('noTeamPlayers')}</div>`;
  const blocked=players.filter(p=>isPlayerBlockedForTeam(p.id,t.id)).length;
  return `<details class="squad" data-tid="${t.id}" ${open?'open':''} ontoggle="_squadToggle(this)">
        <summary style="cursor:pointer;font-size:12px;font-weight:600;color:var(--muted);padding:2px 0 6px">👥 ${ct('nPlayers')(players.length)}${blocked?` · ⛔ ${blocked}`:''}</summary>
        ${players.map((p,i)=>_squadRow(p,i,t)).join('')}</details>`;
}
function _teamCard(t,filterTeamId){
  return `<div class="card" style="margin-bottom:8px">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:9px">
          <div>
            <div style="display:flex;align-items:center;gap:7px">
              <span style="font-family:'Bebas Neue',sans-serif;font-size:18px;color:var(--court)">${t.name}</span>
              ${genderBadge(t.gender)}
            </div>
            <div style="font-size:11px;color:var(--muted)">${t.liga} · ${seasonKindLabel(t.season)} · #${teamNumber(t)}</div>
          </div>
          <div style="display:flex;gap:6px">
              <button class="btn btn-outline btn-sm" onclick="editTeamSize('${t.id}')" style="font-size:11px;padding:3px 8px" title="Toggle group size">${t.season==='Winter'?'Winter (4)':(t.is_4er?'Sommer 4er':'Sommer (6)')}</button>
              <button class="btn btn-danger" onclick="removeTeam('${t.id}')">✕</button>
            </div>
        </div>
        ${_squadHtml(t,_squadPlayers(t),filterTeamId||_openSquads.has(t.id))}
      </div>`;
}
function renderTeams(){
  const el=document.getElementById('team-list');
  if(!state.teams.length){el.innerHTML=`<div class="empty">${tr('noTeam')}</div>`;return;}
  const filterSel=document.getElementById('teams-filter-team');
  if(filterSel)_fillTeamsFilter(filterSel);
  const filterTeamId=filterSel?filterSel.value:'';
  const byCat={};
  for(const t of filterTeamId?state.teams.filter(t=>t.id===filterTeamId):state.teams){const c=t.category||'Herren';(byCat[c]=byCat[c]||[]).push(t);}
  if(!Object.keys(byCat).length){el.innerHTML=`<div class="empty">${tr('noTeam')}</div>`;return;}
  let html='';
  for(const[cat,teams]of Object.entries(byCat).sort(([a],[b])=>catCmp(a,b))){
    html+=`<div style="margin-bottom:6px;font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.5px">${cat}</div>`;
    html+=teams.sort((a,b)=>teamNumber(a)-teamNumber(b)).map(t=>_teamCard(t,filterTeamId)).join('');
    html+='<div style="height:8px"></div>';
  }
  el.innerHTML=html;
}

async function editTeamSize(teamId){
  const t=state.teams.find(x=>x.id===teamId);if(!t)return;
  if(t.season==='Winter'){alert(ct('winter4'));return;}
  const new4er=!t.is_4er;
  if(!confirm(ct('to4er')(new4er)))return;
  setSync('ing',tr('syncIng'));
  try{
    const r=await fetch(`${SB_URL}/rest/v1/teams?id=eq.${teamId}`,{method:'PATCH',headers:getHDR(),body:JSON.stringify({is_4er:new4er})});
    if(!r.ok)throw new Error(await r.text());
    t.is_4er=new4er;
    setSync('ok',tr('syncOk'));
    renderTeams();
  }catch(e){setSync('err',tr('syncErr'));console.error(e);alert(ct('saveErr')+': '+e.message);}
}

async function toggleMainTeam(playerId, teamId){
  if(!state.mainTeam[playerId])state.mainTeam[playerId]={};
  const cur=!!state.mainTeam[playerId][teamId];
  const next=!cur;
  state.mainTeam[playerId][teamId]=next;
  const btn=document.getElementById(`mt-btn-${playerId}-${teamId}`);
  if(btn){
    btn.style.border=next?'1.5px solid #d4a017':'1px solid #333';
    btn.style.color=next?'#d4a017':'#8a9a94';
    btn.style.background=next?'rgba(212,160,23,.12)':'transparent';
    btn.style.minWidth='42px';
    btn.style.padding='2px 0';
    btn.style.textAlign='center';
    btn.title=next?'Stammmannschaft — click to remove':'Set as Stammmannschaft';
    btn.textContent=next?'★ SM':'☆';
  }
  try{
    const r=await fetch(`${SB_URL}/rest/v1/player_teams?player_id=eq.${playerId}&team_id=eq.${teamId}`,
      {method:'PATCH',headers:getHDR(),body:JSON.stringify({is_mainteam:next})});
    if(!r.ok)throw new Error(await r.text());
    setSync('ok',tr('syncOk'));
  }catch(e){

  for(const t of compatible){const c=t.category||'?';if(!byCat[c])byCat[c]=[];byCat[c].push(t);}
  let html=`<div style="margin-bottom:12px;font-size:12px;color:var(--muted)">Mannschaften auswählen:</div>`;
  for(const[cat,teams]of Object.entries(byCat)){
    html+=`<div style="font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:5px">${cat}</div>`;
    for(const t of teams.sort((a,b)=>teamNumber(a)-teamNumber(b))){
      const checked=p.teamIds.includes(t.id);
      const counts=state.matchCounts[p.id]?.[t.id]||0;
      const blocked=isPlayerBlockedForTeam(p.id,t.id);

      html+=`<label style="display:flex;align-items:center;gap:8px;padding:7px 10px;background:#1b2926;border-radius:8px;margin-bottom:4px;cursor:pointer;border:1px solid ${blocked?'var(--danger)33':'#2e4a42'}">

        <span style="font-size:11px;color:var(--muted)">${counts} Sp.</span>

    <div style="font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px">${tr('matchesPlayed')}</div>
    ${state.teams.filter(t=>compatible.some(x=>x.id===t.id)).map(t=>{
      const c=state.matchCounts[p.id]?.[t.id]||0;
      return`<div style="display:flex;align-items:center;gap:8px;margin-bottom:5px;font-size:12px">

        <span style="min-width:20px;text-align:center;font-weight:600" id="cnt-${p.id}-${t.id}">${c}</span>

  </div>`;
  document.getElementById('assign-modal-body').innerHTML=html;

async function adjustCount(playerId,teamId,delta){
  if(!state.matchCounts[playerId])state.matchCounts[playerId]={};
  const cur=state.matchCounts[playerId][teamId]||0;
  const next=Math.max(0,cur+delta);
  state.matchCounts[playerId][teamId]=next;
  const el=document.getElementById(`cnt-${playerId}-${teamId}`);
  if(el)el.textContent=next;
  try{await sbUpsert('player_match_counts',[{player_id:playerId,team_id:teamId,matches_played:next}]);}catch(e){console.error(e);}
  renderBlocking();
}

async function saveAssign(playerId){
  const p=playerById(playerId);
  const checkboxes=document.querySelectorAll('#assign-modal-body input[type="checkbox"][data-tid]');
  const newTeamIds=[...checkboxes].filter(c=>c.checked).map(c=>c.getAttribute('data-tid'));
  const toRemove=p.teamIds.filter(tid=>!newTeamIds.includes(tid));
  const toAdd=newTeamIds.filter(tid=>!p.teamIds.includes(tid));
  console.log('[saveAssign] toRemove:', toRemove, 'toAdd:', toAdd);
  for(const tid of toRemove){
    const url=`${SB_URL}/rest/v1/player_teams?player_id=eq.${playerId}&team_id=eq.${tid}`;
    const r=await fetch(url,{method:'DELETE',headers:{...getHDR(),'Prefer':'return=representation'}});
    const txt=await r.text();
    console.log('[DELETE]', r.status, txt);
    // Verify it's really gone
    const check=await fetch(`${SB_URL}/rest/v1/player_teams?player_id=eq.${playerId}&team_id=eq.${tid}`,{headers:getHDR()});
    const remaining=await check.json();
    console.log('[VERIFY after DELETE] rows remaining:', remaining.length, remaining);
  }
  if(toAdd.length){
    const r=await fetch(`${SB_URL}/rest/v1/player_teams`,{method:'POST',headers:{...getHDR(),'Prefer':'resolution=merge-duplicates'},body:JSON.stringify(toAdd.map(tid=>({player_id:playerId,team_id:tid})))});
    const txt=await r.text();
    console.log('[INSERT]', r.status, txt);
  }
  closeModal('assign-modal');await loadAll();
}

// Drag & drop
function saDragStart(e,i){_saDragSrc=i;e.currentTarget.classList.add('dragging');e.dataTransfer.effectAllowed='move';}
function saDragOver(e){e.preventDefault();e.currentTarget.classList.add('drag-over');}
function saDragLeave(e){e.currentTarget.classList.remove('drag-over');}
function saDragEnd(e){e.currentTarget.classList.remove('dragging');document.querySelectorAll('#sa-lineup-slots .lineup-slot').forEach(s=>s.classList.remove('drag-over'));_saDragSrc=null;}
async function saDrop(e,dest){
  e.preventDefault();e.currentTarget.classList.remove('drag-over');
  if(_saDragSrc===null||_saDragSrc===dest)return;
  const match=state.matches.find(m=>m.id===_saMatchId);if(!match||match.counted)return;
  const lineup=[...(state.lineups[_saMatchId]||[])];
  while(lineup.length<=Math.max(_saDragSrc,dest))lineup.push(null);
  [lineup[_saDragSrc],lineup[dest]]=[lineup[dest],lineup[_saDragSrc]];
  state.lineups[_saMatchId]=lineup;
  document.getElementById('sa-save-indicator').innerHTML='<span class="spinner"></span>'+ct('saving');
  try{
    await sbUpsert('lineups',[{match_id:_saMatchId,slots:lineup}]);
    document.getElementById('sa-save-indicator').textContent=ct('saved');
    setTimeout(()=>{if(document.getElementById('sa-save-indicator'))document.getElementById('sa-save-indicator').textContent='';},2000);
  }catch(e){console.error(e);}
  renderSALineup();
}

const LIGA_CAT_MAP={
  'H Verbandsliga':'Herren','H Bezirksoberliga I':'Herren','H Bezirksliga I':'Herren','H Bezirksklasse I':'Herren',
  'H Bezirksoberliga':'Herren','H Bezirksliga':'Herren','H Bezirksklasse':'Herren',
  'H30 Verbandsoberliga':'Herren 30','H30 Bezirksoberliga I':'Herren 30','H30 Bezirksklasse II':'Herren 30',
  'H30 Bezirksoberliga':'Herren 30','H30 Bezirksklasse':'Herren 30',
  'H40 Bezirksoberliga I':'Herren 40','H40 Bezirksoberliga':'Herren 40',
  'H50 Verbandsliga':'Herren 50','H50 Bezirksklasse II':'Herren 50','H50 Bezirksklasse':'Herren 50',
  'H55 Bezirksoberliga I':'Herren 55','H55 Bezirksoberliga':'Herren 55',
  'H60 Verbandsliga':'Herren 60','H60 Bezirksoberliga I':'Herren 60',
  'M70OL':'Herren 70','H70':'Herren 70',
  'H75 Meisterklasse':'Herren 75','H75 Verbandsoberliga':'Herren 75',
  'D00 Bezirksoberliga I':'Damen','D00 Bezirksoberliga':'Damen',
  'D30 Verbandsliga':'Damen 30','D40 Verbandsoberliga':'Damen 40',
  'D50 Verbandsliga':'Damen 50','D60 Bezirksoberliga I':'Damen 60','D60 Bezirksoberliga':'Damen 60',
};
const JUVENILE_RE=/^(U\d+|Mid\b)/i;

function ligaToCategory(liga){
  // Jugend: "U18m …", "U18 w …", "U12 …", "Midcourt U10 m w …" → U18m / U18w / U12 / U10
  const j=liga.match(/^(?:Midcourt\s+|Mid\s+)?U\s?(\d+)\s*(m\s*w|m|w)?(?=\s|$)/i);
  if(j){const g=(j[2]||'').replace(/\s/g,'').toLowerCase();return`U${j[1]}${g==='m'?'m':g==='w'?'w':''}`;}
  if(LIGA_CAT_MAP[liga])return LIGA_CAT_MAP[liga];
  for(const[key,val]of Object.entries(LIGA_CAT_MAP)){if(liga.startsWith(key))return val;}
  if(/^H\d+/.test(liga)){const m=liga.match(/^H(\d+)/);return`Herren ${m[1]}`;}
  if(/^D\d+/.test(liga)){const m=liga.match(/^D(\d+)/);return`Damen ${m[1]}`;}
  if(/^H\b/.test(liga))return'Herren';
  if(/^D\b/.test(liga)||/^D00/.test(liga))return'Damen';
  return null;
}

// Busca TODAS las ocurrencias de "Füchse Berlin Reinickendorf e.V."
// por fila con matchAll, incluyendo sufijos romanos II/III/IV

async function parseResultReportPDF(file){
  // PDF.js devuelve cada celda como un item completo (no palabras sueltas).
  // Ej: item.str = 'Herren 70 Ostliga Gruppe B'  x=28
  //     item.str = 'Füchse Berlin Reinickendorf e.V. III'  x=637
  //
  // Algoritmo:
  //   1. Agrupar items por Y (tolerancia 4px)
  //   2. Fila con 'Gruppe' → extraer categoría+liga de cada item por columna
  //   3. Fila con 'Reinickendorf' → el item incluye el sufijo romano si existe

  const ab = await file.arrayBuffer();
  const pdf = await pdfjsLib.getDocument({data: ab}).promise;
  const teams = [];
  const seen = new Set();
  const ROMAN = {II:2, III:3, IV:4, V:5, VI:6, VII:7, VIII:8};
  // X de inicio de cada columna (del PDF real)
  const COLS = [28, 227, 427, 626];

  function colIdx(x) {
    // Devuelve la columna más cercana para un item en x
    let best = 0, bestD = Infinity;
    for (let i = 0; i < COLS.length; i++) {
      const d = Math.abs(COLS[i] - x);
      if (d < bestD) { bestD = d; best = i; }
    }
    return best;
  }

  // active[ci] = {category, liga} o null
  const active = [null, null, null, null];

  for (let pn = 1; pn <= pdf.numPages; pn++) {
    const page = await pdf.getPage(pn);
    const vp = page.getViewport({scale: 1});
    const tc = await page.getTextContent();

    // Agrupar items por Y (tolerancia 4px → round a múltiplo de 4)
    const rows = {};
    for (const item of tc.items) {
      const s = item.str;
      if (!s || !s.trim()) continue;
      const x = Math.round(item.transform[4]);
      const y = Math.round(vp.height - item.transform[5]);
      const yk = Math.round(y / 4) * 4;
      if (!rows[yk]) rows[yk] = [];
      rows[yk].push({s: s.trim(), x});
    }

    for (const yk of Object.keys(rows).map(Number).sort((a,b)=>a-b)) {
      const items = rows[yk].sort((a,b) => a.x - b.x);
      const rowText = items.map(i => i.s).join(' ');

      // Saltar metadatos
      if (rowText.includes('nu.Dokument') || rowText.includes('Mannschaftsmeisterschaft')
          || rowText.includes('Ergebnistabellen') || rowText.includes('Pkt.')) continue;

      // ── FILA DE HEADERS ──
      // Cada item de header es una celda completa: "Herren 70 Ostliga Gruppe B"
      if (rowText.includes('Gruppe')) {
        // Resetear todas las columnas de esta fila
        for (let ci = 0; ci < 4; ci++) active[ci] = null;

        for (const item of items) {
          if (!item.s.includes('Gruppe')) continue;
          const ci = colIdx(item.x);
          // Jugend: "U18m VL I Gruppe A", "U18 w VOL Gruppe B", "U12 VL II Gruppe A", "Midcourt U10 m w VL I Gruppe B"
          const jm = item.s.match(/^(?:Midcourt\s+)?U(\d+)\s*(m\s*w|m|w)?\s+(.+?)\s+Gruppe\s+[A-Z]$/);
          if (jm) {
            const jg = (jm[2] || '').replace(/\s/g, '');
            active[ci] = {category: `U${jm[1]}${jg === 'm' ? 'm' : jg === 'w' ? 'w' : ''}`, liga: jm[3].trim()};
            continue;
          }
          // Parsear adultos: "Herren 70 Ostliga Gruppe B" → cat="Herren 70", liga="Ostliga"
          const m = item.s.match(/^(Herren(?:\s+\d+)?|Damen(?:\s+\d+)?)\s+(.+?)\s+Gruppe\s+[A-Z]$/);
          active[ci] = m ? {category: m[1].trim(), liga: m[2].trim()} : null;
        }
        continue;
      }

      // ── FILA DE DATOS ──
      // Buscar items que contengan "Reinickendorf"
      for (const item of items) {
        if (!item.s.includes('Reinickendorf')) continue;
        // Ignorar la línea del título del documento
        if (item.s.includes('(12081)')) continue;

        const ci = colIdx(item.x);
        const col = active[ci];
        if (!col) continue;

        // El sufijo romano viene en el mismo item: "Füchse Berlin Reinickendorf e.V. III"
        const sm = item.s.match(/e\.V\.\s+(VIII|VII|VI|IV|V|III|II)\s*$/);
        const roman = sm ? sm[1] : null;
        const tnum = roman ? ROMAN[roman] : 1;

        const key = col.category + '__' + tnum;
        if (seen.has(key)) continue;
        seen.add(key);
        teams.push({
          id: uid(),
          name: col.category + (roman ? ' ' + roman : ''),
          category: col.category,
          liga: col.liga,
          team_number: tnum,
          season: ACTIVE_SEASON_KIND,
          season_id: ACTIVE_SEASON,
          gender: catGender(col.category)
        });
      }
    }
  }

  teams.sort((a,b) => a.category.localeCompare(b.category) || a.team_number - b.team_number);
  return teams;
}

// MATCHES PDF PARSER (Begegnungen) — POSICIÓN X/Y
// Formato: LIGA HEIM GAST offen
// Detecta TODAS las ocurrencias del club con matchAll
// El sufijo romano (II/III/IV) determina qué equipo es
// ══════════════════════════════════════════════════════
const CLUB_NAME='Füchse Berlin Reinickendorf e.V.';
const ROMAN_MATCH={II:2,III:3,IV:4,V:5,VI:6,VII:7,VIII:8};

document.getElementById('matches-pdf-input').addEventListener('change',async e=>{
  const file=e.target.files[0];if(!file)return;
  const statusEl=document.getElementById('matches-parse-status');
  statusEl.textContent='...';
  try{
    const ab=await file.arrayBuffer();
    const pdf=await pdfjsLib.getDocument({data:ab}).promise;
    let allItems=[];
    for(let i=1;i<=pdf.numPages;i++){
      const pg=await pdf.getPage(i);
      const vp=pg.getViewport({scale:1});
      const tc=await pg.getTextContent();
      for(const item of tc.items){
        if(!item.str.trim())continue;
        const x=Math.round(item.transform[4]);
        const y=Math.round(vp.height-item.transform[5]);
        allItems.push({str:item.str.trim(),x,y,page:i});
      }
    }
    const matches=parseBegegnungenItems(allItems);
    state._pendingMatches=matches;
    showMatchesPreview(matches);
    statusEl.textContent=T[lang].matchesParsedMsg(matches.length);
  }catch(err){
    document.getElementById('matches-parse-status').textContent='Fehler: '+err.message;
    console.error(err);
  }
  e.target.value='';
});

function parseBegegnungenItems(allItems){
  const X_LIGA=105,X_HEIM=177,X_GAST=334,X_STATUS=490;
  const ROMAN={'II':2,'III':3,'IV':4,'V':5,'VI':6,'VII':7,'VIII':8};
  const JUVENILE=/^(U\d+|Mid\b|Midcourt)/i;
  function colOf(x){if(x<X_LIGA)return'date';if(x<X_HEIM)return'liga';if(x<X_GAST)return'heim';if(x<X_STATUS)return'gast';return'status';}
  // Support both .s and .str property names
  function txt(item){return item.s||item.str||'';}
  const rowMap={};
  for(const item of allItems){
    const key=`${item.page}_${Math.round(item.y/4)*4}`;
    rowMap[key]=rowMap[key]||[];
    rowMap[key].push(item);
  }
  const rows=Object.values(rowMap)
    .map(items=>items.sort((a,b)=>a.x-b.x))
    .sort((a,b)=>a[0].page!==b[0].page?a[0].page-b[0].page:a[0].y-b[0].y);
  const matches=[],seen=new Set();
  let curDate='',curTime='';
  for(const row of rows){
    const cols={date:[],liga:[],heim:[],gast:[],status:[]};
    for(const item of row)cols[colOf(item.x)].push(txt(item));
    const dateText=cols.date.join(' ');
    const ligaText=cols.liga.join(' ').trim();
    const heimText=cols.heim.join(' ').replace('[Routenplan]','').trim();
    const gastText=cols.gast.join(' ').replace('[Routenplan]','').trim();
    const statusText=cols.status.join(' ');
    const dm=dateText.match(/(\d{2})\.(\d{2})\.(\d{4})\s+(\d{2}:\d{2})/);
    if(dm){curDate=`${dm[3]}-${dm[2]}-${dm[1]}`;curTime=dm[4];}
    if(!curDate||!ligaText)continue;
    if(!heimText.includes('Reinickendorf')&&!gastText.includes('Reinickendorf'))continue;
    if(statusText.includes('zurückgezogen'))continue;
    const isHome=heimText.includes('Reinickendorf');
    const clubText=isHome?heimText:gastText;
    const opponent=(isHome?gastText:heimText).replace('[Routenplan]','').trim();
    if(!opponent)continue;
    const sm=clubText.match(/e\.V\.\s+(VIII|VII|VI|IV|V|III|II)\s*$/);
    const roman=sm?sm[1]:null;
    const tnum=roman?ROMAN[roman]:1;
    const category=ligaToCategory(ligaText);
    if(!category)continue;
    const catTeams=state.teams.filter(t=>t.category===category).sort((a,b)=>teamNumber(a)-teamNumber(b));
    const matchingTeam=catTeams[tnum-1]||null;
    const dedupKey=`${curDate}_${curTime}_${category}_${tnum}_${opponent}`;
    if(seen.has(dedupKey))continue;
    seen.add(dedupKey);
    matches.push({id:uid(),teamId:matchingTeam?.id||null,teamCategory:category,teamNum:tnum,opponent,date:curDate,time:curTime,home:isHome?'Heim':'Auswärts',venue:'',liga:ligaText,_teamFound:!!matchingTeam});
  }
  return matches;
}

  if(!matches.length){sec.style.display='none';return;}

function _statsTable(ths){
  return '<table style="width:100%;border-collapse:collapse;font-size:11px"><thead><tr style="border-bottom:2px solid var(--border2)">'+ths.join('')+'</tr></thead><tbody>';
}
function _statsNote(inner){
  return `<div style="margin-top:20px;padding:12px;background:#222;border-radius:8px;font-size:12px;color:var(--muted)">
    ${inner}
  </div>`;
}
function _statsSortMatches(matches){
  const nm=m=>teamById(m.teamId)?.name||'';
  return matches.sort((a,b)=>{
    if(_statsSort==='date')return a.date!==b.date?a.date.localeCompare(b.date):nm(a).localeCompare(nm(b));
    return nm(a)!==nm(b)?nm(a).localeCompare(nm(b)):a.date.localeCompare(b.date);
  });
}
// answers for one match, over the team's players; Stammmannschaft = how many SM players can play
function _statsAnswers(m){
  const players=state.players.filter(p=>p.teamIds.includes(m.teamId));
  const stamm=players.filter(p=>state.mainTeam[p.id]?.[m.teamId]);
  const avail=state.availability[m.id]||{};
  const c={players:players.length,stamm:stamm.length,responded:0,yes:0,conditional:0,notfall:0,no:0};
  for(const p of players){
    const s=avail[p.id]||'';
    if(s)c.responded++;
    if(s==='yes'||s==='conditional'||s==='notfall'||s==='no')c[s]++;
  }
  c.stammAvailable=stamm.filter(p=>['yes','conditional','notfall'].includes(avail[p.id])).length;
  return c;
}
// average LK of the main lineup (a player that is gone counts as LK 99)
function _statsLineupLK(m,team){
  const size=team.is_4er?4:6;
  const ids=(state.lineups[m.id]||[]).slice(0,size).filter(Boolean);
  return _round1Avg(ids.map(pid=>{const p=state.players.find(pl=>pl.id===pid);return p?(p.lk||99):99;}));
}
function _statsMatchRow(m,team,c,lk){
  // percentages are over the answers, not over all players
  const share=(n,color)=>`<td style="padding:6px 8px;text-align:center;color:${color}">${n} (${_pctOf(n,c.responded)}%)</td>`;
  return `<tr style="border-bottom:1px solid var(--border2)">
      <td style="padding:6px 12px;white-space:nowrap">${fmtDate(m.date)}</td>
      <td style="padding:6px 12px">${team.name} vs ${(m.opponent||'').substring(0,20)}</td>
      <td style="padding:6px 8px;text-align:center">${c.responded}/${c.players}</td>
      ${share(c.yes,'#52c97a')}
      ${share(c.conditional,'rgba(82,201,122,.7)')}
      ${share(c.notfall,'var(--warn)')}
      ${share(c.no,'var(--danger)')}
      <td style="padding:6px 8px;text-align:center">${lk}</td>
      <td style="padding:6px 8px;text-align:center">${c.stammAvailable}/${c.stamm}</td>
    </tr>`;
}
function renderStatsMatches(){
  const el=document.getElementById('stats-content');
  const teams=_statsTeams();
  if(!teams.length){el.innerHTML='<div class="empty">Keine Teams</div>';return;}
  const matches=state.matches.filter(m=>teams.find(t=>t.id===m.teamId));
  if(!matches.length){el.innerHTML='<div class="empty">Keine Spiele</div>';return;}
  let html=_statsTable([_statsTh(ct('stDate'),1),_statsTh(ct('stMatch'),1),...['stAns','stYes','prio2','stNotfall','stNo','stLK','stSM'].map(k=>_statsTh(ct(k)))]);
  let shown=0,answers=0,players=0;const lks=[];
  for(const m of _statsSortMatches(matches)){
    const team=teamById(m.teamId);
    if(!team)continue;
    const c=_statsAnswers(m),lk=_statsLineupLK(m,team);
    html+=_statsMatchRow(m,team,c,lk);
    shown++;answers+=c.responded;players+=c.players;
    if(typeof lk==='number')lks.push(lk);
  }
  html+='</tbody></table>';
  const rate=players>0?Math.round(answers/players*100):'—';
  el.innerHTML=html+_statsNote(`<strong style="color:var(--white)">${shown}</strong> ${ct('stMatches')} · 
    <strong style="color:var(--white)">${rate}%</strong> ${ct('stRate')} · 
    ${ct('stLKAvg')} <strong style="color:var(--white)">${_round1Avg(lks)}</strong>`);
}

// Herren → Damen → Jugend, then by name (sorts the list in place, as before)
function _statsLKSortTeams(teams){
  return teams.sort((a,b)=>{
    const ga=catGroup(a.category),gb=catGroup(b.category);
    if(ga!==gb)return ga-gb;
    return a.name.localeCompare(b.name);
  });
}
// LKs per lineup position, from the matches where the main lineup was complete
function _statsPositionLKs(team){
  const size=team.is_4er?4:6;
  const pos=Array(size).fill(null).map(()=>[]);
  let games=0;
  for(const m of state.matches.filter(x=>x.teamId===team.id)){
    const ids=(state.lineups[m.id]||[]).slice(0,size).filter(Boolean);
    if(ids.length!==size)continue;
    games++;
    ids.forEach((pid,i)=>{const p=state.players.find(x=>x.id===pid);if(p)pos[i].push(p.lk||99);});
  }
  return {pos,games};
}
function _statsLKRow(team,{pos,games},has6){
  const td=(v,extra='')=>`<td style="padding:6px 8px;text-align:center${extra}">${v}</td>`;
  let html=`<tr style="border-bottom:1px solid var(--border2)">
      <td style="padding:8px 12px;font-weight:600">${team.name}</td>`;
  html+=pos.map(lks=>td(_round1Avg(lks))).join('');
  // a 4er team in a table with 6 positions: empty Pos 5 and 6
  if(pos.length===4&&has6)html+=td('—',';color:var(--muted)')+td('—',';color:var(--muted)');
  return html+td(_round1Avg(pos.flat()),';font-weight:600')+td(games,';color:var(--muted)')+'</tr>';
}
function renderStatsLKAnalysis(){
  const el=document.getElementById('stats-content');
  const teams=_statsTeams();
  if(!teams.length){el.innerHTML='<div class="empty">Keine Teams</div>';return;}
  const sorted=_statsLKSortTeams(teams);
  const has6=sorted.some(t=>!t.is_4er);
  const positions=has6?[1,2,3,4,5,6]:[1,2,3,4];
  let html=_statsTable([_statsTh(ct('teamCol'),1),...positions.map(n=>_statsTh('Pos '+n)),_statsTh('LK ⌀ Total'),_statsTh(ct('stMatchesCol'))]);
  for(const team of sorted){
    if(!state.matches.some(m=>m.teamId===team.id))continue;
    html+=_statsLKRow(team,_statsPositionLKs(team),has6);
  }
  el.innerHTML=html+'</tbody></table>'+_statsNote(`📊 ${ct('lkAnalysisNote')}`);
}

function umKey(r){return r.season_id+'|'+r.competition;}
function umLabel(k){const[sid,c]=k.split('|');return `${sid} · ${umT('comp')[c]||c}`;}

async function loadUmfrage(){
  loadActiveSurvey();
  document.getElementById('um-content').innerHTML=`<div style="color:var(--muted);font-size:13px">${umT('loading')}</div>`;

  catch(e){console.error(e);_umRows=[];_umErr=true;}

}

// ── Umfrage results: small pieces ──
function _umHeaderTexts(){
  for(const k of ['title','sub','reload','csv'])document.getElementById('um-'+k).textContent=umT(k);
}
// survey selector: the survey with the latest answer first (_umRows is newest-first)
function _umFillSurveySelect(){
  const sel=document.getElementById('um-survey');
  const keys=[...new Set(_umRows.map(umKey))];
  const cur=keys.includes(sel.value)?sel.value:keys[0];
  sel.innerHTML=keys.map(k=>`<option value="${umEsc(k)}"${k===cur?' selected':''}>${umEsc(umLabel(k))}</option>`).join('');
  sel.style.display=keys.length?'':'none';
  return {keys,cur};
}
// per category: answers, how many put it first, and the commitment counts
function _umCategoryTally(yes){
  const cats={};
  for(const r of yes)for(const c of(r.categories||[])){
    cats[c]=cats[c]||{total:0,first:0,all:0,half:0,ersatz:0};
    cats[c].total++;if(r.commitment&&cats[c][r.commitment]!==undefined)cats[c][r.commitment]++;
    if((r.categories||[])[0]===c)cats[c].first++; // categories are stored in priority order
  }
  return cats;
}
// usual category order, Mixed last
function _umCatOrder(a,b){
  const ma=a.startsWith('Mixed'),mb=b.startsWith('Mixed');if(ma!==mb)return ma?1:-1;
  return catCmp(a.replace(/ Doppel$/,''),b.replace(/ Doppel$/,''));
}
function _umStat(n,l){return `<div class="stat-card"><div class="stat-num">${n}</div><div class="stat-label">${l}</div></div>`;}
function _umCardTitle(t){return `<div style="font-family:'Bebas Neue',sans-serif;font-size:18px;color:var(--court);margin-bottom:6px">${t}</div>`;}
function _umHeadRow(keys){return `<thead><tr>${keys.map(k=>`<th>${k?umT(k):''}</th>`).join('')}</tr></thead>`;}
function _umCatTable(cats){
  const names=Object.keys(cats).sort(_umCatOrder);
  if(!names.length)return `<div style="color:var(--muted);font-size:12px">—</div>`;
  return `<table class="avail-table">${_umHeadRow(['cat','total','first','all','half','ersatz'])}<tbody>
        ${names.map(c=>`<tr><td style="font-weight:600">${umEsc(c)}</td><td style="color:var(--court);font-weight:700">${cats[c].total}</td><td>${cats[c].first}</td><td>${cats[c].all}</td><td>${cats[c].half}</td><td>${cats[c].ersatz}</td></tr>`).join('')}
      </tbody></table>`;
}
function _umDate(d){return d?new Date(d).toLocaleDateString(lang==='en'?'en-GB':lang==='es'?'es-AR':'de-DE'):'';}
function _umAnswerRow(r){
  return `<tr>
        <td style="font-weight:600;white-space:nowrap">${umEsc(r.name)}${r.player_id?'':` <span style="font-size:11px;color:var(--warn)">${umT('newP')}</span>`}</td>
        <td>${umEsc(r.lk||'—')}</td><td>${umEsc(r.birth_year||'')}</td>
        <td style="color:${r.participates?'var(--court)':'var(--danger)'};font-weight:700">${r.participates?'✓ '+umT('yes'):'✗ '+umT('no')}</td>
        <td>${(r.categories||[]).map((c,i)=>`<span style="white-space:nowrap"><b style="color:var(--court)">${i+1}.</b> ${umEsc(c)}</span>`).join(' &nbsp;')}</td>
        <td>${r.commitment?umEsc(umT('freqL')[r.commitment]):''}</td>

}
// all answers: who plays first, then by name
function _umAnswersTable(rows){

function renderUmfrage(){
  _umHeaderTexts();

  const {keys,cur}=_umFillSurveySelect();
  if(!keys.length){out.innerHTML=`<div style="color:var(--muted);font-size:13px">${umT('none')}</div>`;return;}
  const rows=_umRows.filter(r=>umKey(r)===cur);
  const yes=rows.filter(r=>r.participates);

  out.innerHTML=`

async function deleteUmfrage(id){
  const r=_umRows.find(x=>x.id===id);if(!r)return;
  if(!confirm(umT('del').replace('{n}',r.name)))return;
  try{await sbDelete('survey_responses',`id=eq.${encodeURIComponent(id)}`);await loadUmfrage();}
  catch(e){console.error(e);alert(e.message);}
}

function exportUmfrageCSV(){
  if(!_umRows)return;
  const cur=document.getElementById('um-survey').value;
  const rows=_umRows.filter(r=>umKey(r)===cur);
  const head=['Name','LK','Jahrgang','Geschlecht','Spielt','Kategorien (Priorität)','Häufigkeit','Mannschaftsführer','Anmerkung','Im Kader','Datum'];
  const q=v=>`"${String(v??'').replace(/"/g,'""')}"`;
  const lines=[head.map(q).join(';'),...rows.map(r=>[r.name,r.lk,r.birth_year,r.gender,r.participates?'Ja':'Nein',(r.categories||[]).map((c,i)=>`${i+1}. ${c}`).join(', '),r.commitment?UM_T.de.freqL[r.commitment]:'',r.participates?(r.captain?'Ja':'Nein'):'',r.comment,r.player_id?'Ja':'Nein',(r.updated_at||'').slice(0,10)].map(q).join(';'))];
  const blob=new Blob(['﻿'+lines.join('\r\n')],{type:'text/csv;charset=utf-8'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`Umfrage_${cur.replace('|','_')}.csv`;a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}
// ── ACTIVE SURVEY (app_settings 'active_survey') ──
let _activeSurvey=null;

function renderActiveSurveyForm(fill){

async function saveActiveSurvey(){
  const v={season_id:document.getElementById('um-a-season').value.trim().toUpperCase(),
    competition:document.getElementById('um-a-comp').value,
    year:parseInt(document.getElementById('um-a-year').value),
    deadline:document.getElementById('um-a-deadline').value.trim()};
  const msg=document.getElementById('um-a-msg');
  if(!/^[A-Z]\d{4}$/.test(v.season_id)||!v.year){msg.style.color='var(--danger)';msg.textContent=umT('aErr');return;}

// ── SEASON SWITCH (header) → app_settings 'active_season', read by all pages ──
const SEASON_T={

function sT(k){return SEASON_T[lang]?.[k]??SEASON_T.de[k];}
function seasonLabel(id){return id.startsWith('W')?`Winter ${id.slice(1)}/${String(+id.slice(1)+1).slice(2)}`:`Sommer ${id.slice(1)}`;}
let _knownSeasons=null;
async function renderSeasonSwitch(){
  const sel=document.getElementById('season-switch');if(!sel)return;
  if(!_knownSeasons){
    try{const rows=await sbGetAll('teams','select=season_id&order=season_id');_knownSeasons=[...new Set(rows.map(r=>r.season_id).filter(Boolean))];}
    catch(e){console.error(e);_knownSeasons=[];}
  }
  const ids=[...new Set([..._knownSeasons,ACTIVE_SEASON,PUBLISHED_SEASON])].filter(x=>/^[SW]\d{4}$/.test(x))
    .sort((a,b)=>a.slice(1).localeCompare(b.slice(1))||(a[0]==='S'?-1:1)); // chronological: S2026, W2026, S2027…
  sel.innerHTML=ids.map(id=>`<option value="${id}"${id===ACTIVE_SEASON?' selected':''}>${id===PUBLISHED_SEASON?'● ':'○ '}${seasonLabel(id)}${id===PUBLISHED_SEASON?' · '+sT('live'):''}${_knownSeasons.includes(id)?'':' '+sT('empty')}</option>`).join('')
    +`<option value="__new">${sT('newOpt')}</option>`;
  const prep=ACTIVE_SEASON!==PUBLISHED_SEASON;
  const pb=document.getElementById('season-publish');
  if(pb){pb.style.display=prep?'':'none';pb.textContent=sT('publish')(ACTIVE_SEASON);}
  const bn=document.getElementById('season-prep-banner');
  if(bn){bn.style.display=prep?'':'none';bn.textContent=sT('banner')(seasonLabel(ACTIVE_SEASON),seasonLabel(PUBLISHED_SEASON));}
}
// Admin-only: changes what THIS browser's admin shows. Nobody else is affected.
function onSeasonSwitch(sel){
  let v=sel.value;
  if(v==='__new'){
    v=(prompt(sT('prompt'))||'').trim().toUpperCase();
    if(!v){sel.value=ACTIVE_SEASON;return;}
    if(!/^[SW]\d{4}$/.test(v)){alert(sT('bad'));sel.value=ACTIVE_SEASON;return;}
  }
  if(v===ACTIVE_SEASON){sel.value=ACTIVE_SEASON;return;}
  try{if(v===PUBLISHED_SEASON)localStorage.removeItem(ADMIN_SEASON_KEY);else localStorage.setItem(ADMIN_SEASON_KEY,v);}
  catch(e){alert(ct('storageBlocked'));sel.value=ACTIVE_SEASON;return;}
  location.reload();
}
// Propagate: make the season admin is viewing the one everybody uses.
async function publishSeason(){
  if(ACTIVE_SEASON===PUBLISHED_SEASON)return;
  if(!confirm(sT('confirm')(PUBLISHED_SEASON,ACTIVE_SEASON)))return;
  try{
    await sbUpsert('app_settings',[{key:'active_season',value:ACTIVE_SEASON,updated_at:new Date().toISOString()}]);
    try{localStorage.removeItem(ADMIN_SEASON_KEY);}catch(e){}
    location.reload();
  }catch(e){console.error(e);alert(e.message);}
}
