<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Füchse Berlin – LK-Rechner</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --red:#c0392b;--green:#2d6a4f;--green-light:#40916c;
  --white:#f0f7f2;--dark:#1e2d24;--muted:#7a9e88;
  --line:#2e4a38;--warn:#f4a261;--court:#52b788;--card:#243330;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'DM Sans',sans-serif;background:var(--dark);color:var(--white);min-height:100vh}
header{background:linear-gradient(160deg,#1b2d23 0%,#2d4a38 60%,#1e2d24 100%);padding:20px 24px 18px;border-bottom:3px solid var(--red);display:flex;align-items:center;gap:16px}
.logo-img{width:54px;height:54px;object-fit:contain;flex-shrink:0}
.header-text h1{font-family:'Bebas Neue',sans-serif;font-size:26px;letter-spacing:2px}
.header-text p{font-size:11px;color:var(--muted);letter-spacing:1px;text-transform:uppercase;margin-top:2px}
.lang-bar{display:flex;gap:5px;margin-left:auto}
.lang-btn{padding:4px 10px;font-size:11px;font-weight:600;border:1px solid var(--line);border-radius:6px;cursor:pointer;background:transparent;color:var(--muted);font-family:inherit}
.lang-btn.active{background:var(--green-light);color:#fff;border-color:var(--green-light)}
main{padding:20px 16px;max-width:480px;margin:0 auto}
.step-title{font-family:'Bebas Neue',sans-serif;font-size:28px;letter-spacing:1px;margin-bottom:4px}
.step-sub{font-size:13px;color:var(--muted);margin-bottom:18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin-bottom:12px}
.q{font-size:13px;font-weight:600;margin-bottom:10px}
.hint{font-size:11px;color:var(--muted);margin-top:8px;line-height:1.45}
.lbl{font-size:11px;color:var(--muted);margin:10px 0 4px}
input,select{background:#1b2d24;border:1px solid var(--line);border-radius:8px;color:var(--white);padding:10px 14px;font-family:inherit;font-size:14px;outline:none;width:100%}
input:focus,select:focus{border-color:var(--court)}
input::placeholder{color:var(--muted)}
.ac-wrap{position:relative}
.ac-list{position:absolute;top:100%;left:0;right:0;background:#243330;border:1px solid #3a5a48;border-radius:10px;z-index:50;max-height:240px;overflow-y:auto;box-shadow:0 8px 30px rgba(0,0,0,.35);margin-top:4px}
.ac-item{padding:10px 14px;font-size:14px;cursor:pointer;display:flex;align-items:center;gap:10px;border-bottom:1px solid #2e4a3855}
.ac-item:hover{background:#2e4a38}
.lk-badge{margin-left:auto;border:1px solid #52b78855;color:var(--court);font-size:11px;font-weight:700;padding:2px 8px;border-radius:6px}
.seg{display:flex;gap:8px}
.seg button{flex:1;padding:11px 6px;border-radius:10px;font-family:inherit;font-size:14px;font-weight:600;cursor:pointer;border:1.5px solid var(--line);background:transparent;color:var(--muted)}
.seg button.on{background:#1a3d2a;color:var(--court);border-color:var(--court)}
.row{display:flex;gap:10px}.row>div{flex:1;min-width:0}
.toggle{display:flex;align-items:center;gap:12px;cursor:pointer;user-select:none}
.sw{width:44px;height:26px;border-radius:13px;background:#1b2d24;border:1px solid var(--line);position:relative;flex-shrink:0;transition:all .2s}
.sw::after{content:'';position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:var(--muted);transition:all .2s}
.toggle.on .sw{background:#1a3d2a;border-color:var(--court)}
.toggle.on .sw::after{left:21px;background:var(--court)}
.tl{font-size:14px;font-weight:600}.tl small{display:block;font-size:11px;color:var(--muted);font-weight:400}
.result{background:#1a3d2a;border:1px solid var(--court);border-radius:12px;padding:18px;margin-bottom:12px;text-align:center}
.result .big{font-family:'Bebas Neue',sans-serif;font-size:46px;letter-spacing:1px;color:var(--court);line-height:1}
.result .arrow{font-size:14px;color:var(--muted);margin:6px 0 2px}
.result .gain{font-size:15px;font-weight:700;color:var(--white)}
.result.empty{background:var(--card);border-color:var(--line)}
.result.empty .big{color:var(--muted);font-size:20px}
.detail{display:grid;grid-template-columns:1fr auto;gap:4px 12px;font-size:12px;color:var(--muted);margin-top:12px;text-align:left}
.detail b{color:var(--white);font-weight:600;text-align:right}
.warn{background:#2d2215;border:1px solid #f4a26155;border-radius:10px;padding:9px 12px;font-size:12px;color:var(--warn);margin-bottom:12px;line-height:1.45}
.fine{font-size:11px;color:var(--muted);line-height:1.5;margin-top:6px}
.fine a{color:var(--court)}
.hidden{display:none!important}
</style>
</head>
<body>
<div id="sp-login" style="position:fixed;inset:0;background:#0d2015;display:flex;align-items:center;justify-content:center;z-index:9999;font-family:'DM Sans',sans-serif;">
  <div style="background:#1a2e24;border:1px solid #2d6a4f;border-radius:14px;padding:36px 32px;width:100%;max-width:320px;box-shadow:0 20px 60px rgba(0,0,0,.6);">
    <div style="text-align:center;margin-bottom:24px">
      <div style="font-family:'Bebas Neue',sans-serif;font-size:1.5rem;letter-spacing:.1em;color:#74c69d">FÜCHSE BERLIN</div>
      <div style="font-size:.7rem;color:#4a9970;letter-spacing:.08em;text-transform:uppercase;margin-top:3px">Spieler-App</div>
    </div>
    <div style="margin-bottom:20px">
      <label style="font-size:.7rem;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:#4a9970;display:block;margin-bottom:5px">Passwort</label>
      <input id="sp-pw" type="password" autocomplete="off"
        style="width:100%;background:#111;border:1px solid #2d6a4f;border-radius:8px;color:#f0f0f0;padding:9px 12px;font-family:'DM Sans',sans-serif;font-size:.9rem;outline:none"
        placeholder="••••••••" onkeydown="if(event.key==='Enter')spLogin()">
    </div>
    <button onclick="spLogin()" style="width:100%;padding:11px;border-radius:8px;border:none;background:#2d6a4f;color:#fff;font-family:'DM Sans',sans-serif;font-size:.9rem;font-weight:600;cursor:pointer">Einloggen</button>
    <div id="sp-err" style="margin-top:12px;font-size:.8rem;color:#e63946;text-align:center;min-height:18px"></div>
  </div>
</div>
<script>
(function(){
  const _c='01612cccec019602';
  const KEY='fcb_spieler_auth';
  if(sessionStorage.getItem(KEY)==='ok'){document.getElementById('sp-login').style.display='none';}
  window.spLogin=async function(){
    const _d='59699dc4b9a79a54';
    const pw=document.getElementById('sp-pw').value;
    const _h=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(pw));
    const hex=Array.from(new Uint8Array(_h)).map(b=>b.toString(16).padStart(2,'0')).join('');
    const _a=document.getElementById('_fa').dataset.v;
    const _b=document.getElementById('_fb').dataset.v;
    const _ref=_a+_b+_c+_d;
    if(hex===_ref){
      sessionStorage.setItem(KEY,'ok');
      const o=document.getElementById('sp-login');
      o.style.opacity='0';o.style.transition='opacity .3s';
      setTimeout(()=>o.style.display='none',300);
    }else{
      document.getElementById('sp-err').textContent='Falsches Passwort';
      document.getElementById('sp-pw').value='';
      setTimeout(()=>document.getElementById('sp-err').textContent='',2000);
    }
  };
})();
</script>

async function sbGet(t,p=''){const r=await fetch(`${SB_URL}/rest/v1/${t}?${p}`,{headers:HDR});if(!r.ok)throw new Error(await r.text());return r.json();}

}

let lang='de',players=[],format='single',meFromList=null;
function tr(k){return T[lang][k]??T.de[k];}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function $(id){return document.getElementById(id);}
function num(v){v=String(v??'').replace(/^LK/i,'').replace(',','.').trim();const n=parseFloat(v);return isFinite(n)?n:null;}
function fmt(n,dec){return n.toFixed(dec).replace('.',lang==='en'?'.':',');}
function playerLk(p){return p.lk!=null?+p.lk:num(p.lk_str);}

function setLang(l){lang=l;document.documentElement.lang=l;document.querySelectorAll('.lang-btn').forEach(b=>b.classList.toggle('active',b.textContent===l.toUpperCase()));applyT();}
function applyT(){
  $('t-header').textContent=tr('header');$('t-title').textContent=tr('title');$('t-sub').textContent=tr('sub');
  $('t-single').textContent=tr('single');$('t-double').textContent=tr('double');$('t-you').textContent=tr('you');
  $('me-search').placeholder=tr('search');$('pa-search').placeholder=tr('search');
  $('t-mylk').textContent=tr('mylk');$('t-partner').textContent=tr('partner');$('t-partnerlk').textContent=tr('partnerlk');
  $('t-opp').textContent=tr('opp');$('t-opp1').textContent=format==='double'?tr('opp1d'):tr('opp1');$('t-opp2').textContent=tr('opp2');
  $('t-opphint').textContent=tr('opphint');$('t-bonus').innerHTML=tr('bonus');$('t-ak').textContent=tr('ak');$('t-short').innerHTML=tr('short');
  $('t-fine').textContent=tr('fine');$('warn-lk10').textContent=tr('warn10');
  const cur=$('ak').value||'open';
  $('ak').innerHTML=AK_FACTORS.map(([k,f])=>`<option value="${k}"${k===cur?' selected':''}>${k==='open'?tr('open'):'Herren/Damen '+k} · ${f} %</option>`).join('');
  $('me-hint').textContent=meFromList?tr('fromList')(meFromList):tr('manual');
  calc();
}

// ── Name search (Meldeliste of the active season) ──
// Loaded lazily on the first name search → visitors who never search cause no Supabase traffic
let _playersLoading=null;
function loadPlayers(){if(!_playersLoading)_playersLoading=_loadPlayers();return _playersLoading;}
async function _loadPlayers(){
  await _seasonReady;
  try{players=await sbGetAll('players',`season_id=eq.${ACTIVE_SEASON}&select=id,name,raw_name,lk,lk_str,year&order=name,id`);}
  catch(e){console.error(e);players=[];}
}
async function onSearch(who){
  const inp=$(who+'-search'),list=$(who+'-list'),val=inp.value.toLowerCase();
  if(val.length<2){list.style.display='none';return;}
  await loadPlayers();
  const f=players.filter(p=>p.name.toLowerCase().includes(val)||(p.raw_name||'').toLowerCase().includes(val)).slice(0,8);
  if(!f.length){list.style.display='none';return;}
  list.innerHTML=f.map(p=>`<div class="ac-item" onclick="pick('${who}','${esc(p.id)}')"><span>${esc(p.name)}</span><span class="lk-badge">${esc(p.lk_str||'?')}</span></div>`).join('');
  list.style.display='block';
}
function pick(who,id){
  const p=players.find(x=>x.id===id);if(!p)return;
  $(who+'-search').value=p.name;$(who+'-list').style.display='none';
  const lk=playerLk(p);
  $(who+'-lk').value=lk!=null?fmt(lk,1):'';
  if(who==='me'){meFromList=ACTIVE_SEASON;$('me-hint').textContent=tr('fromList')(meFromList);}
  calc();
}
document.addEventListener('click',e=>{if(!e.target.closest('.ac-wrap'))document.querySelectorAll('.ac-list').forEach(l=>l.style.display='none');});
$('me-lk').addEventListener('input',()=>{}); // value stays editable

document.querySelectorAll('#format button').forEach(b=>b.onclick=()=>{
  format=b.dataset.v;document.querySelectorAll('#format button').forEach(x=>x.classList.toggle('on',x===b));
  $('partner-block').classList.toggle('hidden',format!=='double');$('opp2-wrap').classList.toggle('hidden',format!=='double');
  applyT();
});

// ── Calculation ──
function okLk(v){return v!=null&&v>=1.5&&v<=25;}
function calc(){
  const me=num($('me-lk').value),pa=num($('pa-lk').value),o1=num($('op1-lk').value),o2=num($('op2-lk').value);
  const dbl=format==='double';
  const res=$('result'),det=$('r-detail');
  const ready=okLk(me)&&okLk(o1)&&(!dbl||(okLk(pa)&&okLk(o2)));
  if(!ready){
    res.classList.add('empty');$('r-big').textContent=tr('empty');$('r-arrow').textContent='';$('r-gain').textContent='';det.classList.add('hidden');
    $('warn-lk10').classList.add('hidden');return;
  }
  const own=dbl?(me+pa)/2:me, opp=dbl?(o1+o2)/2:o1;
  const d=own-opp, P=lkPoints(d), H=lkHurdle(own);
  const A=(AK_FACTORS.find(x=>x[0]===$('ak').value)||AK_FACTORS[0])[1]/100;
  const bonus=$('bonus').classList.contains('on'), short=$('short').classList.contains('on');
  let gain=P/H*A*(short?SHORT_SETS:1)*(bonus?TEAM_BONUS:1);
  if(dbl)gain*=0.5;
  const newLk=Math.max(1.5,me-gain);
  res.classList.remove('empty');
  $('r-big').textContent='LK '+fmt(Math.floor(newLk*10)/10,1);
  $('r-arrow').textContent=`LK ${fmt(me,1)} →`;
  $('r-gain').textContent=tr('gain')(fmt(gain,3))+(dbl?' '+tr('each'):'');
  const rows=[[tr('dD'),(d>0?'+':'')+fmt(d,2)],[tr('dP'),fmt(P,1)],[tr('dH'),fmt(H,1)],[tr('dA'),Math.round(A*100)+' %']];
  if(bonus)rows.push([tr('dB'),'+10 %']);
  if(short)rows.push([tr('dZ'),'75 %']);
  if(dbl)rows.push([tr('dSplit'),'× 0,5']);
  det.innerHTML=rows.map(([k,v])=>`<span>${esc(k)}</span><b>${esc(v)}</b>`).join('');det.classList.remove('hidden');
  $('warn-lk10').classList.toggle('hidden',!(own<10));
}

applyT();
</script>
