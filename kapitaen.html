<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kapitän – Füchse Berlin</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --green:#2d6a4f;--green-light:#40916c;--court:#74c69d;
  --white:#f0f2f1;--dark:#161616;--card:#1e1e1e;--muted:#7a8a85;
  --warn:#f4a261;--danger:#c0392b;--info:#4ea8de;--red:#c0392b;
  --border:#252525;--border2:#333
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'DM Sans',sans-serif;background:var(--dark);color:var(--white);min-height:100vh}
::-webkit-scrollbar{width:6px}::-webkit-scrollbar-track{background:var(--dark)}
::-webkit-scrollbar-thumb{background:#333;border-radius:3px}

/* LOGIN */
#login-overlay{position:fixed;inset:0;background:#0d1a10;display:flex;align-items:center;justify-content:center;z-index:9999}
.login-box{background:#1e1e1e;border:1px solid #333;border-radius:14px;padding:36px 32px;width:100%;max-width:340px;box-shadow:0 20px 60px rgba(0,0,0,.6)}
.login-brand{text-align:center;margin-bottom:28px}
.login-brand .name{font-family:'Bebas Neue',sans-serif;font-size:1.6rem;letter-spacing:.1em;color:var(--court)}
.login-brand .sub{font-size:.7rem;color:#666;letter-spacing:.1em;text-transform:uppercase;margin-top:2px}
.login-field{margin-bottom:12px}
.login-field label{font-size:.7rem;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:#666;display:block;margin-bottom:5px}
.login-field input{width:100%;background:#111;border:1px solid #333;border-radius:8px;color:#f0f0f0;padding:9px 12px;font-family:'DM Sans',sans-serif;font-size:.9rem;outline:none}
.login-field input:focus{border-color:var(--court)}
.login-btn{width:100%;padding:11px;border-radius:8px;border:none;background:#2d6a4f;color:#fff;font-family:'DM Sans',sans-serif;font-size:.9rem;font-weight:600;cursor:pointer;transition:background .15s}
.login-btn:hover{background:var(--green-light)}
.login-err{margin-top:12px;font-size:.8rem;color:var(--danger);text-align:center;min-height:18px;font-weight:500}

/* HEADER */
header{background:#111;padding:14px 22px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border2);position:sticky;top:0;z-index:100;flex-wrap:wrap;gap:8px}
.logo{display:flex;align-items:center;gap:10px}
.logo h1{font-family:'Bebas Neue',sans-serif;font-size:20px;letter-spacing:2px}
.logo-img{width:36px;height:36px;object-fit:contain;flex-shrink:0}
.logo span{font-size:10px;color:var(--muted);letter-spacing:1px;text-transform:uppercase;display:block}
.header-right{display:flex;align-items:center;gap:8px}
.sync-badge{font-size:10px;font-weight:600;padding:3px 9px;border-radius:20px;transition:all .3s}
.sync-ok{background:#1a2a1a;border:1px solid var(--court)55;color:var(--court)}
.sync-err{background:#3d1a1a;border:1px solid var(--danger)55;color:var(--danger)}
.sync-ing{background:#2e2a1a;border:1px solid var(--warn)55;color:var(--warn)}
.lang-bar{display:flex;gap:4px}
.lang-btn{padding:3px 9px;font-size:11px;font-weight:600;border:1px solid var(--border2);border-radius:6px;cursor:pointer;background:transparent;color:var(--muted);font-family:'DM Sans',sans-serif;transition:all .15s}
.lang-btn:hover{color:var(--white)}
.lang-btn.active{background:var(--green-light);color:#fff;border-color:var(--green-light)}
.logout-btn{padding:4px 12px;font-size:11px;font-weight:600;border:1px solid var(--border2);border-radius:6px;cursor:pointer;background:transparent;color:var(--muted);font-family:'DM Sans',sans-serif}
.logout-btn:hover{color:var(--white);border-color:#555}

/* LAYOUT */
main{padding:22px;max-width:1080px;margin:0 auto;display:grid;grid-template-columns:240px 1fr;gap:18px;min-height:calc(100vh - 60px)}
@media(max-width:700px){main{grid-template-columns:1fr}}
/* mobile: team dropdown instead of the full list (desktop keeps the list) */
.team-select{display:none;width:100%;background:#111;border:1px solid var(--border2);border-radius:10px;color:var(--white);padding:11px 12px;font:600 14px 'DM Sans',sans-serif}
@media(max-width:700px){.team-select{display:block}#team-list-sidebar,#sidebar-teams-title,#no-team-selected{display:none!important}.sidebar-card{padding:10px}}
/* grouped lineup warnings: red = Sperren (blocking), amber = Hinweise */
.warn-group{border-radius:8px;padding:8px 12px;margin-bottom:10px;font-size:12px;line-height:1.5}
.warn-group summary{font-weight:700;cursor:pointer;list-style:none}
.warn-group summary::-webkit-details-marker{display:none}
.warn-group summary::after{content:' ▾';opacity:.7}
.warn-group[open] summary::after{content:' ▴'}
.warn-group ul{margin:6px 0 2px 18px}
.warn-group.red{background:#3a1b18;border:1px solid #ff6b5b55;color:#ffb3aa}
.warn-group.amber{background:#33260f;border:1px solid #f4a26155;color:#f7c48f}
.warn-group strong{color:inherit}
/* availability rows: extra badges before the status; on mobile they move under the name */
.avail-tags{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end;align-items:center}
@media(max-width:700px){.avail-row{flex-wrap:wrap}.avail-tags:not(:empty){order:3;flex-basis:100%;justify-content:flex-start;padding-left:40px;margin-top:-4px}.avail-row>.avail-badge{order:2}.avail-tags span{margin-left:0!important}}

/* SIDEBAR */
.sidebar{display:flex;flex-direction:column;gap:10px}
.sidebar-card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:14px}
.sidebar-title{font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:10px}
.team-btn{width:100%;text-align:left;padding:8px 10px;border-radius:8px;border:1px solid transparent;background:transparent;color:var(--muted);font-family:'DM Sans',sans-serif;font-size:13px;cursor:pointer;transition:all .15s;display:flex;align-items:center;gap:8px;margin-bottom:3px}
.team-btn:hover{background:#252525;color:var(--white)}
.team-btn.active{background:#1a2e26;border-color:var(--court)55;color:var(--court)}
.team-dot{width:7px;height:7px;border-radius:50%;background:var(--court);flex-shrink:0;opacity:.5}
.team-btn.active .team-dot{opacity:1}

/* MAIN CONTENT */
.content{min-width:0}
.section-title{font-family:'Bebas Neue',sans-serif;font-size:26px;letter-spacing:2px;color:var(--court);margin-bottom:4px}
.section-sub{color:var(--muted);font-size:12px;margin-bottom:16px}

/* MATCH LIST */
.match-card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:13px 16px;margin-bottom:8px;cursor:pointer;transition:border-color .15s}
.match-card:hover{border-color:var(--court)44}
.match-card.active{border-color:var(--court);background:#1a2e26}
.match-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:6px}
.match-title{font-weight:600;font-size:14px}
.match-meta{font-size:11px;color:var(--muted);margin-top:2px}
.match-status{font-size:11px;font-weight:600;padding:2px 8px;border-radius:10px}
.status-ready{background:#1a2e26;color:var(--court)}
.status-open{background:#2e2a15;color:#ffd700}
.prog-bar{height:4px;background:#252525;border-radius:2px;overflow:hidden;margin-top:8px}
.prog-fill{height:100%;background:var(--court);border-radius:2px;transition:width .3s}

/* AVAILABILITY PANEL */
.avail-panel{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:18px;margin-top:14px}
.avail-panel-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;flex-wrap:wrap;gap:8px}
.avail-panel-title{font-family:'Bebas Neue',sans-serif;font-size:20px;color:var(--court)}
.auto-btn{display:flex;align-items:center;gap:6px;padding:7px 14px;border-radius:8px;border:1px solid var(--court)55;background:#1a2e26;color:var(--court);font-family:'DM Sans',sans-serif;font-size:13px;font-weight:600;cursor:pointer;transition:all .15s}
.auto-btn:hover{background:var(--green);border-color:var(--green);color:#fff}
.avail-group-label{font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:5px 0 3px;border-top:1px solid var(--border);margin-top:4px;color:var(--muted)}
.avail-group-label:first-child{border-top:none;margin-top:0}
.avail-row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--border)22}
.avail-row:last-child{border-bottom:none}
.avail-avatar{width:30px;height:30px;border-radius:50%;background:var(--green);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#fff;flex-shrink:0}
.avail-name{flex:1;font-size:13px;font-weight:500}
.avail-meta{font-size:11px;color:var(--muted)}
.avail-badge{font-size:11px;font-weight:600;padding:2px 8px;border-radius:10px}
.av-yes{background:#1a2e26;color:var(--court)}
.av-maybe{background:#2e2a1a;color:var(--warn)}
.av-no{background:#2d1a1a;color:var(--danger)}
.av-open{background:#252525;color:var(--muted)}

/* LINEUP */
.lineup-section{margin-top:18px}
.lineup-title{font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px}
.lineup-slot{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;border:1px solid var(--border);margin-bottom:6px;background:#181818}
.lineup-slot.ok{border-color:var(--court)33}
.lineup-slot.warning{border-color:var(--danger)55;background:#2d151522}
.lineup-slot.blocked-slot{border-color:var(--danger);background:#2d1a1a}
.lineup-pos{font-family:'Bebas Neue',sans-serif;font-size:16px;color:var(--court);min-width:20px;text-align:center}
.lineup-slot select{flex:1;background:#111;border:1px solid var(--border2);border-radius:6px;color:var(--white);padding:5px 8px;font-size:12px;font-family:'DM Sans',sans-serif;outline:none}
.lineup-slot select:focus{border-color:var(--court)}
.save-indicator{font-size:11px;color:var(--court);text-align:right;margin-top:4px;min-height:16px}
.blocked-badge{font-size:10px;background:#2d1a1a;border:1px solid var(--danger)44;color:var(--danger);padding:2px 7px;border-radius:10px}
.warn-banner{background:#3d1a1a;border:1px solid var(--danger)44;border-radius:8px;padding:8px 12px;margin-bottom:10px;font-size:12px;color:var(--danger)}
.ok-banner{background:#1a2d22;border:1px solid var(--court)33;border-radius:8px;padding:6px 12px;margin-bottom:10px;font-size:12px;color:var(--court)}
.empty{color:var(--muted);font-size:13px;text-align:center;padding:30px}
.spinner{display:inline-block;width:12px;height:12px;border:2px solid var(--court)44;border-top-color:var(--court);border-radius:50%;animation:spin .6s linear infinite;margin-right:6px;vertical-align:middle}
@keyframes spin{to{transform:rotate(360deg)}}
input,select{background:#111;border:1px solid var(--border2);border-radius:7px;color:var(--white);padding:7px 10px;font-size:13px;font-family:'DM Sans',sans-serif;outline:none;width:100%}
input:focus,select:focus{border-color:var(--court)}
.rule-box{background:#181818;border-left:3px solid var(--court);border-radius:0 8px 8px 0;padding:8px 12px;margin:9px 0;font-size:12px;color:var(--muted);line-height:1.6}
.rule-box.warn{border-left-color:var(--warn)}
.rule-box.danger{border-left-color:var(--danger)}
.rule-box strong{color:var(--white)}

/* Drag & drop lineup slots */
.lineup-slot[draggable]{cursor:grab}
.lineup-slot[draggable]:active{cursor:grabbing}
.lineup-slot.drag-over{border-color:var(--court)!important;background:rgba(116,198,157,.1)!important;transform:scale(1.02)}
.lineup-slot.dragging{opacity:.4}
.drag-handle{color:var(--muted);font-size:14px;cursor:grab;padding:0 4px;user-select:none;flex-shrink:0}
.drag-handle:hover{color:var(--court)}
/* ── VERLEGT ── */
.move-btn{display:flex;align-items:center;gap:6px;padding:7px 14px;border-radius:8px;border:1px solid var(--warn)66;background:#2e2414;color:var(--warn);font-family:'DM Sans',sans-serif;font-size:13px;font-weight:600;cursor:pointer;transition:all .15s}
.move-btn:hover{background:var(--warn);color:#1a1205}
.match-card.moved{opacity:.55;cursor:default;background:#181818;border-style:dashed}
.match-card.moved:hover{border-color:var(--border)}
.match-card.moved .match-title,.match-card.moved .match-meta{text-decoration:line-through;text-decoration-color:#7a8a8599}
.status-moved{background:#2e2414;color:var(--warn);border:1px solid var(--warn)55}
.status-new{background:#14262e;color:var(--info);border:1px solid var(--info)55;font-size:10px;font-weight:700;padding:2px 7px;border-radius:10px;margin-left:6px;vertical-align:middle}
.moved-link{font-size:11px;color:var(--warn);margin-top:6px}
.moved-link b{color:var(--white);font-weight:600}
.info-banner{background:#14262e;border:1px solid var(--info)44;border-radius:8px;padding:8px 12px;margin-bottom:12px;font-size:12px;color:#9cc9e6;line-height:1.5}
.wk-badge{border-radius:10px;padding:2px 8px;font-size:10px;font-weight:700;margin-left:4px;cursor:help;white-space:nowrap}
.wk-badge.play{background:#2d1f10;color:var(--warn);border:1px solid #f4a26155}
.wk-badge.ans{background:#2a2a2a;color:#bbb;border:1px solid #444}
.info-banner b{color:var(--white)}
.mv-bg{position:fixed;inset:0;background:rgba(0,0,0,.72);display:none;align-items:center;justify-content:center;z-index:5000;padding:16px}
.mv-bg.open{display:flex}
.mv{background:var(--card);border:1px solid var(--border2);border-radius:14px;width:100%;max-width:440px;padding:22px;box-shadow:0 20px 60px rgba(0,0,0,.6);max-height:calc(100vh - 32px);overflow-y:auto}
.mv h2{font-family:'Bebas Neue',sans-serif;font-size:24px;letter-spacing:1px;color:var(--warn);margin-bottom:2px}
.mv .orig{background:#181818;border:1px solid var(--border);border-radius:8px;padding:9px 12px;font-size:12px;color:var(--muted);margin:12px 0 16px}
.mv .orig b{display:block;color:var(--white);font-size:13px;margin-bottom:2px;text-decoration:line-through;text-decoration-color:var(--warn)}
.mv .field{margin-bottom:12px}
.mv .field label{display:block;font-size:10px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin-bottom:5px}
.mv .row2{display:grid;grid-template-columns:1.4fr 1fr;gap:10px}
.mv .check{display:flex;gap:9px;align-items:flex-start;font-size:12px;color:var(--white);margin:4px 0 10px;cursor:pointer}
.mv .check input{width:auto;margin-top:2px;accent-color:var(--court)}
.mv .check small{display:block;color:var(--muted);font-size:11px;margin-top:1px}
.mv-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}
.mv-ghost{padding:8px 14px;border-radius:8px;border:1px solid var(--border2);background:transparent;color:var(--muted);font-family:'DM Sans',sans-serif;font-size:13px;font-weight:600;cursor:pointer}
.mv-go{padding:8px 16px;border-radius:8px;border:none;background:var(--warn);color:#1a1205;font-family:'DM Sans',sans-serif;font-size:13px;font-weight:700;cursor:pointer}
.mv-go:disabled{opacity:.5;cursor:default}
.mv textarea.share-text{width:100%;min-height:260px;background:#111;border:1px solid var(--border2);border-radius:8px;color:var(--white);padding:10px 12px;font-family:'DM Sans',sans-serif;font-size:13px;line-height:1.45;outline:none;resize:vertical}
.mv textarea.share-text:focus{border-color:var(--court)}
.mv-wa{padding:8px 16px;border-radius:8px;border:none;background:#25d366;color:#08210f;font-family:'DM Sans',sans-serif;font-size:13px;font-weight:700;cursor:pointer}
.mv-err{font-size:12px;color:var(--danger);min-height:16px;margin-top:8px}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login-overlay">
  <div class="login-box">
    <div class="login-brand">
      <img src="logo.svg" alt="Füchse Berlin" style="width:56px;height:56px;object-fit:contain;display:block;margin:0 auto 10px">
      <div class="name">FÜCHSE BERLIN</div>
      <div class="sub">Kapitän-App</div>
    </div>
    <div class="login-field">
      <label>Benutzername</label>
      <input id="login-email" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" placeholder="Benutzername"
        onkeydown="if(event.key==='Enter')document.getElementById('login-pass').focus()">
    </div>
    <div class="login-field" style="margin-bottom:20px">
      <label>Passwort</label>
      <input id="login-pass" type="password" autocomplete="current-password" placeholder="••••••••"
        onkeydown="if(event.key==='Enter')doLogin()">
    </div>
    <button class="login-btn" id="login-btn" onclick="doLogin()">Einloggen</button>
    <div class="login-err" id="login-err"></div>
  </div>
</div>

<!-- HEADER -->
<header>
  <div class="logo">
    <img class="logo-img" src="logo.svg" alt="Füchse Berlin">
    <div>
      <h1>FÜCHSE BERLIN</h1>
      <span>Kapitän-App</span>
    </div>
  </div>
  <div class="header-right">
    <div class="lang-bar">
      <button class="lang-btn active" onclick="setLang('de')">DE</button>
      <button class="lang-btn" onclick="setLang('es')">ES</button>
      <button class="lang-btn" onclick="setLang('en')">EN</button>
    </div>
    <span id="who-badge" style="display:none;font-size:11px;font-weight:600;padding:3px 10px;border-radius:20px;border:1px solid var(--court);color:var(--court);white-space:nowrap"></span>
    <span class="sync-badge sync-ing" id="sync-badge">⟳</span>
    <button class="logout-btn" id="btn-logout" onclick="doLogout()">Abmelden</button>
  </div>
</header>

<!-- TABS -->
<div style="display:flex;padding:0 22px;background:#111;border-bottom:1px solid var(--border2);overflow-x:auto">
  <button id="tab-spiele" onclick="showKapTab('spiele')" style="padding:11px 18px;font-size:13px;font-weight:500;color:var(--court);cursor:pointer;border-bottom:3px solid var(--court);border-top:none;border-left:none;border-right:none;background:none;font-family:'DM Sans',sans-serif;white-space:nowrap">Spiele &amp; Aufstellung</button>
  <button id="tab-overview" onclick="showKapTab('overview')" style="padding:11px 18px;font-size:13px;font-weight:500;color:var(--muted);cursor:pointer;border-bottom:3px solid transparent;border-top:none;border-left:none;border-right:none;background:none;font-family:'DM Sans',sans-serif;white-space:nowrap">Overview</button>
  <button id="tab-sperren" onclick="showKapTab('sperren')" style="padding:11px 18px;font-size:13px;font-weight:500;color:var(--muted);cursor:pointer;border-bottom:3px solid transparent;border-top:none;border-left:none;border-right:none;background:none;font-family:'DM Sans',sans-serif;white-space:nowrap">Sperren</button>
</div>

<!-- MAIN -->
<main>
  <!-- SIDEBAR: Team list -->
  <div class="sidebar" id="main-sidebar">
    <div class="sidebar-card">
      <div class="sidebar-title" id="sidebar-teams-title">Mannschaften</div>
      <select id="team-select" class="team-select" onchange="if(this.value)selectTeam(this.value)"></select>
      <div id="team-list-sidebar"><div class="empty" style="padding:10px" id="sidebar-loading">Laden...</div></div>
    </div>
  </div>

  <!-- CONTENT WRAPPER (single grid cell, tabs switch between views inside) -->
  <div style="min-width:0" id="main-content-wrapper">
    <!-- CONTENT: Spiele & Aufstellung -->
    <div id="view-spiele">
    <div id="no-team-selected" class="empty" style="margin-top:60px">
      &#8592; Mannschaft auswählen
    </div>
    <div id="team-content" style="display:none">
      <div class="section-title" id="content-team-name"></div>
      <div class="section-sub" id="content-team-meta"></div>

      <!-- Match list -->
      <div id="match-list"></div>

      <!-- Availability + Lineup panel -->
      <div id="avail-panel" style="display:none" class="avail-panel">
        <div class="avail-panel-header">
          <div>
            <div class="avail-panel-title" id="panel-match-title"></div>
            <div style="font-size:11px;color:var(--muted);margin-top:2px" id="panel-match-meta"></div>
          </div>
          <div style="display:flex;gap:6px;flex-wrap:wrap">
            <button class="move-btn" id="move-btn" onclick="openMoveModal()" style="display:none">⇄ Verlegen</button>
            <button class="auto-btn" id="auto-btn" onclick="runAutoLineup()">&#9889; Auto-Aufstellung</button>
            <button class="auto-btn" id="sort-btn" onclick="sortLineupKap()" style="background:transparent;border-color:var(--court)44;color:var(--muted)">↕ Sort</button>
            <button class="auto-btn" id="share-btn" onclick="openShareModal()" style="background:#14301f;border-color:#25d36666;color:#25d366">📤 Teilen</button>
          </div>
        </div>

        <div id="move-info"></div>
        <!-- Lineup FIRST (above availability) -->
        <div class="lineup-section" style="margin-top:0;margin-bottom:18px">
          <div class="lineup-title" id="lineup-label">Aufstellung</div>
          <div id="lineup-warnings"></div>
          <div id="lineup-slots"></div>
          <div class="save-indicator" id="save-indicator"></div>
          <div id="count-wrap" style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:10px"></div>

// ── MATCH COUNTING (Sperren) ── always checked against the DATABASE, not the page copy:
// another tab or a captain may already have counted/undone the match in the meantime.
async function _patchMatchIf(id,cond,fields){
  const r=await fetch(`${SB_URL}/rest/v1/matches?id=eq.${id}&${cond}`,{method:'PATCH',headers:{...getHDR(),'Prefer':'return=representation'},body:JSON.stringify(fields)});
  if(!r.ok)throw new Error(await r.text());
  return (await r.json()).length>0; // false = condition not met (already counted / already undone)
}
async function _freshCounts(teamId){
  const rows=await sbGetAll('player_match_counts',`team_id=eq.${teamId}&order=player_id`);
  const m={};for(const r of rows)m[r.player_id]=r.matches_played||0;return m;
}
// players: list to count. Returns 'ok' | 'already'
async function countMatchDB(match,players,includeErsatz){
  const claimed=await _patchMatchIf(match.id,'counted=not.is.true',{counted:true,ersatz_counted:includeErsatz,counted_players:players});
  if(!claimed)return'already';
  try{
    const cur=await _freshCounts(match.teamId);
    for(const pid of players){
      const next=(cur[pid]||0)+1;
      await sbUpsert('player_match_counts',[{player_id:pid,team_id:match.teamId,matches_played:next}]);
      if(!state.matchCounts[pid])state.matchCounts[pid]={};state.matchCounts[pid][match.teamId]=next;
    }
  }catch(e){ // roll back the claim so it can be retried
    await _patchMatchIf(match.id,'counted=is.true',{counted:false,ersatz_counted:false,counted_players:null}).catch(()=>{});
    throw e;
  }
  match.counted=true;match.ersatzCounted=includeErsatz;match.countedPlayers=players;
  return'ok';
}
// Returns 'ok' | 'already'
async function undoCountDB(match){
  const row=(await sbGet('matches',`id=eq.${match.id}`))[0];
  if(!row||!row.counted)return'already';
  const size=teamSize(teamById(match.teamId));
  const slots=state.lineups[match.id]||[];
  const lineup=slots.slice(0,size).filter(Boolean);
  const players=Array.isArray(row.counted_players)?row.counted_players:(row.ersatz_counted&&slots[size]?[...lineup,slots[size]]:lineup);
  const released=await _patchMatchIf(match.id,'counted=is.true',{counted:false,ersatz_counted:false,counted_players:null});
  if(!released)return'already';
  const cur=await _freshCounts(match.teamId);
  for(const pid of players){
    const next=Math.max(0,(cur[pid]||0)-1);
    await sbUpsert('player_match_counts',[{player_id:pid,team_id:match.teamId,matches_played:next}]);
    if(!state.matchCounts[pid])state.matchCounts[pid]={};state.matchCounts[pid][match.teamId]=next;
  }
  match.counted=false;match.ersatzCounted=false;match.countedPlayers=null;
  return'ok';
}
async function kapConfirmMatch(){

    renderTeamContent();renderAvailPanel();renderBlocking();

  }catch(e){console.error(e);setSync('err','✕ '+tr('moveErrSave'));if(btn){btn.disabled=false;btn.textContent='✔ '+tr('countBtn');}}
}
async function kapUndoMatchCount(){
  const match=state.matches.find(m=>m.id===selectedMatchId);if(!match||!match.counted)return;

// Builds a plain-text summary of the selected match + lineup. Always German: it goes to the team chat.

  }
  const orig=m.movedFrom?(state.movedMatches||[]).find(x=>x.id===m.movedFrom):null;
  if(orig)L.push(`⇄ Verlegt vom ${fmtDate(orig.date)} ${orig.time||''}`.trim());
  if(spieltagOf(m)!==m.date)L.push(`(Spieltag ${fmtDate(spieltagOf(m))})`);
  L.push('');
  L.push('*Aufstellung*');
  for(let i=0;i<size;i++){
    const p=slots[i]?playerById(slots[i]):null;
    L.push(`${i+1}. ${p?p.name+(p.lkStr?` (${p.lkStr})`:''):'— offen —'}`);
  }
  const e=slots[size]?playerById(slots[size]):null;
  L.push(`Ersatz: ${e?e.name+(e.lkStr?` (${e.lkStr})`:''):'—'}`);
  return L.join('\n');
}

async function doMoveMatch(){
  const m=state.matches.find(x=>x.id===selectedMatchId);if(!m)return;
  if(!canEditTeam(m.teamId)){closeMoveModal();return;}
  const date=document.getElementById('mv-date').value;
  const time=document.getElementById('mv-time').value;
  const home=document.getElementById('mv-home').value;
  const note=document.getElementById('mv-note').value.trim();
  const keepLineup=document.getElementById('mv-lineup').checked;
  const keepAvail=document.getElementById('mv-avail').checked;
  const amtlich=document.getElementById('mv-amtlich').checked;
  const err=document.getElementById('mv-err');
  if(!date||!time){err.textContent=tr('moveErrMissing');return;}
  if(date===m.date&&time===m.time&&home===m.home){err.textContent=tr('moveErrSame');return;}
  const btn=document.getElementById('mv-go');btn.disabled=true;btn.textContent='...';
  setSync('ing','⟳');
  const newId=uid();
  try{
    // 1) new match
    // Spieltag stays the original one (WSpO § 11 (4)) unless moved "von Amts wegen"
    await sbUpsert('matches',[{id:newId,team_id:m.teamId,opponent:m.opponent,date,time,home,venue:m.venue,moved_from:m.id,spieltag:amtlich?date:spieltagOf(m)}]);
    // 2) copy lineup / availability if requested
    if(keepLineup&&(state.lineups[m.id]||[]).some(Boolean))await sbUpsert('lineups',[{match_id:newId,slots:state.lineups[m.id]}]);
    if(keepAvail){
      const rows=Object.entries(state.availability[m.id]||{}).map(([pid,status])=>({match_id:newId,player_id:pid,status}));
      for(let i=0;i<rows.length;i+=100)await sbUpsert('availability',rows.slice(i,i+100));
    }
    // 3) mark original as verlegt
    const r=await fetch(`${SB_URL}/rest/v1/matches?id=eq.${m.id}`,{method:'PATCH',headers:getHDR(),
      body:JSON.stringify({status:'verlegt',moved_to:newId,move_note:note||null,moved_at:new Date().toISOString(),moved_by:currentUsername()})});
    if(!r.ok)throw new Error(await r.text());
    closeMoveModal();
    selectedMatchId=newId;
    await loadAll();
    selectMatch(newId);
  }catch(e){
    console.error(e);setSync('err','✕ '+tr('moveErrSave'));
    err.textContent=tr('moveErrSave');btn.disabled=false;btn.textContent=tr('moveGo');
  }
}

// ── API ──
function getHDR(){
  const token=_session?.access_token||SB_KEY;
  return{'apikey':SB_KEY,'Authorization':'Bearer '+token,'Content-Type':'application/json'};
}
async function sbGet(t,p=''){
  const r=await fetch(`${SB_URL}/rest/v1/${t}?${p}`,{headers:{...getHDR(),'Prefer':''}});
  if(!r.ok)throw new Error(await r.text());
  return r.json();
}
// Supabase returns max. 1000 rows per request → always page through big tables (stable order required)
async function sbGetAll(t,p=''){let out=[],off=0;while(true){const b=await sbGet(t,`${p}${p?'&':''}limit=1000&offset=${off}`);out=out.concat(b);if(b.length<1000)break;off+=1000;}return out;}
// Rows whose <col> is one of <ids>, fetched in chunks so the URL stays short (R1: load only the active season)
async function sbGetIn(t,col,ids,p=''){
  const list=[...new Set(ids)].filter(Boolean),out=[];
  for(let i=0;i<list.length;i+=150){
    const chunk=list.slice(i,i+150).map(encodeURIComponent).join(',');
    out.push(...await sbGetAll(t,`${col}=in.(${chunk})${p?'&'+p:''}`));
  }
  return out;
}
async function sbUpsert(t,d){
  const r=await fetch(`${SB_URL}/rest/v1/${t}`,{method:'POST',headers:{...getHDR(),'Prefer':'resolution=merge-duplicates'},body:JSON.stringify(Array.isArray(d)?d:[d])});
  if(!r.ok)throw new Error(await r.text());
}

// ── HELPERS ──
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,5)}
function initials(n){return n.split(' ').map(w=>w[0]).join('').toUpperCase().slice(0,2)}
function fmtDate(d){if(!d)return'';const[y,m,day]=d.split('-');return`${day}.${m}.${y}`}
function teamById(id){return (state.allTeams||state.teams).find(t=>t.id===id)} // allTeams: conflicts across blocks stay visible
function playerById(id){return state.players.find(p=>p.id===id)}
function teamSize(t){return t&&(t.is_4er||t.season==='Winter')?4:6}
function catGender(cat){if(!cat)return'M';const j=cat.match(/^U\d+\s*(m|w)?$/);if(j)return j[1]==='w'?'F':j[1]==='m'?'M':'X';return cat.toLowerCase().startsWith('damen')?'F':'M';}
// ── CATEGORY ORDER: Herren (0) → Damen (1) → Jugend U.. (2); Jugend: U18 → U10, m → w → gemischt ──
function catGroup(cat){cat=cat||'';if(/^U\d+/.test(cat))return 2;return /^Damen/i.test(cat)?1:0;}
function catAge(cat){cat=cat||'';const j=cat.match(/^U(\d+)\s*(m|w)?/);if(j)return(100-parseInt(j[1]))+(j[2]==='m'?0:j[2]==='w'?0.1:0.2);return parseInt(cat.replace(/^(Herren|Damen)\s*/,''))||0;}
function catCmp(a,b){return catGroup(a)-catGroup(b)||catAge(a)-catAge(b);}
function teamNumber(team){
  const n=parseInt(team.teamNumber||team.team_number||0);
  if(n>0&&n<10)return n;
  const roman={I:1,II:2,III:3,IV:4,V:5,VI:6,VII:7,VIII:8};
  const r=team.name.match(/\b(VIII|VII|VI|IV|V|III|II)\b/);
  if(r)return roman[r[1]]||1;
  return 1;
}
function playerRankInTeam(playerId,teamId){
  const team=teamById(teamId);if(!team)return 999;
  const cat=team.category;
  const catTeams=(state.allTeams||state.teams).filter(t=>t.category===cat).sort((a,b)=>teamNumber(a)-teamNumber(b));
  // Use the rank from the first team in the category where the player has a rank entry
  // This is the player's global position in the Namentliche Mannschaftsmeldung for this category
  const playerRanks=state.rankByTeam[playerId]||{};
  for(const t of catTeams){const r=playerRanks[t.id];if(r!=null)return r;}
  return playerById(playerId)?.rank||999;
}
function lkExceedsTeam(playerId,teamId){
  // LK > 20 rule: in Herren category, players with LK > 20 can only play in team #3+
  const team=teamById(teamId);if(!team)return false;
  if(team.category!=='Herren')return false;
  const p=playerById(playerId);if(!p)return false;
  return(p.lk||0)>20&&teamNumber(team)<3;
}
function isPlayerBlockedForTeam(playerId,teamId){
  if(lkExceedsTeam(playerId,teamId))return true;
  const team=teamById(teamId);if(!team)return false;
  const status=getPlayerBlockStatus(playerId,team.category);
  return status.blocked.some(b=>b.id===teamId);
}
// For lineup display only — ignores LK>20 rule, only shows real Stammkader/SM blocks
// ── SPIELTAG (WSpO TVBB § 10 (3), § 11 (4)) ── a match moved by the captains keeps the ORIGINAL date as Spieltag
// (unless moved "von Amts wegen" → new date). All same-day rules compare Spieltage, not real dates.
function spieltagOf(m){return (m&&(m.spieltag||m.date))||'';}
function playedInMatch(m){
  if(!m)return[];
  if(Array.isArray(m.countedPlayers))return m.countedPlayers;
  const size=teamSize(teamById(m.teamId));return (state.lineups[m.id]||[]).slice(0,size).filter(Boolean);
}
// For a verlegt match: the other match of the same Spieltag that this player already played (earlier real date), or null
function playedOnSpieltag(pid,match){
  if(!match)return null;
  const st=spieltagOf(match);if(st===match.date)return null;
  return state.matches.find(om=>om.id!==match.id&&spieltagOf(om)===st&&om.date<match.date&&playedInMatch(om).includes(pid))||null;
}
function isPlayerBlockedForLineup(playerId,teamId,matchId){
  if(matchId&&playedOnSpieltag(playerId,state.matches.find(x=>x.id===matchId)))return true;
  const team=teamById(teamId);if(!team)return false;
  const status=getPlayerBlockStatus(playerId,team.category);
  return status.blocked.some(b=>b.id===teamId);
}
function getStammkaderTeam(playerId,catGroup){
  const catTeams=(state.allTeams||state.teams).filter(t=>t.category===catGroup).sort((a,b)=>teamNumber(a)-teamNumber(b));
  if(!catTeams.length)return null;
  // Use category-specific rank from rankByTeam (no fallback - player must have a rank in this category)
  const playerRanks=state.rankByTeam[playerId]||{};
  let rankInCat=null;
  for(const t of catTeams){const r=playerRanks[t.id];if(r!=null){rankInCat=r;break;}}
  if(rankInCat==null)return null;
  let remaining=rankInCat;
  for(const t of catTeams){const gs=teamSize(t);if(remaining<=gs)return t;remaining-=gs;}
  return catTeams[catTeams.length-1];
}
function getPlayerBlockStatus(playerId,catGroup){
  const counts=state.matchCounts[playerId]||{};
  const catTeams=(state.allTeams||state.teams).filter(t=>t.category===catGroup).sort((a,b)=>teamNumber(a)-teamNumber(b));
  const stammkaderTeam=getStammkaderTeam(playerId,catGroup);
  const stammkaderTeamNum=stammkaderTeam?teamNumber(stammkaderTeam):null;
  const stammkaderBlocked=stammkaderTeamNum!==null?catTeams.filter(t=>teamNumber(t)>stammkaderTeamNum):[];
  const stammmannschaftBlocked=[],stammmannschaftWarned=[];
  for(const t of catTeams){
    const tNum=teamNumber(t);
    const sup=catTeams.filter(s=>teamNumber(s)<tNum).reduce((sum,s)=>sum+(counts[s.id]||0),0);
    if(sup>=2)stammmannschaftBlocked.push(t);
    else if(sup===1)stammmannschaftWarned.push(t);
  }
  const allBlockedIds=new Set([...stammkaderBlocked.map(t=>t.id),...stammmannschaftBlocked.map(t=>t.id)]);
  return{stammkaderTeam,stammkaderBlocked,stammmannschaftBlocked,stammmannschaftWarned,blocked:catTeams.filter(t=>allBlockedIds.has(t.id)),warned:stammmannschaftWarned};
}

// ── STATE ──
let state={teams:[],players:[],matches:[],availability:{},lineups:{},matchCounts:{},rankByTeam:{},mainTeam:{}};
let selectedTeamId=null;
let selectedMatchId=null;

// ── LOAD ──
async function loadAll(){
  setSync('ing','⟳');
  await _seasonReady;
  try{
    // Active season only (R1) and only the columns that are used (R2): teams + players first, then what belongs to them
    const[teams,players]=await Promise.all([
      sbGet('teams',`season_id=eq.${ACTIVE_SEASON}&order=category,team_number`),
      sbGetAll('players',`season_id=eq.${ACTIVE_SEASON}&order=lk,id`)
    ]);
    const _tids=teams.map(t=>t.id);
    const[matches,countRows,ptAll]=await Promise.all([
      sbGetIn('matches','team_id',_tids,'order=date,id'),
      sbGetIn('player_match_counts','team_id',_tids,'select=player_id,team_id,matches_played&order=player_id,team_id'),
      sbGetIn('player_teams','team_id',_tids,'select=player_id,team_id,rank,is_mainteam&order=player_id,team_id')
    ]);
    const _mids=matches.map(m=>m.id);
    const[avRows,lineupRows]=await Promise.all([
      sbGetIn('availability','match_id',_mids,'select=match_id,player_id,status&order=match_id,player_id'),
      sbGetIn('lineups','match_id',_mids,'select=match_id,slots&order=match_id')
    ]);
    state.allTeams=teams.map(t=>({id:t.id,name:t.name,liga:t.liga,season:t.season,is_4er:t.is_4er||false,category:t.category||'Herren',teamNumber:t.team_number||1,gender:t.gender||catGender(t.category)}));
    const _activeTeamIds=new Set(state.allTeams.map(t=>t.id));
    // ── ACCESS ── everyone SEES all teams (Jugend logins: only Jugend); editing only for the own team, see canEditTeam()
    state.teams=isJugendLogin()?state.allTeams.filter(t=>catGroup(t.category)===2):state.allTeams;
    renderWhoBadge();
    state.players=players.map(p=>({id:p.id,name:p.name,idnr:p.idnr,lk:p.lk,lkStr:p.lk_str,year:p.year,teamIds:[],gender:p.gender||'M',rank:p.rank}));
    // Verlegt: the original stays as an archived card (state.movedMatches); everything else (conflicts,
    // overview, Sperren) only uses the active matches in state.matches
    const _seasonMatches=matches.filter(m=>_activeTeamIds.has(m.team_id)).map(m=>({id:m.id,teamId:m.team_id,opponent:m.opponent,date:m.date,time:m.time,home:m.home,venue:m.venue,
      status:m.status||null,movedTo:m.moved_to||null,movedFrom:m.moved_from||null,moveNote:m.move_note||'',movedAt:m.moved_at||null,movedBy:m.moved_by||'',
      spieltag:m.spieltag||null,counted:m.counted||false,ersatzCounted:m.ersatz_counted||false,countedPlayers:Array.isArray(m.counted_players)?m.counted_players:null}));
    state.matches=_seasonMatches.filter(m=>m.status!=='verlegt');
    state.movedMatches=_seasonMatches.filter(m=>m.status==='verlegt');
    state.availability={};
    for(const r of avRows){if(!state.availability[r.match_id])state.availability[r.match_id]={};state.availability[r.match_id][r.player_id]=r.status;}
    state.lineups={};
    for(const r of lineupRows)state.lineups[r.match_id]=r.slots;
    state.matchCounts={};
    for(const r of countRows){if(!state.matchCounts[r.player_id])state.matchCounts[r.player_id]={};state.matchCounts[r.player_id][r.team_id]=r.matches_played;}
    const ptRows=ptAll;
    state.rankByTeam={};
    state.mainTeam={};
    for(const r of ptRows){
      if(!_activeTeamIds.has(r.team_id))continue; // other seasons stay archived
      const p=state.players.find(x=>x.id===r.player_id);
      if(p&&!p.teamIds.includes(r.team_id))p.teamIds.push(r.team_id);
      if(r.rank!=null){if(!state.rankByTeam[r.player_id])state.rankByTeam[r.player_id]={};state.rankByTeam[r.player_id][r.team_id]=r.rank;}
      if(r.is_mainteam){if(!state.mainTeam[r.player_id])state.mainTeam[r.player_id]={};state.mainTeam[r.player_id][r.team_id]=true;}
    }
    setSync('ok','● sync');
    buildMultiCatList();
    _kapOvSelectedCats=null;
    renderTeamSidebar();
    if(selectedTeamId)renderTeamContent();
    if(selectedMatchId)renderAvailPanel();
  }catch(e){setSync('err','✕ offline');console.error(e);}
}

// ── SIDEBAR ──
function renderTeamSidebar(){
  const byCat={};
  for(const t of state.teams){
    const c=t.category||'Herren';
    if(!byCat[c])byCat[c]=[];
    byCat[c].push(t);
  }
  let html='';
  for(const[cat,teams] of Object.entries(byCat).sort((a,b)=>{
    const cc=catCmp(a[0],b[0]);if(cc)return cc;
    return a[0].localeCompare(b[0]);
  })){
    html+=`<div style="font-size:10px;font-weight:600;color:#444;text-transform:uppercase;letter-spacing:.5px;margin:10px 0 4px;padding-left:4px">${cat}</div>`;
    for(const t of teams.sort((a,b)=>teamNumber(a)-teamNumber(b))){
      const matches=state.matches.filter(m=>m.teamId===t.id);
      const active=selectedTeamId===t.id?'active':'';
      html+=`<button class="team-btn ${active}" onclick="selectTeam('${t.id}')">
        <span class="team-dot"></span>
        <span style="flex:1">${t.name}</span>
        <span style="font-size:10px;color:#444">${matches.length}</span>
      </button>`;
    }
  }
  document.getElementById('team-list-sidebar').innerHTML=html||'<div class="empty" style="padding:10px">Keine Teams</div>';
  // mobile dropdown with the same teams, grouped by category
  const sel=document.getElementById('team-select');
  if(sel){
    const cats=Object.entries(byCat).sort((a,b)=>catCmp(a[0],b[0])||a[0].localeCompare(b[0]));
    sel.innerHTML=`<option value="">${tr('pickTeam')}</option>`+cats.map(([cat,teams])=>`<optgroup label="${cat}">${
      teams.slice().sort((a,b)=>teamNumber(a)-teamNumber(b)).map(t=>`<option value="${t.id}"${selectedTeamId===t.id?' selected':''}>${t.name}${t.liga?' · '+t.liga:''}</option>`).join('')}</optgroup>`).join('');
  }
}

function renderTeamContent(){
  const team=teamById(selectedTeamId);if(!team)return;
  document.getElementById('content-team-name').textContent=team.name;
  document.getElementById('content-team-meta').textContent=`${team.liga} · ${team.season} · ${teamSize(team)} Spieler`;
  const matches=[...state.matches,...(state.movedMatches||[])].filter(m=>m.teamId===selectedTeamId).sort((a,b)=>a.date.localeCompare(b.date)||(a.time||'').localeCompare(b.time||''));
  if(!matches.length){
    document.getElementById('match-list').innerHTML='<div class="empty">Keine Spiele für diese Mannschaft</div>';
    return;
  }
  document.getElementById('match-list').innerHTML=matches.map(m=>{
    const opp=(m.opponent||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
    if(m.status==='verlegt'){
      const nm=state.matches.find(x=>x.id===m.movedTo);
      return`<div class="match-card moved">
        <div class="match-header">
          <div>
            <div class="match-title">${team.name} vs ${opp}</div>
            <div class="match-meta">📅 ${fmtDate(m.date)} · ${m.time} · ${m.home}</div>
          </div>
          <span class="match-status status-moved">⇄ ${tr('movedBadge')}</span>
        </div>
        ${nm?`<div class="moved-link">→ ${tr('movedNewDate')}: <b>${fmtDate(nm.date)} · ${nm.time}</b>${m.movedAt?` · ${tr('movedOn')(fmtDate(m.movedAt.slice(0,10)),m.movedBy)}`:''}</div>`:''}
      </div>`;
    }
    const avail=state.availability[m.id]||{};
    const tp=state.players.filter(p=>p.teamIds.includes(m.teamId));
    const yes=tp.filter(p=>avail[p.id]==='yes').length;
    const pct=tp.length>0?Math.round(yes/tp.length*100):0;
    const _lineupTeam=teamById(m.teamId);
    const _lineupSize=teamSize(_lineupTeam);
    const _slots=state.lineups[m.id]||[];
    const hasLineup=_slots.slice(0,_lineupSize).filter(Boolean).length>=_lineupSize;
    const isActive=selectedMatchId===m.id;
    return`<div class="match-card ${isActive?'active':''}" onclick="selectMatch('${m.id}')">
      <div class="match-header">
        <div>
          <div class="match-title">${team.name} vs ${opp}${m.movedFrom?`<span class="status-new">${tr('newBadge')}</span>`:''}</div>
          <div class="match-meta">📅 ${fmtDate(m.date)} · ${m.time} · ${m.home}</div>
        </div>
        <span class="match-status ${hasLineup||m.counted?'status-ready':'status-open'}">${m.counted?'✔ '+tr('countedShort'):hasLineup?'✓ Aufstellung':'⏳ offen'}</span>
      </div>
      <div class="prog-bar"><div class="prog-fill" style="width:${pct}%"></div></div>
      <div style="font-size:11px;color:var(--muted);margin-top:4px">${yes}/${tp.length} verfügbar</div>
    </div>`;
  }).join('');
}

// ── WOCHENENDE: other matches on the same Sat/Sun (different day) ──
// Only a hint, never a block: playing Sat + Sun in different teams is allowed.
const _WD=['So','Mo','Di','Mi','Do','Fr','Sa'];
function _wdOf(date){return date?new Date(date+'T12:00:00').getDay():null;}
function _addDays(date,n){const d=new Date(date+'T12:00:00');d.setDate(d.getDate()+n);return d.toISOString().slice(0,10);}
function weekendOtherDate(match){
  const wd=_wdOf(match.date);
  if(wd===6)return _addDays(match.date,1); // Sa → So
  if(wd===0)return _addDays(match.date,-1); // So → Sa
  return null; // weekday match: no weekend check
}
function weekendMatches(match){
  const other=weekendOtherDate(match);if(!other)return[];
  return state.matches.filter(m=>m.id!==match.id&&m.date===other)
    .sort((a,b)=>(a.time||'').localeCompare(b.time||'')||teamNumber(teamById(a.teamId)||{name:''})-teamNumber(teamById(b.teamId)||{name:''}));
}
function _teamShort(t){
  let n=(t?.name||'?').replace('Seniorinnen','SenF').replace('Senioren','Sen').replace('Herren','H').replace('Damen','D').trim();
  // first team of a category with more than one team → "H I" (plain "H" is ambiguous)
  const siblings=(state.allTeams||state.teams).filter(x=>x.category===t?.category);
  if(t&&siblings.length>1&&teamNumber(t)===1&&!/\b(I|II|III|IV|V|VI|VII|VIII)$/.test(n))n+=' I';
  return n;
}
function weekendBadges(pid,match){
  const play=[],ans=[];
  for(const om of weekendMatches(match)){
    const ot=teamById(om.teamId);const sz=teamSize(ot);
    const slots=state.lineups[om.id]||[];
    const day=_WD[_wdOf(om.date)];
    const inMain=slots.slice(0,sz).includes(pid),inErsatz=slots[sz]===pid;
    if(inMain||inErsatz){
      const lbl=inMain?tr('wkPlay'):tr('wkErsatz');
      play.push(`<span class="wk-badge play" title="${tr('wkPlayTitle')(day,fmtDate(om.date),ot?.name||'?',om.time||'')}">${day}: ${lbl} ${_teamShort(ot)}</span>`);
    }else{
      const st=state.availability[om.id]?.[pid];
      if(st==='yes'||st==='conditional')
        ans.push(`<span class="wk-badge ans" title="${tr('wkAnsTitle')(day,fmtDate(om.date),ot?.name||'?')}">${day}: ${st==='yes'?'Ja':'(Ja)'} ${_teamShort(ot)}</span>`);
    }
  }
  return play[0]||ans[0]||''; // only one badge: aufgestellt beats zugesagt
}

          // Check if Prio II player is in another lineup on same day
          const conflictMatch=state.matches.find(om=>
            om.id!==match.id&&spieltagOf(om)===spieltagOf(match)&&
            (state.lineups[om.id]||[]).slice(0,teamSize(teamById(om.teamId))).includes(p.id)
          );
          const conflictTeam=conflictMatch?teamById(conflictMatch.teamId):null;
          // Ersatz in another match on the same Spieltag → just a flag
          const ersatzMatch=conflictMatch?null:state.matches.find(om=>
            om.id!==match.id&&spieltagOf(om)===spieltagOf(match)&&
            (state.lineups[om.id]||[])[teamSize(teamById(om.teamId))]===p.id
          );
          const ersatzTeam=ersatzMatch?teamById(ersatzMatch.teamId):null;
          const ersatzFlag=ersatzTeam?'<span title="'+(lang==='de'?'Ersatz bei '+ersatzTeam.name:lang==='es'?'Ersatz en '+ersatzTeam.name:'Substitute for '+ersatzTeam.name)+'" style="background:#2a2a2a;color:#bbb;border:1px dashed #555;border-radius:10px;padding:2px 8px;font-size:10px;font-weight:700;letter-spacing:.5px;margin-left:4px;cursor:help">Ersatz ('+_teamShort(ersatzTeam)+')</span>':'';
          
          if(conflictTeam){
            const teamShort=_teamShort(conflictTeam);
            const bereitTitle=lang==='de'?'Bereits aufgestellt in '+conflictTeam.name:lang==='es'?'Ya alineado en '+conflictTeam.name:'Already in lineup for '+conflictTeam.name;
            extraBadge='<span title="'+bereitTitle+'" style="background:#2a2a2a;color:#bbb;border-radius:10px;padding:2px 8px;font-size:10px;font-weight:700;letter-spacing:.5px;margin-left:4px;cursor:help">Bereits aufgestellt ('+teamShort+')</span>';
          } else if(ersatzFlag){
            extraBadge=ersatzFlag;
          } else if(yesMatch&&yesTeam){
            try{
              const ySz=teamSize(yesTeam);
              const ySlots=state.lineups[yesMatch.id]||[];
              const yMain=ySlots.slice(0,ySz);
              const yFull=yMain.filter(Boolean).length>=ySz;
              const yErsatz=ySlots[ySz]||null;
              const inYLineup=yMain.includes(p.id)||yErsatz===p.id;
              if(yFull&&!inYLineup){
                const freiTitle=lang==='de'?'Aufstellung von '+yesTeam.name+' ist voll, Spieler nicht aufgestellt — frei für dieses Spiel':lang==='es'?'La alineación de '+yesTeam.name+' está completa, jugador no alineado — libre para este partido':yesTeam.name+' lineup is full, player not in lineup — free for this match';
                extraBadge='<span title="'+freiTitle+'" style="background:#2a2a2a;color:#bbb;border:1px solid #52b78844;border-radius:10px;padding:2px 8px;font-size:10px;font-weight:700;letter-spacing:.5px;margin-left:4px;cursor:help;box-shadow:0 0 0 1px #52b78822">FREI</span>';
              }
            }catch(e){
              console.error('FREI badge error:',e);
            }
          }
        }
        
        // Im Notfall: same "Bereits aufgestellt" check as Prio II
        if(s==='notfall'){
          const conflictMatch=state.matches.find(om=>
            om.id!==match.id&&spieltagOf(om)===spieltagOf(match)&&
            (state.lineups[om.id]||[]).slice(0,teamSize(teamById(om.teamId))).includes(p.id)
          );
          const conflictTeam=conflictMatch?teamById(conflictMatch.teamId):null;
          // Ersatz in another match on the same Spieltag → just a flag
          const ersatzMatch=conflictMatch?null:state.matches.find(om=>
            om.id!==match.id&&spieltagOf(om)===spieltagOf(match)&&
            (state.lineups[om.id]||[])[teamSize(teamById(om.teamId))]===p.id
          );
          const ersatzTeam=ersatzMatch?teamById(ersatzMatch.teamId):null;
          const ersatzFlag=ersatzTeam?'<span title="'+(lang==='de'?'Ersatz bei '+ersatzTeam.name:lang==='es'?'Ersatz en '+ersatzTeam.name:'Substitute for '+ersatzTeam.name)+'" style="background:#2a2a2a;color:#bbb;border:1px dashed #555;border-radius:10px;padding:2px 8px;font-size:10px;font-weight:700;letter-spacing:.5px;margin-left:4px;cursor:help">Ersatz ('+_teamShort(ersatzTeam)+')</span>':'';
          if(conflictTeam){
            const teamShort=_teamShort(conflictTeam);
            const bereitTitle=lang==='de'?'Bereits aufgestellt in '+conflictTeam.name:lang==='es'?'Ya alineado en '+conflictTeam.name:'Already in lineup for '+conflictTeam.name;
            extraBadge='<span title="'+bereitTitle+'" style="background:#2a2a2a;color:#bbb;border-radius:10px;padding:2px 8px;font-size:10px;font-weight:700;letter-spacing:.5px;margin-left:4px;cursor:help">Bereits aufgestellt ('+teamShort+')</span>';
          }else if(ersatzFlag){
            extraBadge=ersatzFlag;
          }
        }

        const bg=s==='yes'?'#1a2e26':s==='conditional'?'rgba(82,201,122,.1)':s==='notfall'?'#2e2a1a':s==='no'?'#2d1a1a':'#252525';
        const col=s==='yes'?'var(--court)':s==='conditional'?'#52c97a':s==='notfall'?'var(--warn)':s==='no'?'var(--danger)':'var(--muted)';
        // max. one extra badge: same-day (Bereits aufgestellt / FREI) wins over the weekend hint
        if(!extraBadge)extraBadge=weekendBadges(p.id,match);
        // extra badges first, status badge last → status badges line up on the right
        return '<span class="avail-tags">'+extraBadge+'</span><span class="avail-badge" style="background:'+bg+';color:'+col+';border-radius:10px;padding:2px 8px;font-size:11px;font-weight:600;margin-left:4px">'+badgeLabel+'</span>';
      })()}
    </div>`;
  }
  document.getElementById('avail-list').innerHTML=html;
  renderLineupSlots();
}

let _dragSrcIndex=null;
function onSlotDragStart(e,index){
  _dragSrcIndex=index;
  e.currentTarget.classList.add('dragging');
  e.dataTransfer.effectAllowed='move';
  e.dataTransfer.setData('text/plain',index);
}
function onSlotDragOver(e){
  e.preventDefault();
  e.dataTransfer.dropEffect='move';
  e.currentTarget.classList.add('drag-over');
}
function onSlotDragLeave(e){
  e.currentTarget.classList.remove('drag-over');
}
function onSlotDragEnd(e){
  e.currentTarget.classList.remove('dragging');
  document.querySelectorAll('.lineup-slot').forEach(s=>s.classList.remove('drag-over'));
  _dragSrcIndex=null;
}
async function onSlotDrop(e,destIndex){
  if(denyEdit())return;
  e.preventDefault();
  e.currentTarget.classList.remove('drag-over');
  if(_dragSrcIndex===null||_dragSrcIndex===destIndex)return;
  const lineup=state.lineups[selectedMatchId]||[];
  const match=state.matches.find(m=>m.id===selectedMatchId);if(!match)return;
  const size=teamSize(teamById(match.teamId));
  // Swap the two slots
  const newLineup=[...lineup];
  while(newLineup.length<=Math.max(_dragSrcIndex,destIndex))newLineup.push(null);
  [newLineup[_dragSrcIndex],newLineup[destIndex]]=[newLineup[destIndex],newLineup[_dragSrcIndex]];
  state.lineups[selectedMatchId]=newLineup;
  document.getElementById('save-indicator').innerHTML='<span class="spinner"></span>Speichern...';
  try{
    await sbUpsert('lineups',[{match_id:selectedMatchId,slots:newLineup}]);
    document.getElementById('save-indicator').textContent='✓ Gespeichert';
    setTimeout(()=>document.getElementById('save-indicator').textContent='',2000);
  }catch(e){console.error(e);}
  renderLineupSlots();
}

function renderLineupSlots(){
  const match=state.matches.find(m=>m.id===selectedMatchId);if(!match)return;
  const team=teamById(match.teamId);
  const size=teamSize(team);
  const avail=state.availability[selectedMatchId]||{};
  const allTp=[...state.players.filter(p=>p.teamIds.includes(match.teamId))].sort((a,b)=>playerRankInTeam(a.id,match.teamId)-playerRankInTeam(b.id,match.teamId));
  const lineup=state.lineups[selectedMatchId]||[];

  // LK-order warnings (same logic as admin renderLineup)
  const warnings=[];
  for(let i=0;i<size-1;i++){
    const p1=lineup[i]?playerById(lineup[i]):null;
    const p2=lineup[i+1]?playerById(lineup[i+1]):null;
    if(p1&&p2&&playerRankInTeam(p1.id,match.teamId)>playerRankInTeam(p2.id,match.teamId))
      warnings.push(`⚠️ Pos. ${i+1} (Rang ${playerRankInTeam(p1.id,match.teamId)}) vor Pos. ${i+2} (Rang ${playerRankInTeam(p2.id,match.teamId)})`);

  }
  const blockedWarnings=lineup.filter(Boolean).map(pid=>{
    const p=playerById(pid);if(!p)return null;
    const _sp=playedOnSpieltag(pid,match);
    if(_sp)return tr('playedOnSpieltag')(p.name,fmtDate(spieltagOf(match)),teamById(_sp.teamId)?.name||'?');
    if(isPlayerBlockedForLineup(pid,match.teamId,match.id))return tr('isBlocked')(p.name,team?.name||'?');
    return null;
  }).filter(Boolean);

  // Double-booking warnings for the main lineup (same Spieltag, other team)
  const doubleWarnings=lineup.slice(0,size).filter(Boolean).map(pid=>{
    const p=playerById(pid);if(!p)return null;
    if(playedOnSpieltag(pid,match))return null; // already reported as Spieltag block
    const otherMatch=state.matches.find(om=>
      om.id!==selectedMatchId&&spieltagOf(om)===spieltagOf(match)&&
      (state.lineups[om.id]||[]).slice(0,teamSize(teamById(om.teamId))).includes(pid)
    );
    if(!otherMatch)return null;
    const otherTeam=teamById(otherMatch.teamId);
    return`⚠ ${p.name} spielt auch für <strong>${otherTeam?.name||'?'}</strong> am selben Tag`;
  }).filter(Boolean);
  const hints=[...warnings,...doubleWarnings];

  const filledCount=lineup.slice(0,size).filter(Boolean).length;
  let warnHtml='';
  const li=(arr,re)=>arr.map(w=>`<li>${w.replace(re,'')}</li>`).join('');
  if(blockedWarnings.length)warnHtml+=`<details class="warn-group red" open><summary>⛔ ${tr('nBlocks')(blockedWarnings.length)}</summary><ul>${li(blockedWarnings,/^⛔\s*/)}</ul></details>`;
  if(hints.length)warnHtml+=`<details class="warn-group amber"${window.innerWidth>700?' open':''}><summary>⚠ ${tr('nHints')(hints.length)}</summary><ul>${li(hints,/^⚠️?\s*/)}</ul></details>`;
  if(!blockedWarnings.length&&!hints.length){
    if(filledCount>=size)
      warnHtml=`<div class="ok-banner">✓ Aufstellung vollständig</div>`;
    else if(filledCount>0)
      warnHtml+=`<div style="background:#2e2a15;border:1px solid #ffd70044;border-radius:8px;padding:6px 12px;margin-bottom:10px;font-size:12px;color:#ffd700">⏳ Aufstellung unvollständig (${filledCount}/${size})</div>`;
  }
  document.getElementById('lineup-warnings').innerHTML=warnHtml;

  // Slots — sorted by availability then rank, with group separators (same as admin)
  const _ao2={yes:0,conditional:1,notfall:2,'':3,no:4};
  const sorted=[...allTp].sort((a,b)=>{
    const ao=_ao2[avail[a.id]||'']??2, bo=_ao2[avail[b.id]||'']??2;
    if(ao!==bo)return ao-bo;
    return playerRankInTeam(a.id,match.teamId)-playerRankInTeam(b.id,match.teamId);
  });

  const _gl2={yes:tr('dropYes'),conditional:tr('dropConditional'),notfall:tr('dropNotfall'),no:tr('dropNo'),'':tr('dropNone')};
  function buildOpts(selectedPid){
    let opts='<option value="">—</option>';let _lgu=undefined;
    for(const tp of sorted){
      const bl=isPlayerBlockedForLineup(tp.id,match.teamId,match.id);const grp=avail[tp.id]||'';
      let sep='';if(grp!==_lgu){_lgu=grp;sep=`<option disabled style="color:var(--muted);font-size:10px">${_gl2[grp]}</option>`;}
      opts+=sep+`<option value="${tp.id}" ${selectedPid===tp.id?'selected':''}>${bl?'⛔ ':''}${tp.name} (${tp.lkStr}) ${avail[tp.id]==='yes'?'✓':avail[tp.id]==='no'?'✗':'?'} ${tp.year||''}</option>`;
    }
    return opts;
  }
  const canEdit=canEditTeam(match.teamId);
  const ro=!canEdit||!!match.counted; // read-only for other teams, and locked once counted
  const dis=ro?'disabled':'';
  ['auto-btn','sort-btn'].forEach(id=>{const b=document.getElementById(id);if(b)b.style.display=ro?'none':'';});
  let slotsHtml=ro?`<div style="background:#1a1a1a;border:1px solid #333;border-radius:8px;padding:6px 12px;margin-bottom:10px;font-size:12px;color:var(--muted)">🔒 ${tr(canEdit?'countedLocked':'readOnly')}</div>`:'';
  renderCountWrap(match,lineup,size,filledCount,canEdit);
  for(let i=0;i<size;i++){
    const pid=lineup[i]||'';
    const p=pid?playerById(pid):null;
    const prev=i>0&&lineup[i-1]?playerById(lineup[i-1]):null;
    const rankOk=!p||!prev||playerRankInTeam(p.id,match.teamId)>=playerRankInTeam(prev.id,match.teamId);
    const isBlocked=pid?isPlayerBlockedForLineup(pid,match.teamId,match.id):false;
    const cls=p?(isBlocked?'blocked-slot':rankOk?'ok':'warning'):'';
    slotsHtml+=`<div class="lineup-slot ${cls}" ${ro?'':'draggable="true"'} data-slot-index="${i}"
      ondragstart="onSlotDragStart(event,${i})"
      ondragover="onSlotDragOver(event)"
      ondragleave="onSlotDragLeave(event)"
      ondrop="onSlotDrop(event,${i})"
      ondragend="onSlotDragEnd(event)">
      <span class="drag-handle" title="Ziehen zum Umsortieren">⠿</span>
      <div class="lineup-pos">${i+1}</div>
      <select ${dis} onchange="setSlot(${i},this.value)">${buildOpts(pid)}</select>
    </div>`;
  }

  // Ersatz slot
  const ersatzPid=lineup[size]||'';
  const ersatzP=ersatzPid?playerById(ersatzPid):null;
  const ersatzBlocked=ersatzPid?isPlayerBlockedForLineup(ersatzPid,match.teamId,match.id):false;
  let ersatzWarn='';
  if(ersatzPid){
    const otherLineup=state.matches.find(om=>om.id!==selectedMatchId&&spieltagOf(om)===spieltagOf(match)&&(state.lineups[om.id]||[]).slice(0,teamSize(teamById(om.teamId))).includes(ersatzPid));
    const otherErsatz=state.matches.find(om=>om.id!==selectedMatchId&&spieltagOf(om)===spieltagOf(match)&&(state.lineups[om.id]||[])[teamSize(teamById(om.teamId))]===ersatzPid);
    if(otherLineup){const ot=teamById(otherLineup.teamId);ersatzWarn=`⚠ Bereits Aufstellung: <strong>${ot?.name||'?'}</strong>`;}
    else if(otherErsatz){const ot=teamById(otherErsatz.teamId);ersatzWarn=`⚠ Bereits Ersatz: <strong>${ot?.name||'?'}</strong>`;}
  }
  slotsHtml+=`<div style="margin-top:12px;padding-top:10px;border-top:1px dashed var(--border)">
    <div style="font-size:10px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px">Ersatz</div>
    <div class="lineup-slot ${ersatzP?(ersatzBlocked?'blocked-slot':'ok'):''}" style="opacity:.85;border-style:dashed">
      <div class="lineup-pos" style="color:var(--muted)">E</div>
      <select ${dis} onchange="setSlot(${size},this.value)">${buildOpts(ersatzPid)}</select>
    </div>
    ${ersatzWarn?`<div class="warn-banner" style="margin-top:6px;font-size:11px">${ersatzWarn}</div>`:''}
  </div>`;

  document.getElementById('lineup-slots').innerHTML=slotsHtml;


}

async function sortLineupKap(){
  if(denyEdit())return;
  if(!selectedMatchId)return;
  const match=state.matches.find(m=>m.id===selectedMatchId);if(!match)return;
  const lineup=state.lineups[selectedMatchId]||[];
  const sorted=lineup.filter(Boolean).sort((a,b)=>playerRankInTeam(a,match.teamId)-playerRankInTeam(b,match.teamId));
  while(sorted.length<lineup.length)sorted.push(null);
  state.lineups[selectedMatchId]=sorted;
  document.getElementById('save-indicator').innerHTML='<span class="spinner"></span>Speichern...';
  try{
    await sbUpsert('lineups',[{match_id:selectedMatchId,slots:sorted}]);
    document.getElementById('save-indicator').textContent='✓ Gespeichert';
    setTimeout(()=>document.getElementById('save-indicator').textContent='',2000);
  }catch(e){console.error(e);}
  renderLineupSlots();
}

async function setSlot(pos,playerId){
  if(denyEdit())return;
  if(!selectedMatchId)return;
  if(!state.lineups[selectedMatchId])state.lineups[selectedMatchId]=[];
  state.lineups[selectedMatchId][pos]=playerId||null;
  document.getElementById('save-indicator').innerHTML='<span class="spinner"></span>Speichern...';
  try{
    await sbUpsert('lineups',[{match_id:selectedMatchId,slots:state.lineups[selectedMatchId]}]);
    document.getElementById('save-indicator').textContent='✓ Gespeichert';
    setTimeout(()=>document.getElementById('save-indicator').textContent='',2000);
  }catch(e){
    document.getElementById('save-indicator').textContent='Fehler beim Speichern';
    console.error(e);
  }
  renderLineupSlots();
  renderTeamContent();
}

// ── BLOCKING VIEW (read-only) ──
// ── SPERREN TABLE CELL ── says in words why a player is blocked (same code in admin.html and kapitaen.html)
const BLK_T={
  de:{stamm:'Stammkader',played:n=>`${n}× gespielt`,kader:t=>`⛔ Kader ${t}`,sm:(n,ts)=>`⛔ ${n}× in ${ts}`,warn:(n,ts)=>`⚠ ${n}× in ${ts}`,
      tKader:t=>`Stammkader-Regel: laut Meldeliste gehört der Spieler zu ${t} und darf nicht tiefer spielen`,tSm:(n,ts)=>`Stammmannschaft-Regel: ${n} Einsätze in ${ts} – hier gesperrt`,tWarn:(n,ts)=>`${n} Einsatz in ${ts} – beim nächsten Einsatz oben ist er hier gesperrt`,
      legStamm:'Mannschaft laut Meldeliste',legBlock:'gesperrt, mit Grund',legWarn:'beim nächsten Einsatz oben gesperrt',legPlayed:'Einsätze in dieser Mannschaft'},
  es:{stamm:'Stammkader',played:n=>`${n}× jugados`,kader:t=>`⛔ Kader ${t}`,sm:(n,ts)=>`⛔ ${n}× en ${ts}`,warn:(n,ts)=>`⚠ ${n}× en ${ts}`,
      tKader:t=>`Regla Stammkader: según la Meldeliste pertenece a ${t} y no puede jugar más abajo`,tSm:(n,ts)=>`Regla Stammmannschaft: ${n} partidos en ${ts} – bloqueado acá`,tWarn:(n,ts)=>`${n} partido en ${ts} – con el próximo arriba queda bloqueado acá`,
      legStamm:'equipo según la Meldeliste',legBlock:'bloqueado, con el motivo',legWarn:'bloqueado con el próximo partido arriba',legPlayed:'partidos en este equipo'},
  en:{stamm:'Stammkader',played:n=>`${n}× played`,kader:t=>`⛔ Kader ${t}`,sm:(n,ts)=>`⛔ ${n}× in ${ts}`,warn:(n,ts)=>`⚠ ${n}× in ${ts}`,
      tKader:t=>`Stammkader rule: per the Meldeliste the player belongs to ${t} and may not play lower`,tSm:(n,ts)=>`Stammmannschaft rule: ${n} matches in ${ts} – blocked here`,tWarn:(n,ts)=>`${n} match in ${ts} – one more up there blocks him here`,
      legStamm:'team per the Meldeliste',legBlock:'blocked, with the reason',legWarn:'blocked after the next match higher up',legPlayed:'matches in this team'}
};
function bT(k){return(BLK_T[lang]||BLK_T.de)[k];}
const BLK_PILL='display:inline-block;padding:3px 9px;border-radius:10px;font-size:11px;font-weight:600;white-space:nowrap';
const BLK_STYLE={stamm:'background:#1a2e26;color:#74c69d;box-shadow:inset 0 0 0 1.5px #74c69d',played:'background:#1a2e26;color:#74c69d',block:'background:#3a1b18;color:#ffb3aa',warn:'background:#33260f;color:#f7c48f'};
function blkShort(t){
  let n=(t?.name||'?').replace('Seniorinnen','SenF').replace('Senioren','Sen').replace('Herren','H').replace('Damen','D').trim();
  const siblings=(state.allTeams||state.teams).filter(x=>x.category===t?.category);
  if(t&&siblings.length>1&&teamNumber(t)===1&&!/\b(I|II|III|IV|V|VI|VII|VIII)$/.test(n))n+=' I';
  return n;
}
function blockCell(p,t,catTeams,status,skTeam){
  const counts=state.matchCounts[p.id]||{};
  const c=counts[t.id]||0;
  const higher=catTeams.filter(s=>teamNumber(s)<teamNumber(t));
  const supSum=higher.reduce((a,s)=>a+(counts[s.id]||0),0);
  const supTeams=higher.filter(s=>(counts[s.id]||0)>0).map(blkShort).join('+');
  const isSkBlocked=status.stammkaderBlocked.some(x=>x.id===t.id);
  const isSmBlocked=status.stammmannschaftBlocked.some(x=>x.id===t.id);
  const isSmWarned=status.stammmannschaftWarned.some(x=>x.id===t.id);
  // "Stammkader" only means something where there is a lower team to be blocked from → never on the last team
  const isSk=t.id===skTeam.id&&t.id!==catTeams[catTeams.length-1].id;
  let kind='',label='',title='';
  if(isSkBlocked&&isSmBlocked){kind='block';label=`${bT('kader')(blkShort(skTeam))} · ${supSum}×`;title=bT('tKader')(skTeam.name)+' · '+bT('tSm')(supSum,supTeams);}
  else if(isSmBlocked){kind='block';label=bT('sm')(supSum,supTeams);title=bT('tSm')(supSum,supTeams);}
  else if(isSkBlocked){kind='block';label=bT('kader')(blkShort(skTeam));title=bT('tKader')(skTeam.name);}
  else if(isSmWarned){kind='warn';label=bT('warn')(supSum,supTeams);title=bT('tWarn')(supSum,supTeams);}
  else if(isSk){kind='stamm';label=bT('stamm')+(c>0?` · ${c}×`:'');}
  else if(c>0){kind='played';label=bT('played')(c);}
  // own Stammkader team that is also on warning → show both
  const skPill=(kind==='warn'&&isSk)?`<span style="${BLK_PILL};${BLK_STYLE.stamm};margin-bottom:3px">${bT('stamm')}</span><br>`:'';
  const inner=kind?`${skPill}<span style="${BLK_PILL};${BLK_STYLE[kind]}">${label}</span>`

function renderBlocking(){
  const cats=[...new Set(scopeTeams().map(t=>t.category))].sort();
  const catSel=document.getElementById('block-cat-filter');
  const defaultCat=cats.includes('Herren')?'Herren':'';
  const curCat=catSel?.value||defaultCat;
  if(catSel){catSel.innerHTML=`<option value="">Alle Kategorien</option>`+cats.map(c=>`<option value="${c}" ${curCat===c?'selected':''}>${c}</option>`).join('');catSel.value=curCat;}
  const el=document.getElementById('blocking-content');
  const filterCat=catSel?.value||'';
  const catsToShow=filterCat?[filterCat]:cats;
  let html=`<div style="display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap">
    <div class="rule-box" style="flex:1;margin:0"><strong>Stammkader:</strong> ${tr('ruleBoxSKBody')}</div>
    <div class="rule-box warn" style="flex:1;margin:0"><strong>Stammmannschaft:</strong> ${tr('ruleBoxSMBody')}</div>
  </div>`;
  let anyEntry=false;
  for(const cat of catsToShow){
    const catTeams=scopeTeams().filter(t=>t.category===cat).sort((a,b)=>teamNumber(a)-teamNumber(b));
    if(!catTeams.length)continue;
    const groupSize=teamSize(catTeams[0]);
    // Sort by the rank in THIS category's Meldung (p.rank is only the rank of the first list the player was imported from)
    const catPlayers=state.players.filter(p=>p.teamIds.some(tid=>catTeams.find(t=>t.id===tid))).sort((a,b)=>playerRankInTeam(a.id,catTeams[0].id)-playerRankInTeam(b.id,catTeams[0].id));
    if(!catPlayers.length)continue;
    anyEntry=true;
    html+=`<div style="font-family:'Bebas Neue',sans-serif;font-size:20px;color:var(--court);letter-spacing:1px;margin:14px 0 8px">${cat}</div>`;
    html+=`<div class="card" style="padding:0;overflow:hidden;overflow-x:auto;margin-bottom:10px">`;
    html+=`<table style="width:100%;border-collapse:collapse;font-size:12px">
      <thead><tr style="border-bottom:1px solid #2e4a42">
        <th style="padding:8px 12px;text-align:left;font-weight:600;color:var(--muted);min-width:160px">${tr('colPlayer')}</th>
        <th style="padding:8px 8px;text-align:center;font-weight:600;color:var(--muted);font-size:10px">${tr('colLK')}</th>
        <th style="padding:8px 8px;text-align:center;font-weight:600;color:var(--muted);font-size:10px">${tr('colYear')}</th>
        ${catTeams.map(t=>`<th style="padding:8px 8px;text-align:center;font-weight:600;color:var(--court);font-size:11px;white-space:nowrap">${t.name}${t.is_4er?' <span style="font-size:9px;color:var(--warn)">(4er)</span>':''}</th>`).join('')}
      </tr></thead><tbody>`;
    for(let i=0;i<catPlayers.length;i++){
      const p=catPlayers[i];
      const status=getPlayerBlockStatus(p.id,cat);
      const counts=state.matchCounts[p.id]||{};
      const skTeam=getStammkaderTeam(p.id,cat)||catTeams[catTeams.length-1];
      const cells=catTeams.map(t=>blockCell(p,t,catTeams,status,skTeam)).join('');
      const rowBg=status.blocked.length>0?'background:#1e1e1e':'';
      html+=`<tr style="border-bottom:1px solid #2e4a4222;${rowBg}">
        <td style="padding:7px 12px;white-space:nowrap"><div style="font-weight:600;font-size:12px">${p.name}</div></td>
        <td style="padding:7px 8px;text-align:center"><span class="lk-badge" style="font-size:10px">${p.lkStr||'?'}</span></td>
        <td style="padding:7px 8px;text-align:center;font-size:11px;color:var(--muted)">${p.year||'—'}</td>
        ${cells}
      </tr>`;
    }
    html+=`</tbody></table>
      ${blockLegend()}</div>`;
  }
  if(!anyEntry)html+=`<div class="empty">${tr('noBlocked')}</div>`;
  el.innerHTML=html;
}

async function runAutoLineup(){
  if(denyEdit())return;
  const match=state.matches.find(m=>m.id===selectedMatchId);if(!match)return;
  const team=teamById(match.teamId);
  const size=teamSize(team);
  const avail=state.availability[selectedMatchId]||{};
  const available=[...state.players.filter(p=>
    p.teamIds.includes(match.teamId)&&
    avail[p.id]==='yes'&&
    !isPlayerBlockedForLineup(p.id,match.teamId,match.id)
  )].sort((a,b)=>playerRankInTeam(a.id,match.teamId)-playerRankInTeam(b.id,match.teamId));
  const slots=Array.from({length:size},(_,i)=>available[i]?.id||null);
  state.lineups[selectedMatchId]=slots;
  document.getElementById('save-indicator').innerHTML='<span class="spinner"></span>Speichern...';
  try{
    await sbUpsert('lineups',[{match_id:selectedMatchId,slots}]);
    document.getElementById('save-indicator').textContent='✓ Auto-Aufstellung gespeichert';
    setTimeout(()=>document.getElementById('save-indicator').textContent='',2500);
  }catch(e){
    document.getElementById('save-indicator').textContent='Fehler beim Speichern';
    console.error(e);
  }
  renderLineupSlots();
  renderTeamContent();
}

function _kapOvSortTeams(teams){
  const ts=[...teams];
  // Herren → Damen → Jugend
  const genderRank=c=>catGroup(c);
  if(_kapOvSort==='altersklasse'){
    return ts.sort((a,b)=>{
      const ga=genderRank(a.category),gb=genderRank(b.category);
      if(ga!==gb)return ga-gb;
      if(a.category!==b.category)return catCmp(a.category,b.category)||a.category.localeCompare(b.category);
      return teamNumber(a)-teamNumber(b);
    });
  }
  // 'number': sort by team number first, then by category
  return ts.sort((a,b)=>{
    const ga=genderRank(a.category),gb=genderRank(b.category);
    if(ga!==gb)return ga-gb;
    const na=teamNumber(a),nb=teamNumber(b);
    if(na!==nb)return na-nb;
    return a.category.localeCompare(b.category);
  });
}

function renderKapOverview(){

  const el=document.getElementById('kap-overview-content');
