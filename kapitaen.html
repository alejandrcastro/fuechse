<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kapitän – Füchse Berlin</title>
<link href="fonts/fonts.css?v=1" rel="stylesheet">
<link href="match.css?v=3" rel="stylesheet">
<link href="ui.css?v=1" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'DM Sans',sans-serif;background:var(--dark);color:var(--white);min-height:100vh}
::-webkit-scrollbar{width:6px}::-webkit-scrollbar-track{background:var(--dark)}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:3px}

/* HEADER */
#who-badge{font-size:11px;font-weight:600;padding:3px 10px;border-radius:20px;border:1px solid var(--court);color:var(--court);white-space:nowrap}
footer{text-align:center;padding:18px;font-size:11px;color:var(--muted);border-top:1px solid var(--border);margin-top:40px}
.tabs{padding:0 22px}
header{background:var(--bar);padding:14px 22px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border2);position:sticky;top:0;z-index:100;flex-wrap:wrap;gap:8px}
.logo{display:flex;align-items:center;gap:10px}
.logo h1{font-family:'Bebas Neue',sans-serif;font-size:20px;letter-spacing:2px}
.logo-img{width:36px;height:36px;object-fit:contain;flex-shrink:0}
.logo span{font-size:11px;color:var(--muted);letter-spacing:1px;text-transform:uppercase;display:block}
.header-right{display:flex;align-items:center;gap:8px}
.sync-badge{font-size:11px;font-weight:600;padding:3px 9px;border-radius:20px;transition:all .3s;white-space:nowrap}
.sync-ok{background:var(--ok-bg);border:1px solid var(--court)55;color:var(--court)}
.sync-err{background:var(--danger-deep);border:1px solid var(--danger)55;color:var(--danger)}
.sync-ing{background:var(--warn-bg);border:1px solid var(--warn)55;color:var(--warn)}
.lang-bar{display:flex;gap:4px}
.lang-btn{padding:3px 9px;font-size:11px;font-weight:600;border:1px solid var(--border2);border-radius:6px;cursor:pointer;background:transparent;color:var(--muted);font-family:'DM Sans',sans-serif;transition:all .15s}
.lang-btn:hover{color:var(--white)}
.lang-btn.active{background:var(--green);color:#fff;border-color:var(--green-light)}
.logout-btn{padding:4px 12px;font-size:11px;font-weight:600;border:1px solid var(--border2);border-radius:6px;cursor:pointer;background:transparent;color:var(--muted);font-family:'DM Sans',sans-serif}
.logout-btn:hover{color:var(--white);border-color:#555}

/* LAYOUT */
main{padding:22px;max-width:1080px;margin:0 auto;display:grid;grid-template-columns:240px 1fr;gap:18px;min-height:calc(100vh - 60px)}
@media(max-width:700px){main{grid-template-columns:1fr}}
/* mobile: team dropdown instead of the full list (desktop keeps the list) */
.team-select{display:none;width:100%;background:var(--bar);border:1px solid var(--border2);border-radius:10px;color:var(--white);padding:11px 12px;font:600 14px 'DM Sans',sans-serif}
@media(max-width:700px){.team-select{display:block}#team-list-sidebar,#sidebar-teams-title,#no-team-selected{display:none!important}.sidebar-card{padding:10px}}

/* SIDEBAR */
.sidebar{display:flex;flex-direction:column;gap:10px}

/* MAIN CONTENT */
.content{min-width:0}
.section-title{font-family:'Bebas Neue',sans-serif;font-size:26px;letter-spacing:2px;color:var(--court);margin-bottom:4px}
.section-sub{color:var(--muted);font-size:12px;margin-bottom:16px}

/* MATCH LIST */

/* AVAILABILITY PANEL */
.avail-panel{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:18px;margin-top:14px}
.av-yes{background:var(--court-bg);color:var(--court)}
.av-maybe{background:var(--warn-bg);color:var(--warn)}
.av-no{background:var(--danger-bg);color:var(--danger)}
.av-open{background:var(--border);color:var(--muted)}

/* LINEUP */
.empty{color:var(--muted);font-size:13px;text-align:center;padding:30px}
.spinner{display:inline-block;width:12px;height:12px;border:2px solid var(--court)44;border-top-color:var(--court);border-radius:50%;animation:spin .6s linear infinite;margin-right:6px;vertical-align:middle}
@keyframes spin{to{transform:rotate(360deg)}}
input,select{background:var(--bar);border:1px solid var(--border2);border-radius:7px;color:var(--white);padding:7px 10px;font-size:13px;font-family:'DM Sans',sans-serif;outline:none;width:100%}
input:focus,select:focus{border-color:var(--court)}
.rule-box{background:var(--row);border-left:3px solid var(--court);border-radius:0 8px 8px 0;padding:8px 12px;margin:9px 0;font-size:12px;color:var(--muted);line-height:1.6}
.rule-box.warn{border-left-color:var(--warn)}
.rule-box.danger{border-left-color:var(--danger)}
.rule-box strong{color:var(--white)}

/* Drag & drop lineup slots */
/* ── VERLEGT ── */
</style>
<script src="common.js?v=8"></script>
</head>
<body>

<!-- LOGIN -->
<div id="login-overlay">
  <div class="login-box">
    <div class="login-brand">
      <img class="login-logo" src="logo.svg" alt="Füchse Berlin">
      <div class="name">FÜCHSE BERLIN</div>
      <div class="sub" data-ct="captainApp">Kapitän-App</div>
    </div>
    <div class="login-field">
      <label data-ct="username">Benutzername</label>
      <input id="login-email" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" placeholder="Benutzername" data-ct-ph="username"
        onkeydown="if(event.key==='Enter')document.getElementById('login-pass').focus()">
    </div>
    <div class="login-field last">
      <label data-ct="password">Passwort</label>
      <input id="login-pass" type="password" autocomplete="current-password"
        onkeydown="if(event.key==='Enter')doLogin()">
    </div>
    <button class="login-btn" id="login-btn" onclick="doLogin()" data-ct="loginBtn">Einloggen</button>
    <div class="login-err" id="login-err"></div>
  </div>
</div>

<!-- HEADER -->
<header>
  <div class="logo">
    <img class="logo-img" src="logo.svg" alt="Füchse Berlin">
    <div>
      <h1>FÜCHSE BERLIN</h1>
      <span data-ct="captainApp">Kapitän-App</span>
    </div>
  </div>
  <div class="header-right">
    <div class="lang-bar">
      <button class="lang-btn active" onclick="setLang('de')">DE</button>
      <button class="lang-btn" onclick="setLang('es')">ES</button>
      <button class="lang-btn" onclick="setLang('en')">EN</button>
    </div>
    <span id="who-badge" style="display:none"></span>
    <span class="sync-badge sync-ing" id="sync-badge">⟳</span>
    <button class="logout-btn" id="btn-logout" onclick="doLogout()">Abmelden</button>
  </div>
</header>

<!-- TABS -->
<div class="tabs">
  <button id="tab-spiele" class="tab active" onclick="showKapTab('spiele')">Spiele &amp; Aufstellung</button>
  <button id="tab-overview" class="tab" onclick="showKapTab('overview')">Overview</button>
  <button id="tab-sperren" class="tab" onclick="showKapTab('sperren')">Sperren</button>
</div>

<!-- MAIN -->
<main>
  <!-- SIDEBAR: Team list -->
  <div class="sidebar" id="main-sidebar">
    <div class="sidebar-card">
      <div class="sidebar-title" id="sidebar-teams-title">Mannschaften</div>
      <select id="team-select" class="team-select" onchange="if(this.value)selectTeam(this.value)"></select>
      <div id="team-list-sidebar"><div class="empty small" id="sidebar-loading">Laden...</div></div>
    </div>
  </div>

  <!-- CONTENT WRAPPER (single grid cell, tabs switch between views inside) -->
  <div class="content" id="main-content-wrapper">
    <!-- CONTENT: Spiele & Aufstellung -->
    <div id="view-spiele">
    <div id="no-team-selected" class="empty pick" data-ct="pickTeamLeft">
      &#8592; Mannschaft auswählen
    </div>
    <div id="team-content" style="display:none">
      <div class="section-title" id="content-team-name"></div>
      <div class="section-sub" id="content-team-meta"></div>

      <!-- Match list -->
      <div id="match-list"></div>

      <!-- Availability + Lineup panel -->
      <div id="avail-panel" style="display:none" class="avail-panel">
        <div class="avail-panel-header">
          <div>
            <div class="avail-panel-title" id="panel-match-title"></div>
            <div class="panel-meta" id="panel-match-meta"></div>
          </div>
          <div class="btn-row">
            <button class="move-btn" id="move-btn" onclick="openMoveModal()" style="display:none">⇄ Verlegen</button>
            <button class="auto-btn" id="auto-btn" onclick="runAutoLineup()" data-ct="autoLineup">⚡ Auto-Aufstellung</button>
            <button class="auto-btn ghost" id="sort-btn" onclick="sortLineupKap()">↕ Sort</button>
            <button class="auto-btn share" id="share-btn" onclick="openShareModal()">📤 Teilen</button>
          </div>
        </div>

        <div id="move-info"></div>
        <!-- Lineup FIRST (above availability) -->
        <div class="lineup-section first">
          <div class="lineup-title" id="lineup-label">Aufstellung</div>
          <div id="lineup-warnings"></div>
          <div id="lineup-slots"></div>
          <div class="save-indicator" id="save-indicator"></div>
          <div id="count-wrap" class="count-wrap"></div>
        </div>

        <!-- Divider -->
        <div class="divider"></div>

        <!-- Availability table BELOW -->
        <div class="sidebar-title avail-head" data-ct="availability">Verfügbarkeit</div>
        <div id="avail-list"></div>
      </div>
    </div>
    </div>

    <!-- CONTENT: Overview -->
    <div id="view-overview" style="display:none">
      <div class="section-title" data-ct="ovTitle">Overview</div>
      <div class="fm-bar">
        <!-- Multi-select dropdown: shown in both Spiele and Spieler modes -->
        <div id="kap-ov-multicat" class="fm-wrap">
          <button id="kap-ov-multicat-btn" onclick="kapCatsMenu.toggle(event)" class="fm-btn">
            <span id="kap-ov-multicat-label" class="fm-lbl">Alle Altersklassen</span>
            <span class="fm-arrow">▼</span>
          </button>
        </div>
        <div id="kap-ov-teams-wrap" class="fm-wrap">
          <button id="kap-ov-teams-btn" onclick="kapTeamsMenu.toggle(event)" class="fm-btn">
            <span id="kap-ov-teams-label" class="fm-lbl">Alle Teams</span>
            <span class="fm-arrow">▼</span>
          </button>
        </div>
        <div id="kap-ov-sort-wrap" class="fm-wrap">
          <button id="kap-ov-sort-btn" onclick="kapSortMenu.toggle(event)" class="fm-btn">
            <span id="kap-ov-sort-label" class="fm-lbl">Nach Mannschaftsnummer</span>
            <span class="fm-arrow">▼</span>
          </button>
        </div>
        <div class="mode-btns">
          <button id="kap-ov-btn-matches" onclick="setKapOverviewMode('matches')" class="mode-btn on" data-ct="ovMatches">📋 Spiele</button>
          <button id="kap-ov-btn-players" onclick="setKapOverviewMode('players')" class="mode-btn" data-ct="ovPlayers">👥 Spieler</button>
        </div>
      </div>
      <div id="kap-overview-content" class="scroll-x"></div>
    </div>

    <!-- CONTENT: Sperren (read-only) -->
    <div id="view-sperren" style="display:none">
      <div class="section-title" id="sperren-title">Sperren</div>
      <div class="section-sub" id="sperren-sub">Übersicht der gesperrten Spieler nach Stammkader- und Stammmannschaftsregel</div>
      <div class="filter-row">
        <select id="block-cat-filter" class="filter-select" onchange="renderBlocking()"></select>
      </div>
      <div id="blocking-content"><div class="empty" id="blocking-loading">Laden...</div></div>
    </div>
  </div>
</main>

<script>
// ── ACTIVE SEASON ── switched in admin.html (header). Stored in Supabase → app_settings.
// Format: 'S2026' = Sommer 2026, 'W2026' = Winter 2026/27. The value below is only a fallback.
let ACTIVE_SEASON='W2026';
const _seasonReady=(async()=>{const v=await _readSetting('active_season');if(typeof v==='string'&&/^[SW]\d{4}$/.test(v))ACTIVE_SEASON=v;})();

let _sbClient=null;
let _session=null;

// ── AUTH ──
(function(){
  const s=document.createElement('script');
  // supabase-js 2.118.0 is in the repo (vendor/), so no new version can slip in by itself; integrity = SHA-384 of that file
  s.src='vendor/supabase-2.118.0.js';s.integrity='sha384-TcHRA3zBbn+Lexh5n+Oil4guNPOS3rjNDpGRAN46u/s/mB2IZ50ceC6TYDU2yvgK';
  s.onload=async function(){
    _sbClient=window.supabase.createClient(SB_URL,SB_KEY);
    const {data:{session}}=await _sbClient.auth.getSession();
    if(session){
      _session=session;
      _isSuper=await sbIsAdmin(session);
      document.getElementById('login-overlay').style.display='none';
      loadAll();
    }
    _sbClient.auth.onAuthStateChange((event,session)=>{
      _session=session;
      if(event==='SIGNED_OUT'){location.reload();}
    });
  };
  document.head.appendChild(s);
})();

// ── LOGIN RATE LIMITING ──
const _rl={attempts:0,lockedUntil:0};
function _rlCheck(errEl){
  const now=Date.now();
  if(_rl.lockedUntil>now){
    const secs=Math.ceil((_rl.lockedUntil-now)/1000);
    errEl.textContent=ct('tooManyWait')(secs);
    return false;
  }
  return true;
}
function _rlFail(errEl){
  _rl.attempts++;
  const timeout=_rl.attempts>=5?5*60*1000*(_rl.attempts-4):0;
  if(timeout>0){
    _rl.lockedUntil=Date.now()+timeout;
    const mins=Math.ceil(timeout/60000);
    errEl.textContent=ct('tooManyLocked')(mins);
  } else {
    errEl.textContent=ct('wrongLogin');
  }
  setTimeout(()=>{if(Date.now()>=_rl.lockedUntil)errEl.textContent='';},3500);
}
function _rlSuccess(){_rl.attempts=0;_rl.lockedUntil=0;}

// ── USERNAMES ── Supabase Auth needs an email, so a username "herren" logs in as "herren@login.fuechse-berlin-reinickendorf.de".
// Create users in Supabase → Authentication → Add user, with that address and "Auto Confirm User". No mail is ever sent.
const LOGIN_DOMAIN='login.fuechse-berlin-reinickendorf.de';
function usernameToEmail(u){u=(u||'').trim().toLowerCase();if(!u.includes('@'))u=u.replace(/\s+/g,''); // "Herren 30 II" → herren30ii
  return u.includes('@')?u:`${u}@${LOGIN_DOMAIN}`;}
function emailToUsername(e){e=(e||'').toLowerCase();return e.endsWith('@'+LOGIN_DOMAIN)?e.slice(0,-(LOGIN_DOMAIN.length+1)):e;}
// ── EDIT RIGHTS ── team logins (username = team name without spaces, e.g. "herrenii" = Herren II)
// may only edit their own team's Aufstellung. Superusers may edit everything; the database says who they are
// (common.js sbIsAdmin), so no login names are in the code. Visual check only — Supabase enforces the same rule.
let _isSuper=false;
function currentUsername(){return emailToUsername(_session?.user?.email);}
function teamLogin(team){return (team?.name||'').toLowerCase().replace(/\s+/g,'');}
function canEditTeam(teamId){return _isSuper||teamLogin(teamById(teamId))===currentUsername();}
// Jugend team logins ("u18m", "u12iii", …) only see the Jugend block (teams still loaded for same-day conflicts)
function isJugendLogin(){return /^u\d+/.test(currentUsername());}
function renderWhoBadge(){
  const el=document.getElementById('who-badge');if(!el)return;
  const u=currentUsername();
  const own=(state.allTeams||[]).find(t=>teamLogin(t)===u);
  const label=_isSuper?u.charAt(0).toUpperCase()+u.slice(1):(own?.name||u); // superuser: "admin" → "Admin"
  if(!label){el.style.display='none';return;}
  el.textContent=`👤 ${label}`;
  el.title=_isSuper?tr('whoAll'):tr('whoOwn');
  el.style.display='';
}
// Sperren + Overview scope: team logins only see their own block (Herren / Damen / Jugend); superusers see all
function scopeGroup(){
  const u=currentUsername();
  if(_isSuper)return null;
  const own=(state.allTeams||[]).find(t=>teamLogin(t)===u);
  if(own)return catGroup(own.category);
  if(/^u\d+/.test(u))return 2;
  if(u.startsWith('damen'))return 1;
  if(u.startsWith('herren'))return 0;
  return null;
}
function scopeTeams(){const g=scopeGroup();return g==null?state.teams:state.teams.filter(t=>catGroup(t.category)===g);}
function canEditMatch(matchId){const m=state.matches.find(x=>x.id===matchId);return !!m&&canEditTeam(m.teamId);}
function isCountedMatch(id){return !!state.matches.find(x=>x.id===id)?.counted;}
function denyEdit(){if(canEditMatch(selectedMatchId)&&!isCountedMatch(selectedMatchId))return false;setSync('err',tr(isCountedMatch(selectedMatchId)?'countedLocked':'readOnly'));setTimeout(()=>setSync('ok','● sync'),2500);renderLineupSlots();return true;}
// ── SPIEL BESTÄTIGEN (Zähler für Sperren) ── same logic as admin.html; captains only for their own team
// Extra player who only played Doppel
async function kapConfirmMatch(){
  const match=state.matches.find(m=>m.id===selectedMatchId);if(!match)return;
  if(!canEditTeam(match.teamId))return;
  const size=teamSize(teamById(match.teamId));
  const players=mvPlayedSelection();
  if(!players.length||players.length>size*2)return;
  const includeErsatz=players.includes((state.lineups[match.id]||[])[size]);
  const btn=document.getElementById('mx-confirm-btn');if(btn){btn.disabled=true;btn.textContent='...';}
  setSync('ing','⟳');
  try{
    const res=await countMatchDB(match,players,includeErsatz);
    if(res==='already'){alert(tr('alreadyCounted'));await loadAll();if(state.matches.find(m=>m.id===selectedMatchId))selectMatch(selectedMatchId);return;}
    setSync('ok','● sync');
    renderTeamContent();renderAvailPanel();renderBlocking();
    const st=document.getElementById('mx-confirm-status');if(st)st.textContent=tr('countDone')(players.length);
  }catch(e){console.error(e);setSync('err','✕ '+tr('moveErrSave'));if(btn){btn.disabled=false;btn.textContent=ct('countBtn');}}
}
async function kapUndoMatchCount(){
  const match=state.matches.find(m=>m.id===selectedMatchId);if(!match||!match.counted)return;
  if(!canEditTeam(match.teamId))return;
  if(!confirm(tr('undoConfirm')))return;
  setSync('ing','⟳');
  try{
    const res=await undoCountDB(match);
    if(res==='already'){alert(tr('alreadyUndone'));await loadAll();if(state.matches.find(m=>m.id===selectedMatchId))selectMatch(selectedMatchId);return;}
    setSync('ok','● sync');
    renderTeamContent();renderAvailPanel();renderBlocking();
  }catch(e){console.error(e);setSync('err','✕ '+tr('moveErrSave'));}
}
// ── SPIEL VERLEGEN + TEILEN ── the dialogs are in common.js (the same in admin); captains only for their own team
function openMoveModal(){const m=state.matches.find(x=>x.id===selectedMatchId);if(m&&canEditTeam(m.teamId))mvOpenMove(selectedMatchId);}
function openShareModal(){mvOpenShare(selectedMatchId);}
async function onMatchMoved(newId){selectedMatchId=newId;await loadAll();selectMatch(newId);}
async function doLogin(){
  const email=usernameToEmail(document.getElementById('login-email').value);
  const pass=document.getElementById('login-pass').value;
  const err=document.getElementById('login-err');
  const btn=document.getElementById('login-btn');
  if(!_rlCheck(err))return;
  err.textContent='';btn.textContent='...';btn.disabled=true;
  const {data,error}=await _sbClient.auth.signInWithPassword({email,password:pass});
  btn.textContent=ct('loginBtn');btn.disabled=false;
  if(error){
    _rlFail(err);
    document.getElementById('login-pass').value='';
  } else {
    _rlSuccess();
    _session=data.session;
    _isSuper=await sbIsAdmin(data.session);
    document.getElementById('login-overlay').style.display='none';
    loadAll();
  }
}

async function doLogout(){
  await _sbClient.auth.signOut();
}

// ── API ──
function getHDR(){
  const token=_session?.access_token||SB_KEY;
  return{'apikey':SB_KEY,'Authorization':'Bearer '+token,'Content-Type':'application/json'};
}
async function sbGet(t,p=''){
  const r=await fetch(`${SB_URL}/rest/v1/${t}?${p}`,{headers:{...getHDR(),'Prefer':''}});
  if(!r.ok)throw new Error(await r.text());
  return r.json();
}
async function sbUpsert(t,d){
  const r=await fetch(`${SB_URL}/rest/v1/${t}`,{method:'POST',headers:{...getHDR(),'Prefer':'resolution=merge-duplicates'},body:JSON.stringify(Array.isArray(d)?d:[d])});
  if(!r.ok)throw new Error(await r.text());
}

// ── HELPERS ── TVBB rules, Supabase helpers and the Sperren table cell are in common.js (shared by all pages).
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,5)}
function initials(n){return n.split(' ').map(w=>w[0]).join('').toUpperCase().slice(0,2)}
function fmtDate(d){if(!d)return'';const[y,m,day]=d.split('-');return`${day}.${m}.${y}`}

function setSync(s,m){const b=document.getElementById('sync-badge');b.className='sync-badge sync-'+s;b.textContent=m;}

// ── i18n ──
const T={
  de:{
    tabSpiele:'Spiele & Aufstellung',tabOverview:'Overview',tabSperren:'Sperren',
    logout:'Abmelden',teamsTitle:'Mannschaften',loading:'Laden...',
    countBtn:'Spiel bestätigen & Zähler +1',alreadyCounted:'Dieses Spiel wurde inzwischen schon gezählt. Die Seite wird aktualisiert.',alreadyUndone:'Dieses Spiel ist nicht mehr gezählt. Die Seite wird aktualisiert.',countedShort:'Gezählt',countedLabel:e=>`Bereits gezählt${e?' (inkl. Ersatz)':''}`,undoBtn:'Rückgängig',
    whoPlayed:'Wer hat gespielt?',tooManyPlayed:n=>`Maximal ${n} Spieler.`,morePlayed:n=>`Mehr als ${n}: nur wenn jemand nur Doppel gespielt hat. Wurde ein Spieler ersetzt, ihn abwählen.`,addDoublesPlayer:'Spieler hinzufügen (nur Doppel)',countDone:n=>`✓ ${n} Spieler +1`,undoConfirm:'Zähler für dieses Spiel zurücksetzen?',
    countedLocked:'Spiel gezählt – Aufstellung gesperrt. Zum Ändern zuerst „Rückgängig“.',countAfterMatch:'Bestätigen ist ab dem Spieltag möglich.',countNeedLineup:'Zum Bestätigen muss die Aufstellung vollständig sein.',

// ── STATE ──
let state={teams:[],players:[],matches:[],availability:{},lineups:{},matchCounts:{},rankByTeam:{},mainTeam:{}};
let selectedTeamId=null;
let selectedMatchId=null;

// ── LOAD ──
async function loadAll(){
  setSync('ing','⟳');
  await _seasonReady;
  try{
    // Active season only (R1) and only the columns that are used (R2): teams + players first, then what belongs to them
    const[teams,players]=await Promise.all([
      sbGet('teams',`season_id=eq.${ACTIVE_SEASON}&order=category,team_number`),
      sbGetAll('players',`season_id=eq.${ACTIVE_SEASON}&order=lk,id`)
    ]);
    const _tids=teams.map(t=>t.id);
    const[matches,countRows,ptAll]=await Promise.all([
      sbGetIn('matches','team_id',_tids,'order=date,id'),
      sbGetIn('player_match_counts','team_id',_tids,'select=player_id,team_id,matches_played&order=player_id,team_id'),
      sbGetIn('player_teams','team_id',_tids,'select=player_id,team_id,rank,is_mainteam&order=player_id,team_id')
    ]);
    const _mids=matches.map(m=>m.id);
    const[avRows,lineupRows]=await Promise.all([
      sbGetIn('availability','match_id',_mids,'select=match_id,player_id,status&order=match_id,player_id'),
      sbGetIn('lineups','match_id',_mids,'select=match_id,slots&order=match_id')
    ]);
    state.allTeams=teams.map(t=>({id:t.id,name:t.name,liga:t.liga,season:t.season,is_4er:t.is_4er||false,category:t.category||'Herren',teamNumber:t.team_number||1,gender:t.gender||catGender(t.category)}));
    const _activeTeamIds=new Set(state.allTeams.map(t=>t.id));
    // ── ACCESS ── everyone SEES all teams (Jugend logins: only Jugend); editing only for the own team, see canEditTeam()
    state.teams=isJugendLogin()?state.allTeams.filter(t=>catGroup(t.category)===2):state.allTeams;
    renderWhoBadge();
    state.players=players.map(p=>({id:p.id,name:p.name,idnr:p.idnr,lk:p.lk,lkStr:p.lk_str,year:p.year,teamIds:[],gender:p.gender||'M',rank:p.rank}));
    // Verlegt: the original stays as an archived card (state.movedMatches); everything else (conflicts,
    // overview, Sperren) only uses the active matches in state.matches
    const _seasonMatches=matches.filter(m=>_activeTeamIds.has(m.team_id)).map(m=>({id:m.id,teamId:m.team_id,opponent:m.opponent,date:m.date,time:m.time,home:m.home,venue:m.venue,
      status:m.status||null,movedTo:m.moved_to||null,movedFrom:m.moved_from||null,moveNote:m.move_note||'',movedAt:m.moved_at||null,movedBy:m.moved_by||'',
      spieltag:m.spieltag||null,counted:m.counted||false,ersatzCounted:m.ersatz_counted||false,countedPlayers:Array.isArray(m.counted_players)?m.counted_players:null}));
    state.matches=_seasonMatches.filter(m=>m.status!=='verlegt');
    state.movedMatches=_seasonMatches.filter(m=>m.status==='verlegt');
    state.availability={};
    for(const r of avRows){if(!AVAIL_STATES.includes(r.status))continue;if(!state.availability[r.match_id])state.availability[r.match_id]={};state.availability[r.match_id][r.player_id]=r.status;}
    state.lineups={};
    for(const r of lineupRows)state.lineups[r.match_id]=r.slots;
    state.matchCounts={};
    for(const r of countRows){if(!state.matchCounts[r.player_id])state.matchCounts[r.player_id]={};state.matchCounts[r.player_id][r.team_id]=r.matches_played;}
    const ptRows=ptAll;
    state.rankByTeam={};
    state.mainTeam={};
    for(const r of ptRows){
      if(!_activeTeamIds.has(r.team_id))continue; // other seasons stay archived
      const p=state.players.find(x=>x.id===r.player_id);
      if(p&&!p.teamIds.includes(r.team_id))p.teamIds.push(r.team_id);
      if(r.rank!=null){if(!state.rankByTeam[r.player_id])state.rankByTeam[r.player_id]={};state.rankByTeam[r.player_id][r.team_id]=r.rank;}
      if(r.is_mainteam){if(!state.mainTeam[r.player_id])state.mainTeam[r.player_id]={};state.mainTeam[r.player_id][r.team_id]=true;}
    }
    setSync('ok','● sync');
    buildMultiCatList();
    _kapOvSelectedCats=null;
    renderTeamSidebar();
    if(selectedTeamId)renderTeamContent();
    if(selectedMatchId)renderAvailPanel();
  }catch(e){setSync('err','✕ offline');console.error(e);}
}

// ── SIDEBAR ──
function renderTeamSidebar(){
  const byCat={};
  for(const t of state.teams){
    const c=t.category||'Herren';
    if(!byCat[c])byCat[c]=[];
    byCat[c].push(t);
  }
  let html='';
  for(const[cat,teams] of Object.entries(byCat).sort((a,b)=>{
    const cc=catCmp(a[0],b[0]);if(cc)return cc;
    return a[0].localeCompare(b[0]);
  })){
    html+=`<div class="sidebar-title cat-head">${esc(cat)}</div>`;
    for(const t of teams.sort((a,b)=>teamNumber(a)-teamNumber(b))){
      const matches=state.matches.filter(m=>m.teamId===t.id);
      const active=selectedTeamId===t.id?'active':'';
      html+=`<button class="team-btn ${active}" onclick="selectTeam('${t.id}')">
        <span class="team-dot"></span>
        <span class="name">${esc(t.name)}</span>
        <span class="count">${matches.length}</span>
      </button>`;
    }
  }
  document.getElementById('team-list-sidebar').innerHTML=html||'<div class="empty small">Keine Teams</div>';
  // mobile dropdown with the same teams, grouped by category
  const sel=document.getElementById('team-select');
  if(sel){
    const cats=Object.entries(byCat).sort((a,b)=>catCmp(a[0],b[0])||a[0].localeCompare(b[0]));
    sel.innerHTML=`<option value="">${tr('pickTeam')}</option>`+cats.map(([cat,teams])=>`<optgroup label="${esc(cat)}">${
      teams.slice().sort((a,b)=>teamNumber(a)-teamNumber(b)).map(t=>`<option value="${t.id}"${selectedTeamId===t.id?' selected':''}>${esc(t.name)}${t.liga?' · '+esc(t.liga):''}</option>`).join('')}</optgroup>`).join('');
  }
}

// ── TEAM SELECTION ──
function selectTeam(teamId){
  selectedTeamId=teamId;
  selectedMatchId=null;
  document.getElementById('no-team-selected').style.display='none';
  document.getElementById('team-content').style.display='block';
  document.getElementById('avail-panel').style.display='none';
  renderTeamSidebar();
  renderTeamContent();
}

function renderTeamContent(){
  const team=teamById(selectedTeamId);if(!team)return;
  document.getElementById('content-team-name').textContent=team.name;
  document.getElementById('content-team-meta').textContent=`${team.liga} · ${seasonKindLabel(team.season)} · ${ct('nPlayers')(teamSize(team))}`;
  const matches=[...state.matches,...(state.movedMatches||[])].filter(m=>m.teamId===selectedTeamId).sort((a,b)=>a.date.localeCompare(b.date)||(a.time||'').localeCompare(b.time||''));
  if(!matches.length){
    document.getElementById('match-list').innerHTML='<div class="empty">Keine Spiele für diese Mannschaft</div>';
    return;
  }
  document.getElementById('match-list').innerHTML=mvMatchCardsHtml(team,matches,{selected:selectedMatchId,open:'selectMatch'});
}

// ── MATCH SELECTION ──
function selectMatch(matchId){
  selectedMatchId=matchId;
  renderTeamContent(); // re-render to highlight active match
  renderAvailPanel();
  document.getElementById('avail-panel').style.display='block';
  document.getElementById('avail-panel').scrollIntoView({behavior:'smooth',block:'nearest'});
}

// ── WOCHENENDE: other matches on the same Sat/Sun (different day) ──
// Only a hint, never a block: playing Sat + Sun in different teams is allowed.
// ── AVAILABILITY PANEL ──
function renderAvailPanel(){
  const match=state.matches.find(m=>m.id===selectedMatchId);if(!match)return;
  const team=teamById(match.teamId);
  document.getElementById('panel-match-title').textContent=`${team?.name||'?'} vs ${match.opponent}`;
  document.getElementById('panel-match-meta').textContent=`${fmtDate(match.date)} · ${match.time} · ${homeAwayLabel(match.home)}`;
  document.getElementById('lineup-label').textContent=lineupTitle(team);
  // Verlegen: only admins/super users or the team's own login
  const mb=document.getElementById('move-btn');
  if(mb){mb.style.display=canEditTeam(match.teamId)&&!match.counted?'':'none';mb.textContent='⇄ '+tr('moveBtn');}
  const shb=document.getElementById('share-btn');if(shb)shb.textContent='📤 '+tr('shareBtn');
  const mi=document.getElementById('move-info');if(mi)mi.innerHTML=mvMoveInfoHtml(match);

  document.getElementById('avail-list').innerHTML=mvAvailHtml(match);
  renderLineupSlots();
}

// ── DRAG & DROP LINEUP ──
let _dragSrcIndex=null;
function onSlotDragStart(e,index){
  _dragSrcIndex=index;
  e.currentTarget.classList.add('dragging');
  e.dataTransfer.effectAllowed='move';
  e.dataTransfer.setData('text/plain',index);
}
function onSlotDragOver(e){
  e.preventDefault();
  e.dataTransfer.dropEffect='move';
  e.currentTarget.classList.add('drag-over');
}
function onSlotDragLeave(e){
  e.currentTarget.classList.remove('drag-over');
}
function onSlotDragEnd(e){
  e.currentTarget.classList.remove('dragging');
  document.querySelectorAll('.lineup-slot').forEach(s=>s.classList.remove('drag-over'));
  _dragSrcIndex=null;
}
async function onSlotDrop(e,destIndex){
  if(denyEdit())return;
  e.preventDefault();
  e.currentTarget.classList.remove('drag-over');
  if(_dragSrcIndex===null||_dragSrcIndex===destIndex)return;
  const lineup=state.lineups[selectedMatchId]||[];
  const match=state.matches.find(m=>m.id===selectedMatchId);if(!match)return;
  const size=teamSize(teamById(match.teamId));
  // Swap the two slots
  const newLineup=[...lineup];
  while(newLineup.length<=Math.max(_dragSrcIndex,destIndex))newLineup.push(null);
  [newLineup[_dragSrcIndex],newLineup[destIndex]]=[newLineup[destIndex],newLineup[_dragSrcIndex]];
  state.lineups[selectedMatchId]=newLineup;
  document.getElementById('save-indicator').innerHTML='<span class="spinner"></span>'+ct('saving');
  try{
    await sbUpsert('lineups',[{match_id:selectedMatchId,slots:newLineup}]);
    document.getElementById('save-indicator').textContent=ct('saved');
    setTimeout(()=>document.getElementById('save-indicator').textContent='',2000);
  }catch(e){console.error(e);}
  renderLineupSlots();
}

function renderLineupSlots(){
  const match=state.matches.find(m=>m.id===selectedMatchId);if(!match)return;
  const canEdit=canEditTeam(match.teamId);
  const ro=!canEdit||!!match.counted; // read-only for other teams, and locked once counted
  ['auto-btn','sort-btn'].forEach(id=>{const b=document.getElementById(id);if(b)b.style.display=ro?'none':'';});
  // warnings, slots and "Wer hat gespielt?" come from common.js (MATCH VIEW), the same as in admin
  document.getElementById('lineup-warnings').innerHTML=mvWarningsHtml(match);
  document.getElementById('lineup-slots').innerHTML=mvSlotsHtml(match,{ro,lockMsg:tr(canEdit?'countedLocked':'readOnly'),set:'setSlot',drag:'onSlot'});
  const cw=document.getElementById('count-wrap');
  if(cw){cw.innerHTML=mvCountHtml(match,{canEdit,confirm:'kapConfirmMatch',undo:'kapUndoMatchCount'});mvUpdatePlayedCount();}
}

async function sortLineupKap(){
  if(denyEdit())return;
  if(!selectedMatchId)return;
  const match=state.matches.find(m=>m.id===selectedMatchId);if(!match)return;
  const lineup=state.lineups[selectedMatchId]||[];
  const sorted=lineup.filter(Boolean).sort((a,b)=>playerRankInTeam(a,match.teamId)-playerRankInTeam(b,match.teamId));
  while(sorted.length<lineup.length)sorted.push(null);
  state.lineups[selectedMatchId]=sorted;
  document.getElementById('save-indicator').innerHTML='<span class="spinner"></span>'+ct('saving');
  try{
    await sbUpsert('lineups',[{match_id:selectedMatchId,slots:sorted}]);
    document.getElementById('save-indicator').textContent=ct('saved');
    setTimeout(()=>document.getElementById('save-indicator').textContent='',2000);
  }catch(e){console.error(e);}
  renderLineupSlots();
}

async function setSlot(pos,playerId){
  if(denyEdit())return;
  if(!selectedMatchId)return;
  if(!state.lineups[selectedMatchId])state.lineups[selectedMatchId]=[];
  state.lineups[selectedMatchId][pos]=playerId||null;
  document.getElementById('save-indicator').innerHTML='<span class="spinner"></span>'+ct('saving');
  try{
    await sbUpsert('lineups',[{match_id:selectedMatchId,slots:state.lineups[selectedMatchId]}]);
    document.getElementById('save-indicator').textContent=ct('saved');
    setTimeout(()=>document.getElementById('save-indicator').textContent='',2000);
  }catch(e){
    document.getElementById('save-indicator').textContent=ct('saveErr');
    console.error(e);
  }
  renderLineupSlots();
  renderTeamContent();
}

// ── TAB SWITCHING ──
function showKapTab(tab){
  document.getElementById('view-spiele').style.display=tab==='spiele'?'block':'none';
  document.getElementById('view-sperren').style.display=tab==='sperren'?'block':'none';
  document.getElementById('view-overview').style.display=tab==='overview'?'block':'none';
  ['spiele','sperren','overview'].forEach(t=>{
    const btn=document.getElementById('tab-'+t);
    if(btn)btn.classList.toggle('active',tab===t);
  });
  const sidebar=document.getElementById('main-sidebar');
  const wrapper=document.getElementById('main-content-wrapper');
  if(tab==='sperren'||tab==='overview'){
    sidebar.style.display='none';
    wrapper.style.gridColumn='1/-1';
    if(tab==='sperren')renderBlocking();
    if(tab==='overview')setKapOverviewMode(_kapOvMode);
  } else {
    sidebar.style.display='';
    wrapper.style.gridColumn='';
  }
}

// ── BLOCKING VIEW (read-only) ──

function renderBlocking(){renderBlockingView(scopeTeams());} // common.js, the same as in admin

async function runAutoLineup(){
  if(denyEdit())return;
  const match=state.matches.find(m=>m.id===selectedMatchId);if(!match)return;
  const team=teamById(match.teamId);
  const size=teamSize(team);
  const avail=state.availability[selectedMatchId]||{};
  const available=[...state.players.filter(p=>
    p.teamIds.includes(match.teamId)&&
    avail[p.id]==='yes'&&
    !isPlayerBlockedForLineup(p.id,match.teamId,match.id)
  )].sort((a,b)=>playerRankInTeam(a.id,match.teamId)-playerRankInTeam(b.id,match.teamId));
  const slots=Array.from({length:size},(_,i)=>available[i]?.id||null);
  state.lineups[selectedMatchId]=slots;
  document.getElementById('save-indicator').innerHTML='<span class="spinner"></span>'+ct('saving');
  try{
    await sbUpsert('lineups',[{match_id:selectedMatchId,slots}]);
    document.getElementById('save-indicator').textContent='✓ Auto-Aufstellung gespeichert';
    setTimeout(()=>document.getElementById('save-indicator').textContent='',2500);
  }catch(e){
    document.getElementById('save-indicator').textContent=ct('saveErr');
    console.error(e);
  }
  renderLineupSlots();
  renderTeamContent();
}

// ── KAPITÄN OVERVIEW ──
let _kapOvMode='matches';
let _kapOvSelectedCats=null;
let _kapOvSort='number'; // 'number' or 'altersklasse'
let _kapOvSelectedTeams=null; // null = all teams

function _buildSortPanelContent(panel){
  sortList(panel,{keys:['number','altersklasse'],name:'_kapovsort',current:_kapOvSort,labelId:'kap-ov-sort-label',pick:k=>{_kapOvSort=k;renderKapOverview();}});
}
// the Overview menus (common.js FILTER MENUS)
const kapSortMenu=dropMenu({btn:'kap-ov-sort-btn',wrap:'kap-ov-sort-wrap',nowrap:true,build:_buildSortPanelContent});
const kapTeamsMenu=dropMenu({btn:'kap-ov-teams-btn',wrap:'kap-ov-teams-wrap',width:'180px',build:p=>_buildTeamsPanelContent(p)});
const kapCatsMenu=dropMenu({btn:'kap-ov-multicat-btn',wrap:'kap-ov-multicat',width:'160px',build:p=>_buildPanelContent(p)});

function _buildTeamsPanelContent(panel){
  const teams=(!_kapOvSelectedCats||_kapOvSelectedCats.length===0)?scopeTeams():scopeTeams().filter(t=>_kapOvSelectedCats.includes(t.category));
  ovTeamsPanel(panel,{teams:ovSortTeams(teams,_kapOvSort),selected:()=>_kapOvSelectedTeams,set:v=>{_kapOvSelectedTeams=v;},allId:'_kap_teams_all',
    changed:()=>{_updateTeamsLabel();_buildTeamsPanelContent(panel);renderKapOverview();}});
}

function _updateTeamsLabel(){
  const lbl=document.getElementById('kap-ov-teams-label');
  if(lbl)lbl.textContent=teamFilterLabel(_kapOvSelectedTeams);
}

function _buildPanelContent(panel){
  catMenuList(panel,{cats:[...new Set(scopeTeams().map(t=>t.category))].sort(),allId:'_mc_all',selected:()=>_kapOvSelectedCats,set:v=>{_kapOvSelectedCats=v;},
    changed:()=>{_updateMultiCatLabel();_buildPanelContent(panel);renderKapOverview();}});
}

function _updateMultiCatLabel(){
  const lbl=document.getElementById('kap-ov-multicat-label');
  if(lbl)lbl.textContent=catFilterLabel(_kapOvSelectedCats);
}

function buildMultiCatList(){
  _kapOvSelectedCats=null;
  kapCatsMenu.drop();
  _updateMultiCatLabel();
}

function setKapOverviewMode(mode){
  _kapOvMode=mode;
  const bm=document.getElementById('kap-ov-btn-matches');
  const bp=document.getElementById('kap-ov-btn-players');
  if(bm)bm.classList.toggle('on',mode==='matches');
  if(bp)bp.classList.toggle('on',mode==='players');
  renderKapOverview();
}

function renderKapOverview(){
  if(_kapOvMode==='matches')renderKapOverviewMatches(_kapOvSelectedCats);
  else document.getElementById('kap-overview-content').innerHTML=ovPlayersHtml(_kapOvTeams(_kapOvSelectedCats));
}

function goToMatchKap(matchId){
  const m=state.matches.find(x=>x.id===matchId);if(!m)return;
  showKapTab('spiele');
  selectTeam(m.teamId);
  selectMatch(matchId);
  document.getElementById('avail-panel').scrollIntoView({behavior:'smooth',block:'start'});
}

// teams shown in the Overview: own scope, categories, team filter and order
function _kapOvTeams(selectedCats){
  let teams=ovSortTeams((!selectedCats||selectedCats.length===0)?scopeTeams():scopeTeams().filter(t=>selectedCats.includes(t.category)),_kapOvSort);
  if(_kapOvSelectedTeams&&_kapOvSelectedTeams.length>0)teams=teams.filter(t=>_kapOvSelectedTeams.includes(t.id));
  return teams;
}
// the tables come from common.js (OVERVIEW), the same as in admin
function renderKapOverviewMatches(selectedCats){
  document.getElementById('kap-overview-content').innerHTML=ovMatchesHtml(_kapOvTeams(selectedCats),{open:'goToMatchKap'});
}
