<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Füchse Berlin – Umfrage</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --red:#c0392b;--green:#2d6a4f;--green-light:#40916c;
  --white:#f0f7f2;--dark:#1e2d24;--muted:#7a9e88;
  --line:#2e4a38;--warn:#f4a261;--court:#52b788;--card:#243330;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'DM Sans',sans-serif;background:var(--dark);color:var(--white);min-height:100vh}
header{background:linear-gradient(160deg,#1b2d23 0%,#2d4a38 60%,#1e2d24 100%);padding:20px 24px 18px;border-bottom:3px solid var(--red);display:flex;align-items:center;gap:16px}
.logo-img{width:54px;height:54px;object-fit:contain;flex-shrink:0}
.header-text h1{font-family:'Bebas Neue',sans-serif;font-size:26px;letter-spacing:2px}
.header-text p{font-size:11px;color:var(--muted);letter-spacing:1px;text-transform:uppercase;margin-top:2px}
.lang-bar{display:flex;gap:5px;margin-left:auto}
.lang-btn{padding:4px 10px;font-size:11px;font-weight:600;border:1px solid var(--line);border-radius:6px;cursor:pointer;background:transparent;color:var(--muted);font-family:inherit;transition:all .15s}
.lang-btn.active{background:var(--green-light);color:#fff;border-color:var(--green-light)}
main{padding:20px 16px;max-width:480px;margin:0 auto}
.step-label{font-size:11px;font-weight:600;color:var(--court);text-transform:uppercase;letter-spacing:1px;margin-bottom:6px}
.step-title{font-family:'Bebas Neue',sans-serif;font-size:28px;letter-spacing:1px;margin-bottom:4px}
.step-sub{font-size:13px;color:var(--muted);margin-bottom:18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin-bottom:12px}
.q{font-size:13px;font-weight:600;margin-bottom:10px}
.q .opt-l{color:var(--muted);font-weight:400}
.hint{font-size:11px;color:var(--muted);margin-top:-6px;margin-bottom:10px}
input,textarea{background:#1b2d24;border:1px solid var(--line);border-radius:8px;color:var(--white);padding:10px 14px;font-family:inherit;font-size:14px;outline:none;width:100%;transition:border-color .2s}
input:focus,textarea:focus{border-color:var(--court)}
input::placeholder,textarea::placeholder{color:var(--muted)}
.ac-wrap{position:relative}
.ac-list{position:absolute;top:100%;left:0;right:0;background:#243330;border:1px solid #3a5a48;border-radius:10px;z-index:50;max-height:240px;overflow-y:auto;box-shadow:0 8px 30px rgba(0,0,0,.35);margin-top:4px}
.ac-item{padding:11px 14px;font-size:14px;cursor:pointer;display:flex;align-items:center;gap:10px;border-bottom:1px solid #2e4a3855}
.ac-item:last-child{border-bottom:none}
.ac-item:hover{background:#2e4a38}
.avatar{width:34px;height:34px;background:var(--green);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:var(--court);flex-shrink:0}
.player-card{display:flex;align-items:center;gap:12px;background:#1b2d24;border:1px solid var(--court);border-radius:10px;padding:11px 13px;margin-top:10px}
.lk-badge{margin-left:auto;border:1px solid #52b78855;color:var(--court);font-size:11px;font-weight:700;padding:2px 8px;border-radius:6px}
.seg{display:flex;gap:8px}
.seg button{flex:1;padding:12px 6px;border-radius:10px;font-family:inherit;font-size:14px;font-weight:600;cursor:pointer;border:1.5px solid var(--line);background:transparent;color:var(--muted);transition:all .15s}
.seg button.on{background:#1a3d2a;color:var(--court);border-color:var(--court)}
.seg button.no.on{background:#3d1a1a;color:#e74c3c;border-color:#e74c3c}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{position:relative;padding:7px 12px;border-radius:20px;border:1px solid var(--line);font-size:13px;color:var(--muted);cursor:pointer;user-select:none}
.chip.on{background:#1a3d2a;border-color:var(--court);color:var(--court);font-weight:600;padding-left:30px}
.chip .num{position:absolute;left:5px;top:50%;transform:translateY(-50%);width:19px;height:19px;border-radius:50%;background:var(--court);color:var(--dark);font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center}
.chip small{opacity:.7;font-size:10px;margin-left:4px}
.opt{display:flex;align-items:center;gap:10px;padding:9px 0;font-size:14px;cursor:pointer;border-bottom:1px solid #2e4a3855}
.opt:last-child{border-bottom:none}
.dot{width:18px;height:18px;border-radius:50%;border:2px solid var(--line);flex-shrink:0}
.opt.on .dot{border-color:var(--court);background:radial-gradient(var(--court) 45%,transparent 50%)}
.link{font-size:12px;color:var(--court);margin-top:10px;cursor:pointer;text-decoration:underline;display:inline-block}
.row{display:flex;gap:10px;margin-top:10px}.row>div{flex:1}
.lbl{font-size:11px;color:var(--muted);margin-bottom:4px}
.btn{display:block;width:100%;padding:14px;border-radius:10px;border:none;font-family:inherit;font-size:15px;font-weight:600;cursor:pointer;background:var(--green-light);color:#fff;margin-top:6px;transition:all .2s}
.btn:hover{background:var(--court);color:var(--dark)}
.btn:disabled{opacity:.5;cursor:default}
.msg{font-size:13px;min-height:20px;margin-top:12px;text-align:center;font-weight:500}
.msg.ok{color:var(--court)}.msg.err{color:#e74c3c}
.notice{background:#1a3d2a;border:1px solid #52b78855;border-radius:10px;padding:10px 13px;font-size:12px;color:var(--court);margin-bottom:12px}
.deadline{text-align:center;font-size:12px;color:var(--muted);margin-top:12px}
.done{text-align:center;padding:40px 10px}
.done .big{font-family:'Bebas Neue',sans-serif;font-size:34px;letter-spacing:1px;color:var(--court);margin-bottom:8px}
.hidden{display:none!important}
</style>
</head>
<body>
<div id="sp-login" style="position:fixed;inset:0;background:#0d2015;display:flex;align-items:center;justify-content:center;z-index:9999;font-family:'DM Sans',sans-serif;">
  <div style="background:#1a2e24;border:1px solid #2d6a4f;border-radius:14px;padding:36px 32px;width:100%;max-width:320px;box-shadow:0 20px 60px rgba(0,0,0,.6);">
    <div style="text-align:center;margin-bottom:24px">
      <div style="font-family:'Bebas Neue',sans-serif;font-size:1.5rem;letter-spacing:.1em;color:#74c69d">FÜCHSE BERLIN</div>
      <div style="font-size:.7rem;color:#4a9970;letter-spacing:.08em;text-transform:uppercase;margin-top:3px">Spieler-App</div>
    </div>
    <div style="margin-bottom:20px">
      <label style="font-size:.7rem;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:#4a9970;display:block;margin-bottom:5px">Passwort</label>
      <input id="sp-pw" type="password" autocomplete="off"
        style="width:100%;background:#111;border:1px solid #2d6a4f;border-radius:8px;color:#f0f0f0;padding:9px 12px;font-family:'DM Sans',sans-serif;font-size:.9rem;outline:none"
        placeholder="••••••••" onkeydown="if(event.key==='Enter')spLogin()">
    </div>
    <button onclick="spLogin()" style="width:100%;padding:11px;border-radius:8px;border:none;background:#2d6a4f;color:#fff;font-family:'DM Sans',sans-serif;font-size:.9rem;font-weight:600;cursor:pointer">Einloggen</button>
    <div id="sp-err" style="margin-top:12px;font-size:.8rem;color:#e63946;text-align:center;min-height:18px"></div>
  </div>
</div>
<script>
(function(){
  const _c='01612cccec019602';
  const KEY='fcb_spieler_auth';
  if(sessionStorage.getItem(KEY)==='ok'){document.getElementById('sp-login').style.display='none';}
  window.spLogin=async function(){
    const _d='59699dc4b9a79a54';
    const pw=document.getElementById('sp-pw').value;
    const _h=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(pw));
    const hex=Array.from(new Uint8Array(_h)).map(b=>b.toString(16).padStart(2,'0')).join('');
    const _a=document.getElementById('_fa').dataset.v;
    const _b=document.getElementById('_fb').dataset.v;
    const _ref=_a+_b+_c+_d;
    if(hex===_ref){
      sessionStorage.setItem(KEY,'ok');
      const o=document.getElementById('sp-login');
      o.style.opacity='0';o.style.transition='opacity .3s';
      setTimeout(()=>o.style.display='none',300);
    }else{
      document.getElementById('sp-err').textContent='Falsches Passwort';
      document.getElementById('sp-pw').value='';
      setTimeout(()=>document.getElementById('sp-err').textContent='',2000);
    }
  };
})();
</script>

<main>
<div id="form-view">
  <div class="step-label" id="t-label"></div>
  <div class="step-title" id="t-title"></div>
  <div class="step-sub" id="t-sub"></div>

  <!-- Name -->
  <div class="card">
    <div class="q" id="t-who"></div>
    <div id="mode-found">
      <div class="ac-wrap">
        <input id="ac-input" oninput="onAcInput()" autocomplete="off">
        <div class="ac-list" id="ac-list" style="display:none"></div>
      </div>
      <div id="player-card"></div>
      <div id="find-status" class="hint" style="margin:8px 0 0"></div>
      <span class="link" id="t-notinlist" onclick="setMode('new')"></span>
    </div>
    <div id="mode-new" class="hidden">
      <input id="new-name" autocomplete="off" oninput="onNameChange()">
      <div class="row">
        <div><div class="lbl" id="t-year"></div><input id="new-year" type="number" inputmode="numeric" min="1920" max="2025" oninput="renderChips()"></div>
        <div><div class="lbl">LK</div><input id="new-lk" inputmode="decimal"></div>
      </div>
      <span class="link" id="t-backtolist" onclick="setMode('found')"></span>
    </div>
    <div id="gender-wrap" class="hidden" style="margin-top:10px">
      <div class="seg" id="gender">
        <button data-v="M" id="t-men"></button><button data-v="F" id="t-women"></button>
      </div>
    </div>
  </div>

  <div id="existing-notice" class="notice hidden"></div>

  <!-- Participation -->
  <div class="card">
    <div class="q" id="t-participate"></div>
    <div class="seg" id="participates">
      <button data-v="true" id="t-yes1"></button><button data-v="false" class="no" id="t-no1"></button>
    </div>
  </div>

  <div id="yes-block" class="hidden">
    <div class="card">
      <div class="q" id="t-cats"></div>
      <div class="hint" id="t-catshint"></div>
      <div class="chips" id="chips"></div>
      <span class="link hidden" id="t-catsreset" onclick="resetCats()"></span>
    </div>
    <div class="card">
      <div class="q" id="t-commit"></div>
      <div id="commitment">
        <div class="opt" data-v="all"><span class="dot"></span><span id="t-c-all"></span></div>
        <div class="opt" data-v="half"><span class="dot"></span><span id="t-c-half"></span></div>
        <div class="opt" data-v="ersatz"><span class="dot"></span><span id="t-c-ersatz"></span></div>
      </div>
    </div>
    <div class="card">
      <div class="q" id="t-captain"></div>
      <div class="seg" id="captain">
        <button data-v="true" id="t-yes2"></button><button data-v="false" class="no" id="t-no2"></button>
      </div>
    </div>
  </div>

  <div class="card">
    <div class="q"><span id="t-comment"></span> <span class="opt-l" id="t-optional"></span></div>
    <textarea id="comment" rows="3"></textarea>
  </div>

  <button class="btn" id="submit" onclick="submit()"></button>
  <div class="msg" id="msg"></div>
  <div class="deadline" id="t-deadline"></div>
</div>

<div id="done-view" class="hidden done">

  <div class="step-sub" id="t-thankssub"></div>
  <span class="link" id="t-edit" onclick="showForm()"></span>
</div>
</main>

// ── ACTIVE SEASON ── switched in admin.html (header). Stored in Supabase → app_settings.
// Format: 'S2026' = Sommer 2026, 'W2026' = Winter 2026/27. The value below is only a fallback.
let ACTIVE_SEASON='W2026';
async function _readSetting(key){
  try{
    const r=await fetch(`${SB_URL}/rest/v1/app_settings?key=eq.${key}&select=value`,{headers:{'apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY}});
    if(!r.ok)return null;const j=await r.json();return j[0]?.value??null;
  }catch(e){console.warn('app_settings',e);return null;}
}
// ── ACTIVE SURVEY ── set in admin.html → Umfrage tab (app_settings 'active_survey'); value below is only a fallback
//   competition: 'sommer' | 'ferienrunde' | 'winter'
//   year: calendar year the Altersklassen are calculated for (AK X = turns X in that year)
let SURVEY={season_id:'S2027',competition:'sommer',year:2027,deadline:'30.11.2026'};
const _seasonReady=(async()=>{
  const[v,sv]=await Promise.all([_readSetting('active_season'),_readSetting('active_survey')]);
  if(typeof v==='string'&&/^[SW]\d{4}$/.test(v))ACTIVE_SEASON=v;
  if(sv&&sv.season_id&&['sommer','ferienrunde','winter'].includes(sv.competition)&&parseInt(sv.year))SURVEY={season_id:sv.season_id,competition:sv.competition,year:parseInt(sv.year),deadline:sv.deadline||''};
})();
// ── ALTERSKLASSEN ── offered per competition (check against the current TVBB Ausschreibung)

};
const HDR={'apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY,'Content-Type':'application/json'};
async function sbGet(t,p=''){const r=await fetch(`${SB_URL}/rest/v1/${t}?${p}`,{headers:HDR});if(!r.ok)throw new Error(await r.text());return r.json();}
async function sbGetAll(t,p=''){let out=[],off=0;while(true){const b=await sbGet(t,`${p}${p?'&':''}limit=1000&offset=${off}`);out=out.concat(b);if(b.length<1000)break;off+=1000;}return out;}
async function sbUpsert(t,d,onConflict){const r=await fetch(`${SB_URL}/rest/v1/${t}?on_conflict=${onConflict}`,{method:'POST',headers:{...HDR,'Prefer':'resolution=merge-duplicates'},body:JSON.stringify(d)});if(!r.ok)throw new Error(await r.text());}

let lang='de';
let players=[],responses=[];
let mode='found',selected=null;
const form={gender:null,participates:null,categories:new Set(),commitment:null,captain:null};

function tr(k){return T[lang][k]??T.de[k]??k}
function setText(id,t){const e=document.getElementById(id);if(e)e.textContent=t;}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function initials(n){return n.split(/\s+/).filter(Boolean).map(w=>w[0]).join('').toUpperCase().slice(0,2)}
function nameKey(n){return n.normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,' ').trim().split(' ').sort().join(' ');}
function compName(){return COMP_NAME[lang][SURVEY.competition]+' '+SURVEY.year;}

function setLang(l){
  lang=l;document.documentElement.lang=l;
  document.querySelectorAll('.lang-btn').forEach(b=>b.classList.toggle('active',b.textContent===l.toUpperCase()));
  applyT();
}
function applyT(){
  setText('header-sub',tr('headerSub'));
  showMsg('');
  setText('t-label',tr('label')+' · '+compName());
  setText('t-title',tr('title'));setText('t-sub',tr('sub'));setText('t-who',tr('who'));
  document.getElementById('ac-input').placeholder=tr('searchPh');
  document.getElementById('new-name').placeholder=tr('namePh');
  document.getElementById('new-lk').placeholder=tr('lkPh');
  document.getElementById('comment').placeholder=tr('commentPh');
  setText('t-notinlist',tr('notInList'));setText('t-backtolist',tr('backToList'));setText('t-year',tr('year'));
  setText('t-men',tr('men'));setText('t-women',tr('women'));
  setText('t-participate',tr('participate'));setText('t-yes1',tr('yes'));setText('t-no1',tr('no'));
  setText('t-yes2',tr('yes'));setText('t-no2',tr('no'));
  setText('t-cats',tr('cats'));setText('t-catshint',tr('catsHint'));setText('t-catsreset',tr('catsReset'));
  setText('t-commit',tr('commit'));setText('t-c-all',tr('cAll'));setText('t-c-half',tr('cHalf'));setText('t-c-ersatz',tr('cErsatz'));
  setText('t-captain',tr('captain'));setText('t-comment',tr('comment'));setText('t-optional',tr('optional'));
  setText('submit',tr('submit'));setText('t-deadline',SURVEY.deadline?tr('deadline').replace('{d}',SURVEY.deadline):'');
  setText('t-thanks',tr('thanks'));setText('t-thankssub',tr('thanksSub'));setText('t-edit',tr('edit'));
  if(players.length===0&&!document.getElementById('find-status').dataset.err)setText('find-status',tr('loading'));
  renderChips();updateExistingNotice();
}

// ── Data ──
async function loadAll(){
  await _seasonReady;
  applyT();
  try{
    const[pl,rs]=await Promise.all([
      sbGetAll('players',`season_id=eq.${ACTIVE_SEASON}&select=id,name,raw_name,lk_str,year,gender&order=name,id`),
      sbGetAll('survey_responses',`season_id=eq.${SURVEY.season_id}&competition=eq.${SURVEY.competition}&order=id`)
    ]);
    players=pl;responses=rs;
    setText('find-status','');
  }catch(e){
    console.error(e);
    const fs=document.getElementById('find-status');fs.dataset.err='1';fs.textContent=tr('loadErr');
  }
}

// ── Name search ──
function onAcInput(){
  const val=document.getElementById('ac-input').value.toLowerCase();
  const list=document.getElementById('ac-list');
  if(selected&&val!==selected.name.toLowerCase())selectPlayer(null);
  if(val.length<2){list.style.display='none';return;}
  const f=players.filter(p=>p.name.toLowerCase().includes(val)||(p.raw_name||'').toLowerCase().includes(val)).slice(0,10);
  if(!f.length){list.style.display='none';return;}
  list.innerHTML=f.map(p=>`<div class="ac-item" onclick="selectPlayer('${esc(p.id)}')">
    <div class="avatar">${esc(initials(p.name))}</div>
    <div style="flex:1"><div style="font-weight:600">${esc(p.name)}</div><div style="font-size:11px;color:var(--muted)">${esc(p.year||'')}</div></div>
    <span class="lk-badge">${esc(p.lk_str||'?')}</span></div>`).join('');
  list.style.display='block';
}
document.addEventListener('click',e=>{if(!e.target.closest('.ac-wrap'))document.getElementById('ac-list').style.display='none';});

function selectPlayer(id){
  selected=id?players.find(p=>p.id===id):null;
  const card=document.getElementById('player-card');
  if(selected){
    document.getElementById('ac-input').value=selected.name;
    document.getElementById('ac-list').style.display='none';
    card.innerHTML=`<div class="player-card"><div class="avatar">${esc(initials(selected.name))}</div>
      <div><div style="font-weight:600">${esc(selected.name)}</div><div style="font-size:11px;color:var(--muted)">${selected.year?tr('year')+' '+esc(selected.year):''}</div></div>
      <span class="lk-badge">${esc(selected.lk_str||'?')}</span></div>`;
    form.gender=(selected.gender==='M'||selected.gender==='F')?selected.gender:null;
  }else{card.innerHTML='';form.gender=null;}
  syncGender();prefillFromExisting();renderChips();
}

function setMode(m){
  mode=m;
  document.getElementById('mode-found').classList.toggle('hidden',m!=='found');
  document.getElementById('mode-new').classList.toggle('hidden',m!=='new');
  if(m==='new'){selectPlayer(null);form.gender=null;}
  syncGender();prefillFromExisting();renderChips();
}
function onNameChange(){prefillFromExisting();}

// Gender toggle only when we don't know it from the roster
function syncGender(){
  const show=mode==='new'||(selected&&!(selected.gender==='M'||selected.gender==='F'));
  document.getElementById('gender-wrap').classList.toggle('hidden',!show);
  document.querySelectorAll('#gender button').forEach(b=>b.classList.toggle('on',b.dataset.v===form.gender));
}

function currentName(){return mode==='found'?(selected?.name||''):document.getElementById('new-name').value.trim();}
function currentYear(){return mode==='found'?parseInt(selected?.year)||null:parseInt(document.getElementById('new-year').value)||null;}

// ── Categories: base + Altersklassen the player is eligible for ──
function availableCats(){
  const g=form.gender,y=currentYear();
  if(!g)return null;
  const base=g==='M'?'Herren':'Damen';
  const out=[{n:base}];
  const ages=(AK[SURVEY.competition]||{})[g]||[];
  if(y&&y>1900)ages.forEach(a=>{if(SURVEY.year-y>=a)out.push({n:`${base} ${a}`,h:`${tr('from')} ${SURVEY.year-a}`});});
  if(SURVEY.competition==='ferienrunde'){
    return [{n:'Mixed'},...out.map(c=>({n:c.n+' Doppel',h:c.h}))];
  }
  return out;
}
function renderChips(){
  const el=document.getElementById('chips');
  const cats=availableCats();
  if(!cats){el.innerHTML=`<div class="hint" style="margin:0">${esc(tr('catsNeed'))}</div>`;return;}
  const names=new Set(cats.map(c=>c.n));
  form.categories.forEach(c=>{if(!names.has(c))form.categories.delete(c);});
  // form.categories is a Set → keeps tap order = priority (1 = Wunschteam)
  const order=[...form.categories];
  el.innerHTML=cats.map(c=>{const i=order.indexOf(c.n);
    return`<span class="chip${i>=0?' on':''}" data-v="${esc(c.n)}">${i>=0?`<span class="num">${i+1}</span>`:''}${esc(c.n)}${c.h?`<small>${esc(c.h)}</small>`:''}</span>`;}).join('');
  el.querySelectorAll('.chip').forEach(ch=>ch.onclick=()=>{
    const v=ch.dataset.v;form.categories.has(v)?form.categories.delete(v):form.categories.add(v);renderChips();
  });
  document.getElementById('t-catsreset').classList.toggle('hidden',form.categories.size<2);
}
function resetCats(){form.categories.clear();renderChips();}

// ── Single-choice controls ──
function bindSeg(id,key,parse){
  document.querySelectorAll(`#${id} button`).forEach(b=>b.onclick=()=>{
    form[key]=parse(b.dataset.v);
    document.querySelectorAll(`#${id} button`).forEach(x=>x.classList.toggle('on',x===b));
    if(key==='gender')renderChips();
    if(key==='participates')document.getElementById('yes-block').classList.toggle('hidden',!form.participates);
  });
}
function setSeg(id,val){document.querySelectorAll(`#${id} button`).forEach(b=>b.classList.toggle('on',val!==null&&b.dataset.v===String(val)));}
bindSeg('gender','gender',v=>v);
bindSeg('participates','participates',v=>v==='true');
bindSeg('captain','captain',v=>v==='true');
document.querySelectorAll('#commitment .opt').forEach(o=>o.onclick=()=>{
  form.commitment=o.dataset.v;
  document.querySelectorAll('#commitment .opt').forEach(x=>x.classList.toggle('on',x===o));
});

// ── Existing answer → prefill + notice ──
function findExisting(){
  const n=currentName();if(!n)return null;
  const k=nameKey(n);
  return responses.find(r=>(selected&&r.player_id===selected.id)||r.name_key===k)||null;
}
function updateExistingNotice(){
  const ex=findExisting(),el=document.getElementById('existing-notice');
  if(!ex){el.classList.add('hidden');return;}
  const d=new Date(ex.updated_at||ex.created_at).toLocaleDateString(lang==='en'?'en-GB':lang==='es'?'es-AR':'de-DE');
  el.textContent=tr('existing').replace('{d}',d);el.classList.remove('hidden');
}
let lastPrefilled=null;
function prefillFromExisting(){
  updateExistingNotice();
  const ex=findExisting();
  if(!ex||ex.id===lastPrefilled)return;
  lastPrefilled=ex.id;
  if(mode==='new'){
    if(ex.birth_year)document.getElementById('new-year').value=ex.birth_year;
    if(ex.lk)document.getElementById('new-lk').value=ex.lk;
  }
  if(ex.gender&&!form.gender)form.gender=ex.gender;
  syncGender();
  form.participates=ex.participates;setSeg('participates',ex.participates);
  document.getElementById('yes-block').classList.toggle('hidden',!ex.participates);
  form.categories=new Set(ex.categories||[]);
  form.commitment=ex.commitment;document.querySelectorAll('#commitment .opt').forEach(o=>o.classList.toggle('on',o.dataset.v===ex.commitment));
  form.captain=ex.captain;setSeg('captain',ex.captain);
  document.getElementById('comment').value=ex.comment||'';
  renderChips();
}

// ── Submit ──
function showMsg(t,cls){const m=document.getElementById('msg');m.textContent=t;m.className='msg '+(cls||'');}
async function submit(){
  const name=currentName(),year=currentYear();
  if(!name)return showMsg(tr('errName'),'err');
  if(!form.gender)return showMsg(tr('errGender'),'err');
  if(mode==='new'&&!year)return showMsg(tr('errYear'),'err');
  if(form.participates===null)return showMsg(tr('errPart'),'err');
  if(form.participates){
    if(!form.categories.size)return showMsg(tr('errCats'),'err');
    if(!form.commitment)return showMsg(tr('errCommit'),'err');
  }
  const ex=findExisting();
  const row={
    season_id:SURVEY.season_id,competition:SURVEY.competition,
    player_id:selected?.id||null,name,
    name_key:ex?ex.name_key:nameKey(name), // keep the stored key so the answer is overwritten, not duplicated
    gender:form.gender,birth_year:year,
    lk:mode==='found'?(selected?.lk_str||null):(document.getElementById('new-lk').value.trim()||null),
    participates:form.participates,
    categories:form.participates?[...form.categories]:[],
    commitment:form.participates?form.commitment:null,
    captain:form.participates?form.captain:null,
    comment:document.getElementById('comment').value.trim()||null,
  };
  const btn=document.getElementById('submit');btn.disabled=true;showMsg(tr('saving'));
  try{
    await sbUpsert('survey_responses',[row],'season_id,competition,name_key');
    responses=await sbGetAll('survey_responses',`season_id=eq.${SURVEY.season_id}&competition=eq.${SURVEY.competition}&order=id`);
    lastPrefilled=findExisting()?.id||null;
    showMsg('');
    document.getElementById('form-view').classList.add('hidden');
    document.getElementById('done-view').classList.remove('hidden');
    window.scrollTo(0,0);
  }catch(e){console.error(e);showMsg(tr('errSave'),'err');}
  finally{btn.disabled=false;}
}
function showForm(){
  document.getElementById('done-view').classList.add('hidden');
  document.getElementById('form-view').classList.remove('hidden');
  updateExistingNotice();
}

applyT();
loadAll();
</script>
