<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Füchse Berlin – Verfügbarkeit</title>
<link href="fonts/fonts.css?v=1" rel="stylesheet">
<style>
:root{
  --red:#c0392b;--red-light:#e74c3c;
  --green:#2d6a4f;--green-light:#40916c;--green-pale:#e8f5ee;
  --white:#f0f7f2;--dark:#1e2d24;--mid:#263b2e;--muted:#a3c2ae;
  --line:#2e4a38;--warn:#f4a261;--court:#52b788;
  --card:#243330;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'DM Sans',sans-serif;background:var(--dark);color:var(--white);min-height:100vh}
::-webkit-scrollbar{width:5px}
::-webkit-scrollbar-track{background:var(--dark)}
::-webkit-scrollbar-thumb{background:var(--green);border-radius:3px}

header{
  background:linear-gradient(160deg,#1b2d23 0%,#2d4a38 60%,#1e2d24 100%);
  padding:20px 24px 18px;border-bottom:3px solid var(--red);
  display:flex;align-items:center;gap:16px;
}
.logo-img{width:54px;height:54px;object-fit:contain;flex-shrink:0}
.header-text h1{font-family:'Bebas Neue',sans-serif;font-size:26px;letter-spacing:2px;color:var(--white)}
.header-text p{font-size:11px;color:var(--muted);letter-spacing:1px;text-transform:uppercase;margin-top:2px}

.lang-bar{display:flex;gap:5px;margin-left:auto}
.lang-btn{padding:4px 10px;font-size:11px;font-weight:600;border:1px solid var(--line);border-radius:6px;cursor:pointer;background:transparent;color:var(--muted);font-family:'DM Sans',sans-serif;transition:all .15s}
.lang-btn.active{background:var(--green);color:#fff;border-color:var(--green-light)}

main{padding:20px;max-width:480px;margin:0 auto}

.step{display:none}.step.active{display:block}

.step-label{font-size:11px;font-weight:600;color:var(--court);text-transform:uppercase;letter-spacing:1px;margin-bottom:6px}
.step-title{font-family:'Bebas Neue',sans-serif;font-size:28px;letter-spacing:1px;color:var(--white);margin-bottom:4px}
.step-sub{font-size:13px;color:var(--muted);margin-bottom:20px}

.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin-bottom:12px}

input,select{background:#1b2d24;border:1px solid var(--line);border-radius:8px;color:var(--white);padding:10px 14px;font-family:'DM Sans',sans-serif;font-size:14px;outline:none;width:100%;transition:border-color .2s}
input:focus,select:focus{border-color:var(--court)}
input::placeholder{color:var(--muted)}

.ac-wrap{position:relative}
.ac-list{position:absolute;top:100%;left:0;right:0;background:#243330;border:1px solid #3a5a48;border-radius:10px;z-index:50;max-height:240px;overflow-y:auto;box-shadow:0 8px 30px rgba(0,0,0,.35);margin-top:4px}
.ac-item{padding:11px 14px;font-size:14px;cursor:pointer;color:var(--white);display:flex;align-items:center;gap:10px;border-bottom:1px solid #2e4a3855}
.ac-item:last-child{border-bottom:none}
.ac-item:hover{background:#2e4a38}
.ac-meta{font-size:11px;color:var(--muted);margin-left:auto}
.avatar{width:34px;height:34px;background:var(--green);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:#d8f3dc;flex-shrink:0}

.btn{display:block;width:100%;padding:13px 20px;border-radius:10px;border:none;font-family:'DM Sans',sans-serif;font-size:15px;font-weight:600;cursor:pointer;transition:all .2s;text-align:center;margin-bottom:10px}
.btn-primary{background:var(--green-light);color:#fff}
.btn-primary:hover{background:var(--court);color:var(--dark)}
.btn-outline{background:transparent;border:1px solid var(--line);color:var(--muted)}
.btn-outline:hover{border-color:var(--court);color:var(--court)}
.btn-sm{width:auto;display:inline-block;padding:7px 16px;font-size:13px;margin:0}

.wk-head{display:flex;justify-content:space-between;align-items:baseline;font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin:18px 2px 7px}
.wk-head:first-child{margin-top:4px}
.wk-head span:last-child{font-weight:500;letter-spacing:.5px}
.match-item.st-yes{border-left:4px solid var(--court)}.match-item.st-conditional{border-left:4px dashed var(--court)}
.match-item.st-notfall{border-left:4px solid var(--warn)}.match-item.st-no{border-left:4px solid #ff6b5b}.match-item.st-none{border-left:4px solid #6f8a7b}
.match-item.is-blocked{background:#222a26;border-style:dashed;border-color:#4a5a52}
.match-item.is-past{opacity:.6}
.block-why{font-size:12px;color:#d6dfda;line-height:1.45;align-self:stretch}
.todo-line{font-size:12px;font-weight:600;margin:2px 2px 10px}
.past-toggle{display:block;width:100%;background:none;border:1px dashed var(--line);border-radius:10px;color:var(--court);font:inherit;font-size:13px;padding:10px;margin-bottom:9px;cursor:pointer}
.match-item{background:#1b2d24;border:1px solid var(--line);border-radius:10px;padding:13px 15px;margin-bottom:9px;cursor:pointer;transition:all .2s;display:flex;align-items:center;gap:12px}
.match-item:hover{border-color:var(--court)99;background:#243330;transform:translateY(-1px)}
.match-date{font-family:'Bebas Neue',sans-serif;font-size:24px;color:var(--court);line-height:1;min-width:40px;text-align:center}
.match-month{font-size:11px;color:var(--muted);text-align:center;text-transform:uppercase;letter-spacing:.5px}
.match-info{flex:1}
.match-teams{font-weight:600;font-size:14px;color:var(--white)}
.match-meta{font-size:11px;color:var(--muted);margin-top:2px}
.match-avail{font-size:11px;font-weight:700;padding:3px 9px;border-radius:20px;white-space:nowrap}
.av-yes{background:#1a3d2a;color:var(--court);border:1px solid var(--court)55}
.av-no{background:#3d1a1a;color:#ff6b5b;border:1px solid #e74c3c44}
.av-maybe{background:#2d2215;color:var(--warn);border:1px solid var(--warn)44}
.av-open{background:#2e4a3844;color:var(--muted);border:1px solid var(--line)}

.player-card{display:flex;align-items:center;gap:12px;background:#1b2d24;border:1px solid var(--line);border-radius:10px;padding:13px 15px;margin-bottom:14px}
.player-card .avatar{width:44px;height:44px;font-size:15px}
.lk-badge{background:#1b2d24;border:1px solid var(--court)55;color:var(--court);font-size:11px;font-weight:700;padding:2px 8px;border-radius:6px}

.spinner{display:inline-block;width:14px;height:14px;border:2px solid var(--line);border-top-color:var(--court);border-radius:50%;animation:spin .7s linear infinite;vertical-align:middle;margin-right:6px}
@keyframes spin{to{transform:rotate(360deg)}}

.empty{text-align:center;padding:3rem 20px;color:var(--muted);font-size:14px}

.back-row{display:flex;align-items:center;gap:8px;margin-bottom:18px}
.back-btn{background:none;border:1px solid var(--line);color:var(--muted);border-radius:8px;padding:6px 14px;font-family:'DM Sans',sans-serif;font-size:13px;cursor:pointer;transition:all .15s}
.back-btn:hover{border-color:var(--court);color:var(--court)}

</style>
<script src="common.js?v=5"></script>
</head>
<body>
<div id="sp-login" style="position:fixed;inset:0;background:#0d2015;display:flex;align-items:center;justify-content:center;z-index:9999;font-family:'DM Sans',sans-serif;">
  <div style="background:#1a2e24;border:1px solid #2d6a4f;border-radius:14px;padding:36px 32px;width:100%;max-width:320px;box-shadow:0 20px 60px rgba(0,0,0,.6);">
    <div style="text-align:center;margin-bottom:24px">
      <img src="logo.svg" alt="Füchse Berlin" style="width:56px;height:56px;object-fit:contain;display:block;margin:0 auto 10px">
      <div style="font-family:'Bebas Neue',sans-serif;font-size:1.5rem;letter-spacing:.1em;color:#74c69d">FÜCHSE BERLIN</div>
      <div style="font-size:.7rem;color:#74c69d;letter-spacing:.08em;text-transform:uppercase;margin-top:3px" data-ct="playerApp">Spieler-App</div>
    </div>
    <div style="margin-bottom:20px">
      <label style="font-size:.7rem;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:#74c69d;display:block;margin-bottom:5px" data-ct="password">Passwort</label>
      <input id="sp-pw" type="password" autocomplete="off"
        style="width:100%;background:#111;border:1px solid #2d6a4f;border-radius:8px;color:#f0f0f0;padding:9px 12px;font-family:'DM Sans',sans-serif;font-size:.9rem;outline:none"
        onkeydown="if(event.key==='Enter')spLogin()">
    </div>
    <button onclick="spLogin()" style="width:100%;padding:11px;border-radius:8px;border:none;background:#2d6a4f;color:#fff;font-family:'DM Sans',sans-serif;font-size:.9rem;font-weight:600;cursor:pointer" data-ct="loginBtn">Einloggen</button>
    <div id="sp-err" style="margin-top:12px;font-size:.8rem;color:#ff6b5b;text-align:center;min-height:18px"></div>
  </div>
</div>
<script>clubInitGate();</script>
<header>
  <img class="logo-img" src="logo.svg" alt="Füchse Berlin">
  <div class="header-text">
    <h1>Füchse Berlin</h1>
    <p id="header-sub">Spielerverfügbarkeit</p>
  </div>
  <div class="lang-bar">
    <button class="lang-btn active" onclick="setLang('de')">DE</button>
    <button class="lang-btn" onclick="setLang('es')">ES</button>

  </div>
</header>

<main>

<!-- STEP 1: Find yourself -->
<div class="step active" id="step-find">
  <div class="step-label" id="lbl-step1"></div>
  <div class="step-title" id="ttl-step1"></div>
  <div class="step-sub" id="sub-step1"></div>
  <div class="card">
    <div class="ac-wrap">
      <input id="ac-input" oninput="onAcInput()" autocomplete="off" placeholder="...">
      <div class="ac-list" id="ac-list" style="display:none"></div>
    </div>
    <div id="find-status" style="margin-top:10px;font-size:13px;color:var(--muted)"></div>
  </div>
</div>

<!-- STEP 2: Match list -->
<div class="step" id="step-matches">
  <div class="back-row">
    <button class="back-btn" onclick="goFind()">←</button>
    <div>
      <div class="step-label" id="lbl-step2"></div>
      <div id="selected-player-name" style="font-family:'Bebas Neue',sans-serif;font-size:22px;letter-spacing:1px;color:var(--white)"></div>
    </div>
  </div>
  <div id="player-info-card"></div>
  <div class="step-sub" id="sub-step2"></div>
  <div id="match-list"></div>
</div>


</main>

<script>
// ── ACTIVE SEASON ── switched in admin.html (header). Stored in Supabase → app_settings.
// Format: 'S2026' = Sommer 2026, 'W2026' = Winter 2026/27. The value below is only a fallback.
let ACTIVE_SEASON='W2026';
const _seasonReady=(async()=>{const v=await _readSetting('active_season');if(typeof v==='string'&&/^[SW]\d{4}$/.test(v))ACTIVE_SEASON=v;})();

async function sbGet(t,p=''){const r=await fetch(`${SB_URL}/rest/v1/${t}?${p}`,{headers:await clubHDR({'Prefer':''})});if(!r.ok)throw new Error(await r.text());return r.json();}
async function sbUpsert(t,d){const r=await fetch(`${SB_URL}/rest/v1/${t}`,{method:'POST',headers:await clubHDR({'Prefer':'resolution=merge-duplicates'}),body:JSON.stringify(d)});if(!r.ok)throw new Error(await r.text());}

const T={
  de:{
    headerSub:'Spielerverfügbarkeit',movedBadge:'Verlegt',movedFrom:'verlegt vom',
    step1Label:'Schritt 1 von 2',step1Title:'Wer bist du?',step1Sub:'Suche deinen Namen in der Kaderliste.',
    step1Ph:'Namen eingeben...',findStatus:'Lade Spieler...',
    step2Label:'Schritt 2 von 2',step2Sub:'Wähle bei jedem Spiel Ja, Im Notfall oder Nein.',
    yesBtn:'✓ Ja',conditionalBtn:'(Ja)',notfallBtn:'Im Notfall',noBtn:'✗ Nein',
    saved:'✓ Gespeichert',saving:'Speichern...',
    noMatches:'Keine Spiele für deine Mannschaft gefunden.',
    weekend:'Wochenende',week:'Woche',nMatches:n=>n===1?'1 Spiel':n+' Spiele',
    noPlayers:'Keine Spieler gefunden.',
    priorityTitle:'Welches Spiel ist dein Hauptspiel?',priorityHint:'Du hast an diesem Tag bereits zugesagt. Wähle dein Hauptspiel — das andere wird als (Ja) eingetragen.',
    filterHint:'Tippe auf ein Team, um nur dessen Spiele zu sehen. Du siehst alle Teams, für die du spielberechtigt bist.',
    mainTeamHint:'★ = Stammmannschaft — dein empfohlenes Team.',
    pastShow:n=>`▸ ${n} ${n===1?'vergangenes Spiel':'vergangene Spiele'} anzeigen`,pastHide:'▾ Vergangene Spiele ausblenden',
    unanswered:n=>`● ${n} ${n===1?'Spiel':'Spiele'} ohne Antwort`,allAnswered:'✓ Alle Spiele beantwortet',
    blockedTitle:'⛔ Für dich gesperrt',reasonSK:t=>`laut Meldeliste gehörst du zu ${t} (Stammkader)`,reasonSM:(n,ts)=>`${n} Einsätze in ${ts} (Stammmannschaft)`,
    addCal:'In den Kalender',yourAnswer:'Deine Antwort',noAnswerPast:'keine Antwort',
  },
  es:{
    headerSub:'Disponibilidad de jugadores',movedBadge:'Postergado',movedFrom:'movido del',
    step1Label:'Paso 1 de 2',step1Title:'¿Quién sos?',step1Sub:'Buscá tu nombre en el plantel.',
    step1Ph:'Escribí tu nombre...',findStatus:'Cargando jugadores...',
    step2Label:'Paso 2 de 2',step2Sub:'Elegí Sí, Si es necesario o No en cada partido.',
    yesBtn:'✓ Sí',conditionalBtn:'(Sí)',notfallBtn:'Si es necesario',noBtn:'✗ No',
    saved:'✓ Guardado',saving:'Guardando...',
    noMatches:'No hay partidos para tu equipo.',
    weekend:'Fin de semana',week:'Semana',nMatches:n=>n===1?'1 partido':n+' partidos',
    noPlayers:'No se encontraron jugadores.',
    priorityTitle:'¿Cuál es tu partido principal?',priorityHint:'Ya confirmaste para otro partido ese día. Elegí cuál es tu principal — el otro quedará como (Sí).',
    filterHint:'Tocá un equipo para ver solo sus partidos. Ves todos los equipos en los que tenés Spielberechtigung.',
    mainTeamHint:'★ = Stammmannschaft — tu equipo recomendado.',
    pastShow:n=>`▸ Ver ${n} ${n===1?'partido pasado':'partidos pasados'}`,pastHide:'▾ Ocultar partidos pasados',
    unanswered:n=>`● ${n} ${n===1?'partido':'partidos'} sin responder`,allAnswered:'✓ Respondiste todos los partidos',
    blockedTitle:'⛔ Bloqueado para vos',reasonSK:t=>`según la Meldeliste sos de ${t} (Stammkader)`,reasonSM:(n,ts)=>`${n} partidos en ${ts} (Stammmannschaft)`,
    addCal:'Agregar al calendario',yourAnswer:'Tu respuesta',noAnswerPast:'sin respuesta',
  },
  en:{
    headerSub:'Player availability',movedBadge:'Rescheduled',movedFrom:'moved from',

    step2Label:'Step 2 of 2',step2Sub:'Choose Yes, If needed or No for each match.',
    yesBtn:'✓ Yes',conditionalBtn:'(Yes)',notfallBtn:'If needed',noBtn:'✗ No',
    saved:'✓ Saved',saving:'Saving...',
    noMatches:'No matches found for your team.',
    weekend:'Weekend',week:'Week',nMatches:n=>n===1?'1 match':n+' matches',
    noPlayers:'No players found.',
    priorityTitle:'Which is your main match?',priorityHint:'You already confirmed for another match that day. Choose your main one — the other will become (Yes).',
    filterHint:'Tap a team to filter matches. You see all teams you are eligible to play for (Spielberechtigt).',
    mainTeamHint:'★ = Stammmannschaft — your recommended team.',
    pastShow:n=>`▸ Show ${n} past ${n===1?'match':'matches'}`,pastHide:'▾ Hide past matches',
    unanswered:n=>`● ${n} ${n===1?'match':'matches'} without an answer`,allAnswered:'✓ All matches answered',
    blockedTitle:'⛔ You are blocked',reasonSK:t=>`per the Meldeliste you belong to ${t} (Stammkader)`,reasonSM:(n,ts)=>`${n} matches in ${ts} (Stammmannschaft)`,

  }
};

let lang=savedLang(); // language chosen last time on this device
let state={players:[],teams:[],matches:[],availability:{},matchCounts:{},playerTeams:[],rankByTeam:{}};
let activeTeamFilters=new Set();
let selectedPlayer=null;

function tr(k){return T[lang][k]||T.de[k]||k}

function setLang(l){
  lang=l;rememberLang(l);applyCT();
  document.querySelectorAll('.lang-btn').forEach(b=>b.classList.toggle('active',b.textContent===l.toUpperCase()));
  applyT();
  if(selectedPlayer&&document.getElementById('step-matches')?.classList.contains('active'))renderMatchList();
}

function applyT(){
  document.getElementById('header-sub').textContent=tr('headerSub');
  document.getElementById('lbl-step1').textContent=tr('step1Label');
  document.getElementById('ttl-step1').textContent=tr('step1Title');
  document.getElementById('sub-step1').textContent=tr('step1Sub');
  document.getElementById('ac-input').placeholder=tr('step1Ph');
  document.getElementById('lbl-step2').textContent=tr('step2Label');
  document.getElementById('sub-step2').textContent=tr('step2Sub');
}

function initials(n){return n.split(' ').map(w=>w[0]).join('').toUpperCase().slice(0,2)}
function fmtDate(d){
  if(!d)return'';
  const[y,m,day]=d.split('-');
  const months=['Jan','Feb','Mär','Apr','Mai','Jun','Jul','Aug','Sep','Okt','Nov','Dez'];
  return{day,month:months[parseInt(m)-1],full:`${day}.${m}.${y}`};
}
function getPlayerTeamIds(playerId){return state.playerTeams.filter(r=>r.player_id===playerId).map(r=>r.team_id);}

// TVBB rules, Supabase helpers and the Sperren table cell are in common.js (shared by all pages).

async function loadAll(){
  document.getElementById('find-status').textContent=tr('findStatus');
  await _seasonReady;
  try{
    // Active season only (R1) and only the columns that are used (R2): teams + players first, then what belongs to them
    const[teams,players]=await Promise.all([
      sbGet('teams',`season_id=eq.${ACTIVE_SEASON}&order=category,team_number`),
      sbGetAll('players',`season_id=eq.${ACTIVE_SEASON}&order=lk,id`)
    ]);
    const _tids=teams.map(t=>t.id);
    const[matches,countRows,ptAll]=await Promise.all([
      sbGetIn('matches','team_id',_tids,'order=date,id'),
      sbGetIn('player_match_counts','team_id',_tids,'select=player_id,team_id,matches_played&order=player_id,team_id'),
      sbGetIn('player_teams','team_id',_tids,'select=player_id,team_id,rank,is_mainteam&order=player_id,team_id')
    ]);
    const _mids=matches.map(m=>m.id);
    const avRows=await sbGetIn('availability','match_id',_mids,'select=match_id,player_id,status&order=match_id,player_id');
    // Map teams same as admin — camelCase teamNumber so teamNumber() works correctly
    state.teams=teams.map(t=>({id:t.id,name:t.name,liga:t.liga,season:t.season,is_4er:t.is_4er||false,category:t.category||'Herren',teamNumber:t.team_number||1,gender:t.gender}));
    const _activeTeamIds=new Set(state.teams.map(t=>t.id));
    state.players=players.map(p=>({...p,lkStr:p.lk_str,rawName:p.raw_name,year:p.year}));
    const _seasonMatches=matches.filter(m=>_activeTeamIds.has(m.team_id)).map(m=>({...m,teamId:m.team_id}));
    // Verlegt (rescheduled by the captain): original is shown crossed out, answers go to the new match
    state.matches=_seasonMatches.filter(m=>m.status!=='verlegt');
    state.movedMatches=_seasonMatches.filter(m=>m.status==='verlegt');
    state.availability={};
    for(const r of avRows){if(!state.availability[r.match_id])state.availability[r.match_id]={};state.availability[r.match_id][r.player_id]=r.status;}
    state.matchCounts={};
    for(const r of countRows){if(!state.matchCounts[r.player_id])state.matchCounts[r.player_id]={};state.matchCounts[r.player_id][r.team_id]=r.matches_played;}
    let ptRows=ptAll;
    ptRows=ptRows.filter(r=>_activeTeamIds.has(r.team_id)); // other seasons stay archived
    state.playerTeams=ptRows;
    state.rankByTeam={};
    state.mainTeam={};
    for(const r of ptRows){
      if(r.rank!=null){
        if(!state.rankByTeam[r.player_id])state.rankByTeam[r.player_id]={};
        state.rankByTeam[r.player_id][r.team_id]=r.rank;
      }
      if(r.is_mainteam){
        if(!state.mainTeam[r.player_id])state.mainTeam[r.player_id]={};
        state.mainTeam[r.player_id][r.team_id]=true;
      }
    }
    document.getElementById('find-status').textContent='';
  }catch(e){document.getElementById('find-status').textContent='Verbindungsfehler. Bitte Seite neu laden.';console.error(e);}
}

function onAcInput(){
  const val=document.getElementById('ac-input').value.toLowerCase();
  const list=document.getElementById('ac-list');
  if(!val||val.length<2){list.style.display='none';return;}
  const filtered=state.players.filter(p=>p.name.toLowerCase().includes(val)||(p.raw_name||p.rawName||'').toLowerCase().includes(val)).slice(0,10);
  if(!filtered.length){list.style.display='none';return;}
  list.innerHTML=filtered.map(p=>`<div class="ac-item" onclick="selectPlayer('${p.id}')">
    <div class="avatar">${initials(p.name)}</div>
    <div style="flex:1"><div style="font-weight:600">${p.name}</div><div style="font-size:11px;color:var(--muted)">${p.year||''}</div></div>
    <span class="lk-badge">${p.lk_str||p.lkStr||'?'}</span>
  </div>`).join('');
  list.style.display='block';
}

document.addEventListener('click',e=>{if(!e.target.closest('.ac-wrap'))document.getElementById('ac-list').style.display='none';});

function selectPlayer(id){
  selectedPlayer=state.players.find(p=>p.id===id);
  document.getElementById('ac-input').value=selectedPlayer.name;
  document.getElementById('ac-list').style.display='none';
  goMatches();
}

function showStep(name){
  document.querySelectorAll('.step').forEach(s=>s.classList.remove('active'));
  document.getElementById('step-'+name).classList.add('active');
  window.scrollTo(0,0);
}

function goFind(){selectedPlayer=null;showStep('find');}
function goMatches(){if(!selectedPlayer)return showStep('find');activeTeamFilters.clear();renderMatchList();showStep('matches');}

function makeICS(m,team){
  const dt=m.date.replace(/-/g,'');
  const tm=(m.time||'10:00').replace(':','')+'00';
  // Estimate end time +3 hours
  const hh=parseInt((m.time||'10:00').split(':')[0]);
  const mm=(m.time||'10:00').split(':')[1];
  const endHH=String(hh+3).padStart(2,'0');
  const dtEnd=dt+'T'+endHH+mm+'00';
  const dtStart=dt+'T'+tm;
  const summary=m.home==='Heim'?`${team?.name||'?'} vs ${m.opponent}`:`${m.opponent} vs ${team?.name||'?'}`;
  const loc=m.venue||'';
  const uid2=`${m.id}@fuchseberlin`;
  const ics=[
    'BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Füchse Berlin//Club Manager//DE',
    'BEGIN:VEVENT',
    `DTSTART:${dtStart}`,`DTEND:${dtEnd}`,
    `SUMMARY:${summary}`,
    `LOCATION:${loc}`,
    `DESCRIPTION:${homeAwayLabel(m.home)} · ${m.time}`,
    `UID:${uid2}`,
    'END:VEVENT','END:VCALENDAR'
  ].join('\r\n');
  const blob=new Blob([ics],{type:'text/calendar'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;a.download=`${summary.replace(/[^a-zA-Z0-9]/g,'_')}.ics`;
  a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);
}

async function quickAvail(matchId,status,event){
  event.stopPropagation();
  if(!selectedPlayer)return;
  const pid=selectedPlayer.id;

  if(status==='yes'){
    const thisMatch=state.matches.find(m=>m.id===matchId);
    if(thisMatch){
      // Check for other yes/conditional on same day
      const sameDay=state.matches.filter(m=>
        m.id!==matchId &&
        spieltagOf(m)===spieltagOf(thisMatch) &&
        (state.availability[m.id]?.[pid]==='yes'||state.availability[m.id]?.[pid]==='conditional')
      );
      if(sameDay.length>0){
        // Show priority modal — let player choose which is the main match
        showPriorityModal(matchId, sameDay, pid);
        return;
      }
    }
  }

  // conditional cannot be set manually
  if(status==='conditional')return;

  await saveAvail(matchId, pid, status);
  renderMatchList();
}

function showPriorityModal(newMatchId, existingMatches, pid){
  const newMatch=state.matches.find(m=>m.id===newMatchId);
  const modal=document.getElementById('priority-modal');
  document.getElementById('priority-modal-title').textContent=tr('priorityTitle');
  document.getElementById('priority-modal-hint').textContent=tr('priorityHint');
  const allMatches=[newMatchId,...existingMatches.map(m=>m.id)];
  const btns=document.getElementById('priority-modal-btns');
  btns.innerHTML=allMatches.map(mid=>{
    const m=state.matches.find(x=>x.id===mid);
    const team=teamById(m.team_id);
    const label=`${team?.name||'?'} vs ${m.opponent} · ${m.time}`;
    return`<button onclick="applyPriority('${mid}',[${allMatches.map(x=>`'${x}'`).join(',')}],'${pid}')"
      style="padding:11px 14px;border-radius:10px;border:1px solid var(--court);background:#1a2e26;color:var(--court);font-family:inherit;font-size:13px;font-weight:600;cursor:pointer;text-align:left">
      ✓ ${label}
    </button>`;
  }).join('');
  modal.style.display='flex';
}

function closePriorityModal(){
  document.getElementById('priority-modal').style.display='none';
}

async function applyPriority(mainMatchId, allMatchIds, pid){
  closePriorityModal();
  const saves=allMatchIds.map(mid=>saveAvail(mid, pid, mid===mainMatchId?'yes':'conditional'));
  await Promise.all(saves);
  renderMatchList();
}

async function saveAvail(matchId, pid, status){
  if(!state.availability[matchId])state.availability[matchId]={};
  state.availability[matchId][pid]=status;
  try{
    await sbUpsert('availability',[{match_id:matchId,player_id:pid,status}]);
  }catch(e){console.error(e);}
}

function toggleTeamFilter(teamId){
  if(teamId===null){activeTeamFilters.clear();}
  else if(activeTeamFilters.has(teamId)){activeTeamFilters.delete(teamId);}
  else{activeTeamFilters.add(teamId);}
  renderMatchList();
}

let showPast=false; // past matches folded away (E8)
// ── Match list: small pieces ──
function escText(t){return (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');}
// the player's teams: Herren → Damen → Jugend, then age group, then team number (1,2,3...)
function matchListTeams(teamIds){
  return teamIds.map(tid=>teamById(tid)).filter(Boolean).sort((a,b)=>{
    const cc=catCmp(a.category,b.category);if(cc)return cc;
    return teamNumber(a)-teamNumber(b);
  });
}
// team chip (filters the list): gold = Stammmannschaft, green = shown
function teamChipHtml(p,t){
  const isActive=activeTeamFilters.size===0||activeTeamFilters.has(t.id);
  const isMT=!!(state.mainTeam[p.id]?.[t.id]);
  return`<span onclick="toggleTeamFilter('${t.id}')" style="font-size:11px;padding:3px 10px;border-radius:10px;cursor:pointer;
            background:${isMT?'rgba(212,160,23,.15)':isActive?'rgba(116,198,157,.2)':'#1a1a1a'};
            border:${isMT?'1.5px solid #d4a017':isActive?'1px solid var(--court)':'1px solid #333'};
            color:${isMT?'#d4a017':isActive?'#74c69d':'#8a9a92'}">${isMT?'★ ':''} ${t.name}</span>`;
}
function playerInfoHtml(p,teams){
  return `<div class="player-card">
    <div class="avatar" style="width:44px;height:44px;font-size:15px">${initials(p.name)}</div>
    <div style="flex:1">
      <div style="font-size:13px;color:var(--muted)">${p.lk_str||p.lkStr||''} · Jg. ${p.year||'—'}</div>
      <div style="display:flex;gap:5px;flex-wrap:wrap;margin-top:6px">
        ${teams.map(t=>teamChipHtml(p,t)).join('')}
        ${activeTeamFilters.size>0?`<span onclick="toggleTeamFilter(null)" style="font-size:11px;padding:3px 10px;border-radius:10px;cursor:pointer;background:#1a1a1a;border:1px solid #333;color:#8a9a92">✕ Alle</span>`:''}
      </div>
      <div style="font-size:11px;color:var(--muted);margin-top:6px">${tr('filterHint')}</div>
      ${teams.some(t=>state.mainTeam[p.id]?.[t.id])?`<div style="font-size:11px;color:#d4a017;margin-top:4px;opacity:.85">${tr('mainTeamHint')}</div>`:''}
    </div>
  </div>`;
}
// matches of the player's teams (only the filtered ones), moved ones included, by date and time
function playerMatches(teamIds){
  const filterIds=activeTeamFilters.size>0?teamIds.filter(id=>activeTeamFilters.has(id)):teamIds;
  return [...state.matches,...(state.movedMatches||[])].filter(m=>filterIds.includes(m.team_id)).sort((a,b)=>a.date.localeCompare(b.date)||(a.time||'').localeCompare(b.time||''));
}
// the old date of a moved match: struck through, with the new date
function movedAwayCard(m,team){
  const d0=fmtDate(m.date);const nm=state.matches.find(x=>x.id===m.moved_to);const nd=nm?fmtDate(nm.date):null;
  return`<div class="match-item" style="cursor:default;opacity:.5;border-style:dashed">
        <div style="display:flex;align-items:center;gap:12px;align-self:stretch">
          <div style="text-align:center;width:44px;flex-shrink:0;text-decoration:line-through">
            <div class="match-date">${d0.day}</div><div class="match-month">${d0.month}</div>
          </div>
          <div class="match-info" style="flex:1">
            <div class="match-teams" style="text-decoration:line-through">${team?.name||'?'} vs ${escText(m.opponent)}</div>
            <div class="match-meta" style="color:var(--warn)">⇄ ${tr('movedBadge')}${nd?` → ${nd.day}. ${nd.month} · ${nm.time}`:''}</div>
          </div>
        </div>
      </div>`;
}
// "moved from <old date>" after the time, for the new date of a moved match
function movedFromNote(m){
  if(!m.moved_from)return'';
  const o=(state.movedMatches||[]).find(x=>x.id===m.moved_from);
  return o?` · <span style="color:var(--warn)">⇄ ${tr('movedFrom')} ${fmtDate(o.date).full}</span>`:'';
}
// day, teams, time; the 📅 button only for matches the player can still play
function matchHeadHtml(m,team,withCal){
  const d=fmtDate(m.date);
  return `<div style="display:flex;align-items:center;gap:12px;align-self:stretch">
        <div style="text-align:center;width:44px;flex-shrink:0">
          <div class="match-date">${d.day}</div>
          <div class="match-month">${ct('wd')[new Date(m.date+'T12:00:00').getDay()]}</div>
        </div>
        <div class="match-info" style="flex:1">
          <div class="match-teams">${team?.name||'?'} vs ${escText(m.opponent)}</div>
          <div class="match-meta">${m.time} · ${homeAwayLabel(m.home)}${movedFromNote(m)}</div>
        </div>
        ${withCal?`<button onclick="makeICS(state.matches.find(x=>x.id==='${m.id}'),teamById('${m.team_id}'))" title="${tr('addCal')}" aria-label="${tr('addCal')}"
          style="background:none;border:1px solid #333;border-radius:8px;color:var(--muted);padding:4px 8px;font-size:15px;line-height:1;cursor:pointer">📅</button>`:''}
      </div>`;
}
function pastMatchCard(head,avail){
  const lbl={yes:tr('yesBtn'),conditional:tr('conditionalBtn'),notfall:tr('notfallBtn'),no:tr('noBtn'),'':tr('noAnswerPast')}[avail]||avail;
  return`<div class="match-item is-past st-${avail||'none'}" style="flex-direction:column;gap:8px;cursor:default">${head}
        <div style="font-size:12px;color:var(--muted);align-self:stretch">${tr('yourAnswer')}: ${lbl}</div></div>`;
}
// why the player may not play this match: the same TVBB rules as admin/kapitaen (common.js), in words
function blockReasons(p,team){
  const st=getPlayerBlockStatus(p.id,team.category),counts=state.matchCounts[p.id]||{};
  const catTeams=state.teams.filter(t=>t.category===team.category);
  const nm=t=>t.name+(teamNumber(t)===1&&catTeams.length>1&&!/\b[IV]+$/.test(t.name)?' I':''); // "Herren" → "Herren I" when there is a Herren II
  const why=[];
  if(st.stammkaderBlocked.some(t=>t.id===team.id)&&st.stammkaderTeam)why.push(tr('reasonSK')(nm(st.stammkaderTeam)));
  if(st.stammmannschaftBlocked.some(t=>t.id===team.id)){
    const higher=catTeams.filter(t=>teamNumber(t)<teamNumber(team)&&(counts[t.id]||0)>0);
    why.push(tr('reasonSM')(higher.reduce((a,t)=>a+(counts[t.id]||0),0),higher.map(nm).join(' + ')));
  }
  return why;
}
// chosen answer = filled button with a strong border; the others stay outlined
function answerBtn(m,st,label,on,color,fill){
  return`<button onclick="quickAvail('${m.id}','${st}',event)"
          style="flex:1;padding:8px 6px;border-radius:20px;font-size:12px;font-weight:600;cursor:pointer;font-family:inherit;white-space:nowrap;
            border:1.5px solid ${on?color:'#34463d'};background:${on?fill:'transparent'};color:${on?'#fff':color}">${label}</button>`;
}
// Ja / Notfall / Nein; a "Prio 2" answer shows as a dashed Ja (tapping it makes it a plain Ja)
function answerButtons(m,avail){
  return `<div style="display:flex;gap:6px;flex-wrap:nowrap;align-self:stretch">
        ${avail==='conditional'?`<button onclick="quickAvail('${m.id}','yes',event)"
          style="flex:1;padding:8px 6px;border-radius:20px;font-size:12px;font-weight:600;cursor:pointer;font-family:inherit;white-space:nowrap;
            border:1.5px dashed var(--court);background:rgba(116,198,157,.12);color:var(--court)">${tr('conditionalBtn')}</button>`
          :answerBtn(m,'yes',tr('yesBtn'),avail==='yes','var(--court)','#2d6a4f')}
        ${answerBtn(m,'notfall',tr('notfallBtn'),avail==='notfall','var(--warn)','#5a3f1f')}
        ${answerBtn(m,'no',tr('noBtn'),avail==='no','#ff6b5b','#5c2a24')}
      </div>`;
}
function matchCardHtml(m,p,today){
  const team=teamById(m.team_id);
  if(m.status==='verlegt')return movedAwayCard(m,team);
  const avail=state.availability[m.id]?.[p.id]||'';
  const isPast=m.date<today;
  const blocked=!isPast&&isPlayerBlockedForTeam(p.id,m.team_id);
  const head=matchHeadHtml(m,team,!(isPast||blocked));
  if(isPast)return pastMatchCard(head,avail);
  if(blocked)return`<div class="match-item is-blocked" style="flex-direction:column;gap:8px;cursor:default">${head}
        <div class="block-why"><strong>${tr('blockedTitle')}:</strong> ${blockReasons(p,team).join(' · ')}</div></div>`;
  return`<div class="match-item st-${avail||'none'}" style="flex-direction:column;gap:10px;cursor:default">${head}
      ${answerButtons(m,avail)}
    </div>`;
}
// answers still missing: coming matches the player may play and has not answered
function todoLineHtml(coming,p){
  if(!coming.some(m=>m.status!=='verlegt'))return'';
  const open=coming.filter(m=>m.status!=='verlegt'&&!(state.availability[m.id]?.[p.id])&&!isPlayerBlockedForTeam(p.id,m.team_id)).length;
  return `<div class="todo-line" style="color:${open?'var(--warn)':'var(--court)'}">${open?tr('unanswered')(open):tr('allAnswered')}</div>`;
}
function renderMatchList(){
  const p=selectedPlayer;
  const teamIds=getPlayerTeamIds(p.id);
  document.getElementById('selected-player-name').textContent=p.name;
  document.getElementById('player-info-card').innerHTML=playerInfoHtml(p,matchListTeams(teamIds));
  const myMatches=playerMatches(teamIds);
  const el=document.getElementById('match-list');
  if(!myMatches.length){el.innerHTML=`<div class="empty">${tr('noMatches')}</div>`;return;}
  const today=new Date().toLocaleDateString('sv-SE'); // YYYY-MM-DD, local
  const past=myMatches.filter(m=>m.date<today),coming=myMatches.filter(m=>m.date>=today);
  const card=m=>matchCardHtml(m,p,today);
  let html=todoLineHtml(coming,p);
  if(past.length){
    html+=`<button class="past-toggle" onclick="showPast=!showPast;renderMatchList()">${showPast?tr('pastHide'):tr('pastShow')(past.length)}</button>`;
    if(showPast)html+=groupByWeekend(past,past.map(card));
  }
  html+=groupByWeekend(coming,coming.map(card));
  el.innerHTML=html;
}

// ── WEEKEND GROUPS ── one header per calendar week (Mon–Sun), labelled by its weekend
function _d(iso){return new Date(iso+'T12:00:00');}
function _iso(d){return d.toISOString().slice(0,10);}
function weekKey(iso){const d=_d(iso);d.setDate(d.getDate()-((d.getDay()+6)%7));return _iso(d);} // Monday of that week
function weekLabel(mondayIso,dates){
  const mon=_d(mondayIso),sat=new Date(mon),sun=new Date(mon);sat.setDate(mon.getDate()+5);sun.setDate(mon.getDate()+6);
  const onlyWeekend=dates.every(x=>{const wd=_d(x).getDay();return wd===0||wd===6;});
  const from=onlyWeekend?sat:mon,to=sun;
  const loc=lang==='de'?'de-DE':lang==='es'?'es-AR':'en-GB';
  const month=d=>d.toLocaleDateString(loc,{month:'long'});
  const sameMonth=from.getMonth()===to.getMonth();
  let range;
  if(lang==='de')range=sameMonth?`${from.getDate()}.${onlyWeekend?'/':'–'}${to.getDate()}. ${month(to)}`:`${from.getDate()}. ${month(from)} – ${to.getDate()}. ${month(to)}`;
  else if(lang==='es')range=sameMonth?`${from.getDate()}${onlyWeekend?'/':'–'}${to.getDate()} de ${month(to)}`:`${from.getDate()} de ${month(from)} – ${to.getDate()} de ${month(to)}`;
  else range=sameMonth?`${from.getDate()}${onlyWeekend?'/':'–'}${to.getDate()} ${month(to)}`:`${from.getDate()} ${month(from)} – ${to.getDate()} ${month(to)}`;
  return `${onlyWeekend?tr('weekend'):tr('week')} ${range}`;
}
function groupByWeekend(list,cards){
  let html='',cur=null;
  list.forEach((m,i)=>{
    const k=weekKey(m.date);
    if(k!==cur){
      cur=k;
      const inWeek=list.filter(x=>weekKey(x.date)===k);
      const count=inWeek.filter(x=>x.status!=='verlegt').length;
      html+=`<div class="wk-head"><span>${weekLabel(k,inWeek.map(x=>x.date))}</span><span>${tr('nMatches')(count)}</span></div>`;
    }
    html+=cards[i];
  });
  return html;
}
