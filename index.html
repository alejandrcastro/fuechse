<html lang="de">
<head>
<meta charset="UTF-8">

<style>
:root{
  --red:#c0392b;--red-light:#e74c3c;
  --green:#2d6a4f;--green-light:#40916c;--green-pale:#e8f5ee;
  --white:#f0f7f2;--dark:#1e2d24;--mid:#263b2e;--muted:#7a9e88;
  --line:#2e4a38;--warn:#f4a261;--court:#52b788;
  --card:#243330;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'DM Sans',sans-serif;background:var(--dark);color:var(--white);min-height:100vh}
::-webkit-scrollbar{width:5px}
::-webkit-scrollbar-track{background:var(--dark)}
::-webkit-scrollbar-thumb{background:var(--green);border-radius:3px}

header{
  background:linear-gradient(160deg,#1b2d23 0%,#2d4a38 60%,#1e2d24 100%);
  padding:20px 24px 18px;border-bottom:3px solid var(--red);
  display:flex;align-items:center;gap:16px;
}
.logo-img{width:54px;height:54px;object-fit:contain;flex-shrink:0}
.header-text h1{font-family:'Bebas Neue',sans-serif;font-size:26px;letter-spacing:2px;color:var(--white)}
.header-text p{font-size:11px;color:var(--muted);letter-spacing:1px;text-transform:uppercase;margin-top:2px}

.lang-bar{display:flex;gap:5px;margin-left:auto}
.lang-btn{padding:4px 10px;font-size:11px;font-weight:600;border:1px solid var(--line);border-radius:6px;cursor:pointer;background:transparent;color:var(--muted);font-family:'DM Sans',sans-serif;transition:all .15s}
.lang-btn.active{background:var(--green-light);color:#fff;border-color:var(--green-light)}

main{padding:20px;max-width:480px;margin:0 auto}

.step{display:none}.step.active{display:block}

.step-label{font-size:11px;font-weight:600;color:var(--court);text-transform:uppercase;letter-spacing:1px;margin-bottom:6px}
.step-title{font-family:'Bebas Neue',sans-serif;font-size:28px;letter-spacing:1px;color:var(--white);margin-bottom:4px}
.step-sub{font-size:13px;color:var(--muted);margin-bottom:20px}

.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin-bottom:12px}

input,select{background:#1b2d24;border:1px solid var(--line);border-radius:8px;color:var(--white);padding:10px 14px;font-family:'DM Sans',sans-serif;font-size:14px;outline:none;width:100%;transition:border-color .2s}
input:focus,select:focus{border-color:var(--court)}
input::placeholder{color:var(--muted)}

.ac-wrap{position:relative}
.ac-list{position:absolute;top:100%;left:0;right:0;background:#243330;border:1px solid #3a5a48;border-radius:10px;z-index:50;max-height:240px;overflow-y:auto;box-shadow:0 8px 30px rgba(0,0,0,.35);margin-top:4px}
.ac-item{padding:11px 14px;font-size:14px;cursor:pointer;color:var(--white);display:flex;align-items:center;gap:10px;border-bottom:1px solid #2e4a3855}
.ac-item:last-child{border-bottom:none}
.ac-item:hover{background:#2e4a38}
.ac-meta{font-size:11px;color:var(--muted);margin-left:auto}
.avatar{width:34px;height:34px;background:var(--green);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:var(--court);flex-shrink:0}

.btn{display:block;width:100%;padding:13px 20px;border-radius:10px;border:none;font-family:'DM Sans',sans-serif;font-size:15px;font-weight:600;cursor:pointer;transition:all .2s;text-align:center;margin-bottom:10px}
.btn-primary{background:var(--green-light);color:#fff}
.btn-primary:hover{background:var(--court);color:var(--dark)}
.btn-outline{background:transparent;border:1px solid var(--line);color:var(--muted)}
.btn-outline:hover{border-color:var(--court);color:var(--court)}
.btn-sm{width:auto;display:inline-block;padding:7px 16px;font-size:13px;margin:0}

.match-item{background:#1b2d24;border:1px solid var(--line);border-radius:10px;padding:13px 15px;margin-bottom:9px;cursor:pointer;transition:all .2s;display:flex;align-items:center;gap:12px}
.match-item:hover{border-color:var(--court)99;background:#243330;transform:translateY(-1px)}
.match-date{font-family:'Bebas Neue',sans-serif;font-size:24px;color:var(--court);line-height:1;min-width:40px;text-align:center}
.match-month{font-size:10px;color:var(--muted);text-align:center;text-transform:uppercase;letter-spacing:.5px}
.match-info{flex:1}
.match-teams{font-weight:600;font-size:14px;color:var(--white)}
.match-meta{font-size:11px;color:var(--muted);margin-top:2px}
.match-avail{font-size:11px;font-weight:700;padding:3px 9px;border-radius:20px;white-space:nowrap}
.av-yes{background:#1a3d2a;color:var(--court);border:1px solid var(--court)55}
.av-no{background:#3d1a1a;color:#e74c3c;border:1px solid #e74c3c44}
.av-maybe{background:#2d2215;color:var(--warn);border:1px solid var(--warn)44}
.av-open{background:#2e4a3844;color:var(--muted);border:1px solid var(--line)}

.avail-btns{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.avail-btn{flex:1;min-width:80px;padding:14px 8px;border-radius:10px;border:1.5px solid transparent;font-family:'DM Sans',sans-serif;font-size:14px;font-weight:600;cursor:pointer;transition:all .15s;text-align:center}
.avail-btn.yes{background:#1a3d2a55;color:var(--court);border-color:var(--court)44}
.avail-btn.yes.on{background:#1a3d2a;color:var(--court);border-color:var(--court);transform:scale(1.04)}
.avail-btn.maybe{background:#2d221555;color:var(--warn);border-color:var(--warn)44}
.avail-btn.maybe.on{background:#2d2215;color:var(--warn);border-color:var(--warn);transform:scale(1.04)}
.avail-btn.no{background:#3d1a1a55;color:#e74c3c;border-color:#e74c3c44}
.avail-btn.no.on{background:#3d1a1a;color:#e74c3c;border-color:#e74c3c;transform:scale(1.04)}

.saved-msg{font-size:13px;color:var(--court);min-height:20px;margin-top:12px;text-align:center;font-weight:500}

.player-card{display:flex;align-items:center;gap:12px;background:#1b2d24;border:1px solid var(--line);border-radius:10px;padding:13px 15px;margin-bottom:14px}
.player-card .avatar{width:44px;height:44px;font-size:15px}
.lk-badge{background:#1b2d24;border:1px solid var(--court)55;color:var(--court);font-size:11px;font-weight:700;padding:2px 8px;border-radius:6px}

.spinner{display:inline-block;width:14px;height:14px;border:2px solid var(--line);border-top-color:var(--court);border-radius:50%;animation:spin .7s linear infinite;vertical-align:middle;margin-right:6px}
@keyframes spin{to{transform:rotate(360deg)}}

.empty{text-align:center;padding:3rem 20px;color:var(--muted);font-size:14px}
.blocked-warn{background:#3d1a1a;border:1px solid #e74c3c44;border-radius:10px;padding:12px 14px;margin-bottom:12px;font-size:13px;color:#e74c3c}

.back-row{display:flex;align-items:center;gap:8px;margin-bottom:18px}
.back-btn{background:none;border:1px solid var(--line);color:var(--muted);border-radius:8px;padding:6px 14px;font-family:'DM Sans',sans-serif;font-size:13px;cursor:pointer;transition:all .15s}
.back-btn:hover{border-color:var(--court);color:var(--court)}

@media(max-width:400px){.avail-btn{font-size:13px;padding:10px 6px}}
</style>
</head>

<script>
// ── CLUB LOGIN ── one shared Supabase account for all players; same password field as before.
// The password is checked by Supabase (no hash in the code). Session lives in this tab (sessionStorage).
const CLUB_EMAIL='spieler@login.fuechse-berlin-reinickendorf.de';
const CLUB_SESSION_KEY='fcb_club_session';
function _clubRead(){try{return JSON.parse(sessionStorage.getItem(CLUB_SESSION_KEY)||'null');}catch(e){return null;}}
function _clubWrite(s){try{s?sessionStorage.setItem(CLUB_SESSION_KEY,JSON.stringify(s)):sessionStorage.removeItem(CLUB_SESSION_KEY);}catch(e){}}
function _clubStore(j){_clubWrite({access_token:j.access_token,refresh_token:j.refresh_token,expires_at:j.expires_at||Math.floor(Date.now()/1000)+(j.expires_in||3600)});}
function clubShowLogin(){const o=document.getElementById('sp-login');o.style.opacity='1';o.style.display='flex';}
// Valid access token for REST calls; refreshes it when it is about to expire (tokens live ~1 h)
let _clubRefreshing=null; // one refresh at a time (refresh tokens are single-use)
function clubToken(){
  const s=_clubRead();if(!s)return Promise.resolve(null);
  if(Date.now()/1000<s.expires_at-60)return Promise.resolve(s.access_token);
  if(!_clubRefreshing)_clubRefreshing=_clubRefresh(s).finally(()=>{_clubRefreshing=null;});
  return _clubRefreshing;
}
async function _clubRefresh(s){
  try{
    const r=await fetch(`${SB_URL}/auth/v1/token?grant_type=refresh_token`,{method:'POST',headers:{'apikey':SB_KEY,'Content-Type':'application/json'},body:JSON.stringify({refresh_token:s.refresh_token})});
    if(r.ok){const j=await r.json();_clubStore(j);return j.access_token;}
  }catch(e){console.warn('refresh',e);}
  _clubWrite(null);clubShowLogin();return null;
}
async function clubHDR(extra){const t=await clubToken();return{'apikey':SB_KEY,'Authorization':'Bearer '+(t||SB_KEY),'Content-Type':'application/json',...(extra||{})};}
if(_clubRead()){document.getElementById('sp-login').style.display='none';}
window.spLogin=async function(){
  const inp=document.getElementById('sp-pw'),err=document.getElementById('sp-err');
  let ok=false;
  try{
    const r=await fetch(`${SB_URL}/auth/v1/token?grant_type=password`,{method:'POST',headers:{'apikey':SB_KEY,'Content-Type':'application/json'},body:JSON.stringify({email:CLUB_EMAIL,password:inp.value})});
    if(r.ok){_clubStore(await r.json());ok=true;}
  }catch(e){console.error(e);}
  if(ok){
    const o=document.getElementById('sp-login');
    o.style.opacity='0';o.style.transition='opacity .3s';
    setTimeout(()=>o.style.display='none',300);
    if(typeof onClubLogin==='function')onClubLogin();
  }else{
    err.textContent='Falsches Passwort';
    inp.value='';
    setTimeout(()=>err.textContent='',2000);
  }
};
</script>

<script>
const SB_URL='https://kepbpcttbvkbcckqoecv.supabase.co';
const SB_KEY='sb_publishable_wDzLASMHgyEcQh8RPmfPRA_HfJotf-n';
// ── ACTIVE SEASON ── switched in admin.html (header). Stored in Supabase → app_settings.
// Format: 'S2026' = Sommer 2026, 'W2026' = Winter 2026/27. The value below is only a fallback.
let ACTIVE_SEASON='W2026';
async function _readSetting(key){
  try{
    const r=await fetch(`${SB_URL}/rest/v1/app_settings?key=eq.${key}&select=value`,{headers:{'apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY}});
    if(!r.ok)return null;const j=await r.json();return j[0]?.value??null;
  }catch(e){console.warn('app_settings',e);return null;}
}
const _seasonReady=(async()=>{const v=await _readSetting('active_season');if(typeof v==='string'&&/^[SW]\d{4}$/.test(v))ACTIVE_SEASON=v;})();

async function sbGet(t,p=''){const r=await fetch(`${SB_URL}/rest/v1/${t}?${p}`,{headers:await clubHDR({'Prefer':''})});if(!r.ok)throw new Error(await r.text());return r.json();}
// Supabase returns max. 1000 rows per request → always page through big tables (stable order required)
async function sbGetAll(t,p=''){let out=[],off=0;while(true){const b=await sbGet(t,`${p}${p?'&':''}limit=1000&offset=${off}`);out=out.concat(b);if(b.length<1000)break;off+=1000;}return out;}
async function sbUpsert(t,d){const r=await fetch(`${SB_URL}/rest/v1/${t}`,{method:'POST',headers:await clubHDR({'Prefer':'resolution=merge-duplicates'}),body:JSON.stringify(d)});if(!r.ok)throw new Error(await r.text());}

const T={

let lang='de';
let state={players:[],teams:[],matches:[],availability:{},matchCounts:{},playerTeams:[],rankByTeam:{}};

function tr(k){return T[lang][k]||T.de[k]||k}

function setLang(l){
  lang=l;
  document.querySelectorAll('.lang-btn').forEach(b=>b.classList.toggle('active',b.textContent===l.toUpperCase()));

}

function initials(n){return n.split(' ').map(w=>w[0]).join('').toUpperCase().slice(0,2)}
function fmtDate(d){
  if(!d)return'';
  const[y,m,day]=d.split('-');
  const months=['Jan','Feb','Mär','Apr','Mai','Jun','Jul','Aug','Sep','Okt','Nov','Dez'];
  return{day,month:months[parseInt(m)-1],full:`${day}.${m}.${y}`};
}
function spieltagOf(m){return (m&&(m.spieltag||m.date))||'';} // WSpO § 11 (4): verlegt keeps the original Spieltag
function teamById(id){return state.teams.find(t=>t.id===id)}
function playerById(id){return state.players.find(p=>p.id===id)}
function getPlayerTeamIds(playerId){return state.playerTeams.filter(r=>r.player_id===playerId).map(r=>r.team_id);}
function teamSize(t){return t&&(t.is_4er||t.season==='Winter')?4:6}
function teamNumber(team){
  const n=parseInt(team.teamNumber||team.team_number||0);
  if(n>0&&n<10)return n;
  const roman={I:1,II:2,III:3,IV:4,V:5,VI:6,VII:7,VIII:8};
  const r=team.name.match(/\b(VIII|VII|VI|IV|V|III|II)\b/);
  if(r)return roman[r[1]]||1;
  return 1;
}
// ── CATEGORY ORDER: Herren (0) → Damen (1) → Jugend U.. (2); Jugend: U18 → U10, m → w → gemischt ──
function catGroup(cat){cat=cat||'';if(/^U\d+/.test(cat))return 2;return /^Damen/i.test(cat)?1:0;}
function catAge(cat){cat=cat||'';const j=cat.match(/^U(\d+)\s*(m|w)?/);if(j)return(100-parseInt(j[1]))+(j[2]==='m'?0:j[2]==='w'?0.1:0.2);return parseInt(cat.replace(/^(Herren|Damen)\s*/,''))||0;}
function catCmp(a,b){return catGroup(a)-catGroup(b)||catAge(a)-catAge(b);}
function teamSortKey(t){
  const g=catGroup(t.category);
  const age=catAge(t.category);
  return[g,age,teamNumber(t)];
}
function teamSortCmp(a,b){
  const ka=teamSortKey(a),kb=teamSortKey(b);
  for(let i=0;i<ka.length;i++)if(ka[i]!==kb[i])return ka[i]-kb[i];
  return 0;
}

function getStammkaderTeam(playerId, catGroup){
  const catTeams=state.teams.filter(t=>t.category===catGroup).sort((a,b)=>teamNumber(a)-teamNumber(b));
  if(!catTeams.length)return null;
  const firstTeam=catTeams[0];
  const rankInCat=state.rankByTeam[playerId]?.[firstTeam.id]??playerById(playerId)?.rank??null;
  if(rankInCat==null)return null;
  let remaining=rankInCat;
  for(const t of catTeams){const gs=teamSize(t);if(remaining<=gs)return t;remaining-=gs;}
  return catTeams[catTeams.length-1];
}


// ── BLOCKING LOGIC ──
// Same dual-rule system as admin:
// Rule 1 – Stammkader: LK position within category → locked to team, blocked in higher-numbered teams
// Rule 2 – Stammmannschaft: 2+ matches in team → blocked in all higher-numbered teams in same category
function isBlocked(playerId,teamId){
  const team=teamById(teamId);if(!team)return false;
  const cat=team.category||'Herren';
  const catTeams=state.teams.filter(t=>t.category===cat).sort((a,b)=>teamNumber(a)-teamNumber(b));
  const counts=state.matchCounts[playerId]||{};
  const thisNum=teamNumber(team);
  // Rule 2: Stammmannschaft — 2+ matches in a higher team → blocked here
  for(const t of catTeams){const c=counts[t.id]||0;if(c>=2&&teamNumber(t)<thisNum)return true;}
  // Rule 1: Stammkader — derive SK team from rank stored against first team
  const firstTeam=catTeams[0];if(!firstTeam)return false;
  const rankInCat=state.rankByTeam[playerId]?.[firstTeam.id]??null;
  if(rankInCat==null)return false;
  let remaining=rankInCat;
  let skTeam=catTeams[catTeams.length-1];
  for(const t of catTeams){const gs=teamSize(t);if(remaining<=gs){skTeam=t;break;}remaining-=gs;}
  if(teamNumber(skTeam)<thisNum)return true;
  return false;
}

async function loadAll(){
  document.getElementById('find-status').textContent=tr('findStatus');
  await _seasonReady;
  try{
    const[teams,players,matches,avRows,countRows]=await Promise.all([
      sbGet('teams',`season_id=eq.${ACTIVE_SEASON}&order=category,team_number`),
      sbGetAll('players',`season_id=eq.${ACTIVE_SEASON}&order=lk,id`),
      sbGetAll('matches','order=date,id'),
      sbGetAll('availability','order=match_id,player_id'),
      sbGetAll('player_match_counts','order=player_id,team_id')
    ]);
    // Map teams same as admin — camelCase teamNumber so teamNumber() works correctly
    state.teams=teams.map(t=>({id:t.id,name:t.name,liga:t.liga,season:t.season,is_4er:t.is_4er||false,category:t.category||'Herren',teamNumber:t.team_number||1,gender:t.gender}));
    const _activeTeamIds=new Set(state.teams.map(t=>t.id));
    state.players=players.map(p=>({...p,lkStr:p.lk_str,rawName:p.raw_name,year:p.year}));
    const _seasonMatches=matches.filter(m=>_activeTeamIds.has(m.team_id)).map(m=>({...m,teamId:m.team_id}));
    // Verlegt (rescheduled by the captain): original is shown crossed out, answers go to the new match
    state.matches=_seasonMatches.filter(m=>m.status!=='verlegt');
    state.movedMatches=_seasonMatches.filter(m=>m.status==='verlegt');
    state.availability={};
    for(const r of avRows){if(!state.availability[r.match_id])state.availability[r.match_id]={};state.availability[r.match_id][r.player_id]=r.status;}
    state.matchCounts={};
    for(const r of countRows){if(!state.matchCounts[r.player_id])state.matchCounts[r.player_id]={};state.matchCounts[r.player_id][r.team_id]=r.matches_played;}
    // Paginate player_teams — there are >1000 rows
    let ptRows=[],ptOffset=0;
    while(true){
      const batch=await sbGet('player_teams',`order=player_id,team_id&limit=1000&offset=${ptOffset}`);
      ptRows=ptRows.concat(batch);
      if(batch.length<1000)break;
      ptOffset+=1000;
    }
    ptRows=ptRows.filter(r=>_activeTeamIds.has(r.team_id)); // other seasons stay archived
    state.playerTeams=ptRows;
    state.rankByTeam={};
    state.mainTeam={};
    for(const r of ptRows){
      if(r.rank!=null){
        if(!state.rankByTeam[r.player_id])state.rankByTeam[r.player_id]={};
        state.rankByTeam[r.player_id][r.team_id]=r.rank;
      }
      if(r.is_mainteam){
        if(!state.mainTeam[r.player_id])state.mainTeam[r.player_id]={};
        state.mainTeam[r.player_id][r.team_id]=true;
      }
    }
    document.getElementById('find-status').textContent='';
  }catch(e){document.getElementById('find-status').textContent='Verbindungsfehler. Bitte Seite neu laden.';console.error(e);}
}

function showStep(name){
  document.querySelectorAll('.step').forEach(s=>s.classList.remove('active'));

  window.scrollTo(0,0);
}

function goFind(){selectedPlayer=null;showStep('find');}
function goMatches(){if(!selectedPlayer)return showStep('find');activeTeamFilters.clear();renderMatchList();showStep('matches');}

function makeICS(m,team){
  const dt=m.date.replace(/-/g,'');
  const tm=(m.time||'10:00').replace(':','')+'00';
  // Estimate end time +3 hours
  const hh=parseInt((m.time||'10:00').split(':')[0]);
  const mm=(m.time||'10:00').split(':')[1];
  const endHH=String(hh+3).padStart(2,'0');
  const dtEnd=dt+'T'+endHH+mm+'00';
  const dtStart=dt+'T'+tm;
  const summary=m.home==='Heim'?`${team?.name||'?'} vs ${m.opponent}`:`${m.opponent} vs ${team?.name||'?'}`;
  const loc=m.venue||'';
  const uid2=`${m.id}@fuchseberlin`;
  const ics=[
    'BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Füchse Berlin//Club Manager//DE',
    'BEGIN:VEVENT',
    `DTSTART:${dtStart}`,`DTEND:${dtEnd}`,
    `SUMMARY:${summary}`,
    `LOCATION:${loc}`,
    `DESCRIPTION:${m.home} · ${m.time}`,
    `UID:${uid2}`,
    'END:VEVENT','END:VCALENDAR'
  ].join('\r\n');
  const blob=new Blob([ics],{type:'text/calendar'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;a.download=`${summary.replace(/[^a-zA-Z0-9]/g,'_')}.ics`;
  a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);
}

async function quickAvail(matchId,status,event){
  event.stopPropagation();
  if(!selectedPlayer)return;
  const pid=selectedPlayer.id;

  if(status==='yes'){
    const thisMatch=state.matches.find(m=>m.id===matchId);
    if(thisMatch){
      // Check for other yes/conditional on same day
      const sameDay=state.matches.filter(m=>
        m.id!==matchId &&
        spieltagOf(m)===spieltagOf(thisMatch) &&
        (state.availability[m.id]?.[pid]==='yes'||state.availability[m.id]?.[pid]==='conditional')
      );
      if(sameDay.length>0){
        // Show priority modal — let player choose which is the main match
        showPriorityModal(matchId, sameDay, pid);
        return;
      }
    }
  }

  // conditional cannot be set manually
  if(status==='conditional')return;

  await saveAvail(matchId, pid, status);
  renderMatchList();
}

function showPriorityModal(newMatchId, existingMatches, pid){
  const newMatch=state.matches.find(m=>m.id===newMatchId);
  const modal=document.getElementById('priority-modal');
  document.getElementById('priority-modal-title').textContent=tr('priorityTitle');
  document.getElementById('priority-modal-hint').textContent=tr('priorityHint');
  const allMatches=[newMatchId,...existingMatches.map(m=>m.id)];
  const btns=document.getElementById('priority-modal-btns');
  btns.innerHTML=allMatches.map(mid=>{
    const m=state.matches.find(x=>x.id===mid);
    const team=teamById(m.team_id);
    const label=`${team?.name||'?'} vs ${m.opponent} · ${m.time}`;
    return`<button onclick="applyPriority('${mid}',[${allMatches.map(x=>`'${x}'`).join(',')}],'${pid}')"
      style="padding:11px 14px;border-radius:10px;border:1px solid var(--court);background:#1a2e26;color:var(--court);font-family:inherit;font-size:13px;font-weight:600;cursor:pointer;text-align:left">
      ✓ ${label}
    </button>`;
  }).join('');
  modal.style.display='flex';
}

function closePriorityModal(){
  document.getElementById('priority-modal').style.display='none';
}

async function applyPriority(mainMatchId, allMatchIds, pid){
  closePriorityModal();
  const saves=allMatchIds.map(mid=>saveAvail(mid, pid, mid===mainMatchId?'yes':'conditional'));
  await Promise.all(saves);
  renderMatchList();
}

async function saveAvail(matchId, pid, status){
  if(!state.availability[matchId])state.availability[matchId]={};
  state.availability[matchId][pid]=status;
  try{
    await sbUpsert('availability',[{match_id:matchId,player_id:pid,status}]);
  }catch(e){console.error(e);}
}

function toggleTeamFilter(teamId){
  if(teamId===null){activeTeamFilters.clear();}
  else if(activeTeamFilters.has(teamId)){activeTeamFilters.delete(teamId);}
  else{activeTeamFilters.add(teamId);}
  renderMatchList();
}

function renderMatchList(){
  const p=selectedPlayer;
  const teamIds=getPlayerTeamIds(p.id);
  document.getElementById('selected-player-name').textContent=p.name;
  const teams=teamIds.map(tid=>teamById(tid)).filter(Boolean).sort((a,b)=>{
    // Herren → Damen → Jugend, then age group, then team number (1,2,3...)
    const cc=catCmp(a.category,b.category);if(cc)return cc;
    return teamNumber(a)-teamNumber(b);
  });
  document.getElementById('player-info-card').innerHTML=`<div class="player-card">
    <div class="avatar" style="width:44px;height:44px;font-size:15px">${initials(p.name)}</div>
    <div style="flex:1">
      <div style="font-size:13px;color:var(--muted)">${p.lk_str||p.lkStr||''} · Jg. ${p.year||'—'}</div>
      <div style="display:flex;gap:5px;flex-wrap:wrap;margin-top:6px">
        ${teams.map(t=>{const isActive=activeTeamFilters.size===0||activeTeamFilters.has(t.id);
          const isMT=!!(state.mainTeam[p.id]?.[t.id]);
          return`<span onclick="toggleTeamFilter('${t.id}')" style="font-size:11px;padding:3px 10px;border-radius:10px;cursor:pointer;
            background:${isMT?'rgba(212,160,23,.15)':isActive?'rgba(116,198,157,.2)':'#1a1a1a'};
            border:${isMT?'1.5px solid #d4a017':isActive?'1px solid var(--court)':'1px solid #333'};
            color:${isMT?'#d4a017':isActive?'var(--court)':'#555'}">${isMT?'★ ':''} ${t.name}</span>`;
        }).join('')}
        ${activeTeamFilters.size>0?`<span onclick="toggleTeamFilter(null)" style="font-size:11px;padding:3px 10px;border-radius:10px;cursor:pointer;background:#1a1a1a;border:1px solid #333;color:#555">✕ Alle</span>`:''}
      </div>
      <div style="font-size:11px;color:#555;margin-top:6px">${tr('filterHint')}</div>
      ${teams.some(t=>state.mainTeam[p.id]?.[t.id])?`<div style="font-size:11px;color:#d4a017;margin-top:4px;opacity:.85">${tr('mainTeamHint')}</div>`:''}
    </div>
  </div>`;
  const filterIds=activeTeamFilters.size>0?teamIds.filter(id=>activeTeamFilters.has(id)):teamIds;
  const myMatches=[...state.matches,...(state.movedMatches||[])].filter(m=>filterIds.includes(m.team_id)).sort((a,b)=>a.date.localeCompare(b.date)||(a.time||'').localeCompare(b.time||''));
  const el=document.getElementById('match-list');
  if(!myMatches.length){el.innerHTML=`<div class="empty">${tr('noMatches')}</div>`;return;}
  el.innerHTML=myMatches.map(m=>{
    const team=teamById(m.team_id);
    if(m.status==='verlegt'){
      const d0=fmtDate(m.date);const nm=state.matches.find(x=>x.id===m.moved_to);const nd=nm?fmtDate(nm.date):null;
      return`<div class="match-item" style="cursor:default;opacity:.5;border-style:dashed">
        <div style="display:flex;align-items:center;gap:12px;align-self:stretch">
          <div style="text-align:center;width:44px;flex-shrink:0;text-decoration:line-through">
            <div class="match-date">${d0.day}</div><div class="match-month">${d0.month}</div>
          </div>
          <div class="match-info" style="flex:1">
            <div class="match-teams" style="text-decoration:line-through">${team?.name||'?'} vs ${(m.opponent||'').replace(/&/g,'&amp;').replace(/</g,'&lt;')}</div>
            <div class="match-meta" style="color:var(--warn)">⇄ ${tr('movedBadge')}${nd?` → ${nd.day}. ${nd.month} · ${nm.time}`:''}</div>
          </div>
        </div>
      </div>`;
    }
    const avail=state.availability[m.id]?.[p.id]||'';
    const d=fmtDate(m.date);
    const blocked=isBlocked(p.id,m.team_id);
    const yes=avail==='yes',conditional=avail==='conditional',notfall=avail==='notfall',no=avail==='no';
    return`<div class="match-item" style="flex-direction:column;gap:10px;cursor:default">
      <div style="display:flex;align-items:center;gap:12px;align-self:stretch">
        <div style="text-align:center;width:44px;flex-shrink:0">
          <div class="match-date">${d.day}</div>
          <div class="match-month">${d.month}</div>
        </div>
        <div class="match-info" style="flex:1">
          <div class="match-teams">${team?.name||'?'} vs ${(m.opponent||'').replace(/&/g,'&amp;').replace(/</g,'&lt;')}</div>
          <div class="match-meta">${m.time} · ${m.home}${blocked?' · ⛔':''}${m.moved_from?(()=>{const o=(state.movedMatches||[]).find(x=>x.id===m.moved_from);return o?` · <span style="color:var(--warn)">⇄ ${tr('movedFrom')} ${fmtDate(o.date).full}</span>`:'';})():''}</div>
        </div>
        <button onclick="makeICS(state.matches.find(x=>x.id==='${m.id}'),teamById('${m.team_id}'))"
          style="background:none;border:1px solid #333;border-radius:8px;color:var(--muted);padding:4px 8px;font-size:11px;cursor:pointer;white-space:nowrap">
          📅 .ics
        </button>
      </div>
      <div style="display:flex;gap:6px;flex-wrap:nowrap;align-self:stretch">
        <button onclick="quickAvail('${m.id}','yes',event)"
          style="flex:1;padding:8px 6px;border-radius:20px;font-size:12px;font-weight:600;cursor:pointer;font-family:inherit;white-space:nowrap;
            border:${avail==='conditional'?'1px dashed var(--court)':'1px solid '+( avail==='yes'?'var(--court)':'#2e4a42')};
            background:${avail==='yes'?'var(--court)':avail==='conditional'?'rgba(116,198,157,.12)':'transparent'};
            color:${avail==='yes'?'#0d1a10':'var(--court)'}">
          ${avail==='conditional'?tr('conditionalBtn'):'✓ '+tr('yesBtn').replace('✓ ','')}</button>
        <button onclick="quickAvail('${m.id}','notfall',event)"
          style="flex:1;padding:8px 6px;border-radius:20px;font-size:12px;font-weight:600;cursor:pointer;font-family:inherit;white-space:nowrap;
            border:1px solid ${avail==='notfall'?'var(--warn)':'#333'};
            background:${avail==='notfall'?'rgba(244,162,97,.15)':'transparent'};
            color:var(--warn)">
          ${tr('notfallBtn')}</button>
        <button onclick="quickAvail('${m.id}','no',event)"
          style="flex:1;padding:8px 6px;border-radius:20px;font-size:12px;font-weight:600;cursor:pointer;font-family:inherit;white-space:nowrap;
            border:1px solid ${avail==='no'?'var(--red)':'#3a2020'};
            background:${avail==='no'?'rgba(230,57,70,.15)':'transparent'};
            color:var(--red)">
          ✗ ${tr('noBtn').replace('✗ ','')}</button>
      </div>
    </div>`;
  }).join('');
}

function selectMatch(id){
  selectedMatch=state.matches.find(m=>m.id===id);
  if(!selectedMatch)return;
  renderConfirm();showStep('confirm');
}

function renderConfirm(){
  const m=selectedMatch;const p=selectedPlayer;
  const team=teamById(m.team_id);
  const d=fmtDate(m.date);
  const blocked=isBlocked(p.id,m.team_id);
  const avail=state.availability[m.id]?.[p.id]||'';
  document.getElementById('confirm-match-name').textContent=`${team?.name||'?'} vs ${m.opponent}`;
  document.getElementById('confirm-match-meta').textContent=`${d.full} · ${m.time} · ${m.home}`;
  document.getElementById('confirm-player-card').innerHTML=`<div class="player-card">
    <div class="avatar">${initials(p.name)}</div>
    <div><div style="font-weight:600">${p.name}</div><div style="font-size:12px;color:var(--muted)">${p.lk_str||p.lkStr||''} · Jg. ${p.year||'—'}</div></div>
  </div>`;
  document.getElementById('confirm-blocked').innerHTML=blocked?`<div class="blocked-warn">${tr('blockedWarn')}</div>`:'';
  ['yes','notfall','no'].forEach(s=>{document.getElementById('btn-'+s).classList.toggle('on',avail===s);});
  document.getElementById('btn-yes').textContent=avail==='conditional'?tr('conditionalBtn'):'✓ '+tr('yesBtn').replace('✓ ','');
  document.getElementById('btn-yes').style.borderStyle=avail==='conditional'?'dashed':'solid';
  document.getElementById('saved-msg').textContent=avail?tr('saved'):'';
}

async function setAvail(status){
  if(!selectedMatch||!selectedPlayer)return;
  const matchId=selectedMatch.id,playerId=selectedPlayer.id;
  if(status==='conditional')return; // cannot set manually
  document.getElementById('saved-msg').innerHTML=`<span class="spinner"></span>${tr('saving')}`;

  if(status==='yes'){
    const thisMatch=state.matches.find(m=>m.id===matchId);
    if(thisMatch){
      const sameDay=state.matches.filter(m=>
        m.id!==matchId &&
        spieltagOf(m)===spieltagOf(thisMatch) &&
        (state.availability[m.id]?.[playerId]==='yes'||state.availability[m.id]?.[playerId]==='conditional')
      );
      if(sameDay.length>0){
        showPriorityModal(matchId, sameDay, playerId);
        document.getElementById('saved-msg').textContent='';
        return;
      }
    }
  }

  await saveAvail(matchId, playerId, status);
  ['yes','notfall','no'].forEach(s=>document.getElementById('btn-'+s).classList.toggle('on',s===status));
  document.getElementById('btn-yes').textContent=status==='conditional'?tr('conditionalBtn'):'✓ '+tr('yesBtn').replace('✓ ','');
  document.getElementById('saved-msg').textContent=tr('saved');
  setTimeout(()=>{if(selectedPlayer)renderMatchList();},300);
}
